openapi: 3.0.0
info:
  title: PackageRolesResponse API
  version: 1.0.0
paths:
  /package_roles:
    get:
      operationId: listPackageRoles
      summary: Get all package_roles
      responses:
        '200':
          description: List of package_roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageRolesResponse'
    post:
      operationId: createPackageRole
      summary: Create a new package_roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRolesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageRolesResponse'

  /package_roles/{id}:
    get:
      operationId: getPackageRolesById
      summary: Get package_roles by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: package_roles object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageRolesResponse'
    put:
      operationId: updatePackageRole
      summary: Update package_roles by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRolesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageRolesResponse'
    delete:
      operationId: deletePackageRole
      summary: Delete package_roles by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    PackageRolesRequest:
      type: object
      properties:
        id:
          type: integer
        package_role_name:
          type: string
          maxLength: 30
        package_role_key:
          type: string
          maxLength: 30
        status:
          type: string

    PackageRolesResponse:
      type: object
      properties:
        id:
          type: integer
        package_role_name:
          type: string
          maxLength: 30
        package_role_key:
          type: string
          maxLength: 30
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
