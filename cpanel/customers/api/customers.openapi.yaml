openapi: 3.0.0
info:
  title: CustomersResponse API
  version: 1.0.0
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: Get all customers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomersResponse'
    post:
      operationId: createCustomer
      summary: Create a new customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomersRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersResponse'

  /customers/{id}:
    get:
      operationId: getCustomersById
      summary: Get customers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: customers object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersResponse'
    put:
      operationId: updateCustomer
      summary: Update customers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomersRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersResponse'
    delete:
      operationId: deleteCustomer
      summary: Delete customers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CustomersRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        contact_title:
          type: string
          maxLength: 20
        customer_type:
          type: string
          maxLength: 10
        contact_name:
          type: string
          maxLength: 50
        customer_status_id:
          type: integer
        created_by:
          type: integer
        updated_by:
          type: integer
        customer_number:
          type: string
          maxLength: 10
        type:
          type: string
          maxLength: 10
        customer_email:
          type: string
          maxLength: 150
        client_email:
          type: string
          maxLength: 150
        dba:
          type: string
          maxLength: 50
        contract_start_date:
          type: string
          format: date
        contract_expire_date:
          type: string
          format: date
        cost_center:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 30
        state_id:
          type: integer
        country_id:
          type: integer
        postal_code:
          type: integer
        phone_number:
          type: integer
        street_address:
          type: string
          maxLength: 22
        chain_number:
          type: string
          maxLength: 20
        sic_code:
          type: integer
        branch_id:
          type: integer
        status:
          type: string
        hours_elapsed:
          type: integer
        minutes_elapsed:
          type: integer
        is_new_client:
          type: string
        allow_package_upgrade:
          type: string
        deleted_at:
          type: string
          format: date-time

    CustomersResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        contact_title:
          type: string
          maxLength: 20
        customer_type:
          type: string
          maxLength: 10
        contact_name:
          type: string
          maxLength: 50
        customer_status_id:
          type: integer
        created_by:
          type: integer
        updated_by:
          type: integer
        customer_number:
          type: string
          maxLength: 10
        type:
          type: string
          maxLength: 10
        customer_email:
          type: string
          maxLength: 150
        client_email:
          type: string
          maxLength: 150
        dba:
          type: string
          maxLength: 50
        contract_start_date:
          type: string
          format: date
        contract_expire_date:
          type: string
          format: date
        cost_center:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 30
        state_id:
          type: integer
        country_id:
          type: integer
        postal_code:
          type: integer
        phone_number:
          type: integer
        street_address:
          type: string
          maxLength: 22
        chain_number:
          type: string
          maxLength: 20
        sic_code:
          type: integer
        branch_id:
          type: integer
        status:
          type: string
        hours_elapsed:
          type: integer
        minutes_elapsed:
          type: integer
        is_new_client:
          type: string
