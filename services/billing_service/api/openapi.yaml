openapi: 3.1.0
info:
  title: Sample Fastify Sequelize API
  version: 1.0.0

servers:
  - url: https://api.example.com/v1

paths:
  /users:
    get:
      summary: Get all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: './components/schemas/users/get-response.yaml'
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/users/post-request.yaml'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: './components/schemas/users/get-response.yaml'

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Database connection status
          content:
            application/json:
              schema:
                $ref: './components/schemas/health/response.yaml'

  /login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth/login-request.yaml'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth/login-response.yaml'
        '401':
          description: Invalid credentials

  /logout:
    post:
      summary: User logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth/logout-response.yaml'
