openapi: 3.0.0
x-sql-table: metering_quota_alert
info:
  title: QuotaAlertResponse API
  version: 1.0.0
paths:
  /quota_alert:
    get:
      operationId: listQuotaAlert
      summary: Get all quota_alert
      responses:
        '200':
          description: List of quota_alert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuotaAlertResponse'
    post:
      operationId: createQuotaAlert
      summary: Create a new quota_alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaAlertRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaAlertResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /quota_alert/{id}:
    get:
      operationId: getQuotaAlertById
      summary: Get quota_alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: quota_alert object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaAlertResponse'
        '404':
          description: quota_alert not found
    put:
      operationId: updateQuotaAlert
      summary: Update quota_alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaAlertUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaAlertResponse'
        '400':
          description: Invalid request
        '404':
          description: quota_alert not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteQuotaAlert
      summary: Delete quota_alert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: quota_alert not found
