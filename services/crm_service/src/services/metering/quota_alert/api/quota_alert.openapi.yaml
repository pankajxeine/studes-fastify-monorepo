        - period_start
        - threshold_percent
        - used_quantity
        - limit_quantity
      additionalProperties: false
      properties:
        tenant_application_id:
          type: string
          format: uuid
        meter_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date-time
        threshold_percent:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        used_quantity:
          type: number
          format: double
        limit_quantity:
          type: number
          format: double
        triggered_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
          nullable: true

    QuotaAlertUpdateRequest:
