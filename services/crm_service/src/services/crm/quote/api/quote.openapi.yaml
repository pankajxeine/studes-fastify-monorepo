          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        price_book_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 16
          default: "draft"
        valid_until:
          type: string
          format: date
        subtotal:
          type: string
          default: 0
        discount_total:
          type: string
          default: 0
        total:
          type: string
          default: 0
        max_discount_percent:
          type: string
          default: 0
        coupon_id:
          type: string
          format: uuid
          nullable: true
        terms:
          type: string
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
