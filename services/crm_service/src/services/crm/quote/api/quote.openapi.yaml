openapi: 3.0.0
x-sql-table: crm_quote
info:
  title: QuoteResponse API
  version: 1.0.0
paths:
  /quote:
    get:
      operationId: listQuote
      summary: Get all quote
      responses:
        '200':
          description: List of quote
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteResponse'
    post:
      operationId: createQuote
      summary: Create a new quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /quote/{id}:
    get:
      operationId: getQuoteById
      summary: Get quote by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: quote object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          description: quote not found
    put:
      operationId: updateQuote
      summary: Update quote by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request
        '404':
          description: quote not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteQuote
      summary: Delete quote by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: quote not found
components:
  schemas:

    QuoteRequest:
      type: object
      required:
        - opportunity_id
        - account_id
        - price_book_id
        - valid_until
      additionalProperties: false
      properties:
        quote_number:
          type: string
          maxLength: 20
        opportunity_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        price_book_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 16
          default: "draft"
        valid_until:
          type: string
          format: date
        subtotal:
          type: string
          default: 0
        discount_total:
          type: string
          default: 0
        total:
          type: string
          default: 0
        max_discount_percent:
          type: string
          default: 0
        coupon_id:
          type: string
          format: uuid
          nullable: true
        terms:
          type: string
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        accepted_by_contact_id:
          type: string
          format: uuid
          nullable: true

    QuoteUpdateRequest:
      type: object
