openapi: 3.0.0
x-sql-table: support_queue
info:
  title: QueueResponse API
  version: 1.0.0
paths:
  /queue:
    get:
      operationId: listQueue
      summary: Get all queue
      responses:
        '200':
          description: List of queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueResponse'
    post:
      operationId: createQueue
      summary: Create a new queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /queue/{id}:
    get:
      operationId: getQueueById
      summary: Get queue by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: queue object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '404':
          description: queue not found
    put:
      operationId: updateQueue
      summary: Update queue by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '400':
          description: Invalid request
        '404':
          description: queue not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteQueue
      summary: Delete queue by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: queue not found
components:
  schemas:

    QueueRequest:
      type: object
      required:
        - queue_code
        - name
      additionalProperties: false
      properties:
        queue_code:
          type: string
        name:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        application_id:
          type: string
          format: uuid
          nullable: true
        is_default:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true

    QueueUpdateRequest:
      type: object
      required:
        - queue_code
        - name
        - team_id
        - application_id
        - is_default
        - is_active
      additionalProperties: false
      properties:
        queue_code:
          type: string
        name:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        application_id:
          type: string
          format: uuid
          nullable: true
        is_default:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true

    QueueResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - queue_id
        - queue_code
        - name
        - is_default
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        queue_id:
          type: string
          format: uuid
          readOnly: true
        queue_code:
          type: string
        name:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        application_id:
          type: string
          format: uuid
          nullable: true
        is_default:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
