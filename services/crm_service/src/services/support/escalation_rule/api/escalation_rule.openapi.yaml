          format: uuid
          nullable: true
        priority:
          type: string
          nullable: true
        metric:
          type: string
          maxLength: 14
        minutes_before_breach:
          type: integer
          format: int32
          default: 0
        action:
          type: string
          maxLength: 14
        target_user_id:
          type: string
          format: uuid
          nullable: true
        target_queue_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
          default: true

    EscalationRuleUpdateRequest:
