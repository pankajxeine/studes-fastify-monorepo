openapi: 3.0.0
x-sql-table: support_escalation_rule
info:
  title: EscalationRuleResponse API
  version: 1.0.0
paths:
  /escalation_rule:
    get:
      operationId: listEscalationRule
      summary: Get all escalation_rule
      responses:
        '200':
          description: List of escalation_rule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalationRuleResponse'
    post:
      operationId: createEscalationRule
      summary: Create a new escalation_rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRuleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationRuleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /escalation_rule/{id}:
    get:
      operationId: getEscalationRuleById
      summary: Get escalation_rule by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: escalation_rule object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationRuleResponse'
        '404':
          description: escalation_rule not found
    put:
      operationId: updateEscalationRule
      summary: Update escalation_rule by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRuleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationRuleResponse'
        '400':
          description: Invalid request
        '404':
          description: escalation_rule not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteEscalationRule
      summary: Delete escalation_rule by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: escalation_rule not found
components:
