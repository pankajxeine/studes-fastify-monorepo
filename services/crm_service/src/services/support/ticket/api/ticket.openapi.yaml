openapi: 3.0.0
x-sql-table: support_ticket
info:
  title: TicketResponse API
  version: 1.0.0
paths:
  /ticket:
    get:
      operationId: listTicket
      summary: Get all ticket
      responses:
        '200':
          description: List of ticket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
    post:
      operationId: createTicket
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /ticket/{id}:
    get:
      operationId: getTicketById
      summary: Get ticket by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: ticket object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: ticket not found
    put:
      operationId: updateTicket
      summary: Update ticket by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid request
        '404':
          description: ticket not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTicket
      summary: Delete ticket by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: ticket not found
components:
  schemas:

    TicketRequest:
      type: object
      required:
        - account_id
        - queue_id
        - category
        - subject
        - description
        - channel
        - sla_policy_id
        - first_response_due_at
        - resolution_due_at
      additionalProperties: false
      properties:
        ticket_number:
          type: string
          maxLength: 20
        tenant_id:
          type: string
          format: uuid
          nullable: true
        account_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
          nullable: true
        application_id:
          type: string
          format: uuid
          nullable: true
        module_id:
          type: string
          format: uuid
          nullable: true
        queue_id:
          type: string
          format: uuid
        category:
          type: string
        subject:
          type: string
        description:
          type: string
        channel:
          type: string
          maxLength: 8
        priority:
          type: string
          default: "p3"
        status:
          type: string
          default: "new"
        assignee_user_id:
          type: string
          format: uuid
          nullable: true
        sla_policy_id:
          type: string
          format: uuid
        first_response_due_at:
          type: string
          format: date-time
        resolution_due_at:
          type: string
          format: date-time
        first_responded_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        sla_paused_at:
          type: string
          format: date-time
          nullable: true
        first_response_breached:
          type: boolean
          default: false
        resolution_breached:
          type: boolean
          default: false
        reopened_count:
          type: integer
          format: int32
          default: 0
        parent_ticket_id:
          type: string
          format: uuid
          nullable: true
        external_ref:
          type: string
          nullable: true
          maxLength: 60

