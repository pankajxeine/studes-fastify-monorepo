        - kind
        - secret_ref
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        kind:
          type: string
        label:
          type: string
          nullable: true
          maxLength: 60
        secret_ref:
          type: string
        webauthn_credential_id:
          type: string
          nullable: true
        is_primary:
          type: boolean
          default: false
        verified_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    MfaFactorUpdateRequest:
