openapi: 3.0.0
x-sql-table: iam_mfa_factor
info:
  title: MfaFactorResponse API
  version: 1.0.0
paths:
  /mfa_factor:
    get:
      operationId: listMfaFactor
      summary: Get all mfa_factor
      responses:
        '200':
          description: List of mfa_factor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MfaFactorResponse'
    post:
      operationId: createMfaFactor
      summary: Create a new mfa_factor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaFactorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaFactorResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /mfa_factor/{id}:
    get:
      operationId: getMfaFactorById
      summary: Get mfa_factor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: mfa_factor object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaFactorResponse'
        '404':
          description: mfa_factor not found
    put:
      operationId: updateMfaFactor
      summary: Update mfa_factor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaFactorUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaFactorResponse'
        '400':
          description: Invalid request
        '404':
          description: mfa_factor not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMfaFactor
      summary: Delete mfa_factor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: mfa_factor not found
components:
  schemas:

    MfaFactorRequest:
      type: object
      required:
