openapi: 3.0.0
x-sql-table: iam_password_reset_token
info:
  title: PasswordResetTokenResponse API
  version: 1.0.0
paths:
  /password_reset_token:
    get:
      operationId: listPasswordResetToken
      summary: Get all password_reset_token
      responses:
        '200':
          description: List of password_reset_token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasswordResetTokenResponse'
    post:
      operationId: createPasswordResetToken
      summary: Create a new password_reset_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /password_reset_token/{id}:
    get:
      operationId: getPasswordResetTokenById
      summary: Get password_reset_token by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: password_reset_token object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenResponse'
        '404':
          description: password_reset_token not found
    put:
      operationId: updatePasswordResetToken
      summary: Update password_reset_token by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetTokenUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetTokenResponse'
        '400':
          description: Invalid request
        '404':
          description: password_reset_token not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePasswordResetToken
      summary: Delete password_reset_token by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: password_reset_token not found
components:
  schemas:

    PasswordResetTokenRequest:
      type: object
      required:
        - app_user_id
        - token_hash
        - expires_at
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        channel:
          type: string
          maxLength: 10
          default: "email"
        requested_at:
          type: string
          format: date-time
        requested_ip:
          type: string
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        invalidated_at:
          type: string
          format: date-time
          nullable: true

    PasswordResetTokenUpdateRequest:
      type: object
      required:
        - app_user_id
        - token_hash
        - channel
        - requested_at
        - requested_ip
        - issued_by_user_id
        - expires_at
        - used_at
        - invalidated_at
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        channel:
          type: string
          maxLength: 10
          default: "email"
        requested_at:
          type: string
          format: date-time
        requested_ip:
          type: string
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        invalidated_at:
          type: string
          format: date-time
          nullable: true

    PasswordResetTokenResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - password_reset_token_id
        - app_user_id
        - token_hash
        - channel
        - requested_at
        - expires_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        password_reset_token_id:
          type: string
          format: uuid
          readOnly: true
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        channel:
          type: string
          maxLength: 10
          default: "email"
        requested_at:
          type: string
          format: date-time
        requested_ip:
          type: string
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        invalidated_at:
          type: string
          format: date-time
          nullable: true
  
