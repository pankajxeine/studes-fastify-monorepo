          type: string
          format: uuid
        role_code:
          type: string
        scope_type:
          type: string
          default: "global"
        scope_id:
          type: string
          format: uuid
          nullable: true
        justification:
          type: string
        ticket_ref:
          type: string
          nullable: true
          maxLength: 40
        requested_minutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 1440
        status:
          type: string
          maxLength: 10
          default: "pending"
        decided_by_user_id:
          type: string
          format: uuid
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        decision_note:
