openapi: 3.0.0
x-sql-table: iam_privileged_access_request
info:
  title: PrivilegedAccessRequestResponse API
  version: 1.0.0
paths:
  /privileged_access_request:
    get:
      operationId: listPrivilegedAccessRequest
      summary: Get all privileged_access_request
      responses:
        '200':
          description: List of privileged_access_request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivilegedAccessRequestResponse'
    post:
      operationId: createPrivilegedAccessRequest
      summary: Create a new privileged_access_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegedAccessRequestRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegedAccessRequestResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /privileged_access_request/{request_id}:
    get:
      operationId: getPrivilegedAccessRequestById
      summary: Get privileged_access_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: privileged_access_request object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegedAccessRequestResponse'
        '404':
          description: privileged_access_request not found
    put:
      operationId: updatePrivilegedAccessRequest
      summary: Update privileged_access_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegedAccessRequestUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegedAccessRequestResponse'
        '400':
          description: Invalid request
        '404':
          description: privileged_access_request not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePrivilegedAccessRequest
      summary: Delete privileged_access_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
