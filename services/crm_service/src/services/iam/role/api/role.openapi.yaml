openapi: 3.0.0
x-sql-table: iam_role
info:
  title: RoleResponse API
  version: 1.0.0
paths:
  /role:
    get:
      operationId: listRole
      summary: Get all role
      responses:
        '200':
          description: List of role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
    post:
      operationId: createRole
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /role/{role_id}:
    get:
      operationId: getRoleById
      summary: Get role by role_id
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: role object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
    put:
      operationId: updateRole
      summary: Update role by role_id
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid request
        '404':
          description: role not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteRole
      summary: Delete role by role_id
      parameters:
        - in: path
          name: role_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: role not found
components:
  schemas:

    RoleRequest:
      type: object
      required:
        - role_code
        - name
        - persona
      additionalProperties: false
      properties:
        role_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        allowed_scopes:
          type: string
          default: "{global}"
        allowed_user_types:
          type: string
          default: "{staff}"
        is_privileged:
          type: boolean
          default: false
        requires_mfa:
          type: boolean
          default: false
        max_grant_days:
          type: integer
          format: int32
          nullable: true
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RoleUpdateRequest:
      type: object
      required:
        - role_code
        - name
        - description
        - persona
        - allowed_scopes
        - allowed_user_types
        - is_privileged
        - requires_mfa
        - max_grant_days
        - is_system
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        role_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        allowed_scopes:
          type: string
          default: "{global}"
        allowed_user_types:
          type: string
          default: "{staff}"
        is_privileged:
          type: boolean
          default: false
        requires_mfa:
          type: boolean
          default: false
        max_grant_days:
          type: integer
          format: int32
          nullable: true
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RoleResponse:
      type: object
      required:
        - record_code
        - role_id
        - role_code
        - name
        - persona
        - allowed_scopes
        - allowed_user_types
        - is_privileged
        - requires_mfa
        - is_system
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        record_code:
          type: string
          readOnly: true
        role_id:
          type: string
          format: uuid
          readOnly: true
        role_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        allowed_scopes:
          type: string
          default: "{global}"
        allowed_user_types:
          type: string
          default: "{staff}"
        is_privileged:
          type: boolean
          default: false
        requires_mfa:
          type: boolean
          default: false
        max_grant_days:
          type: integer
          format: int32
          nullable: true
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
