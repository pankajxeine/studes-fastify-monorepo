openapi: 3.0.0
x-sql-table: tenancy_tenant_contact
info:
  title: TenantContactResponse API
  version: 1.0.0
paths:
  /tenant_contact:
    get:
      operationId: listTenantContact
      summary: Get all tenant_contact
      responses:
        '200':
          description: List of tenant_contact
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantContactResponse'
    post:
      operationId: createTenantContact
      summary: Create a new tenant_contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantContactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContactResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /tenant_contact/{id}:
    get:
      operationId: getTenantContactById
      summary: Get tenant_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: tenant_contact object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContactResponse'
        '404':
          description: tenant_contact not found
    put:
      operationId: updateTenantContact
      summary: Update tenant_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantContactUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContactResponse'
        '400':
          description: Invalid request
        '404':
          description: tenant_contact not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTenantContact
      summary: Delete tenant_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: tenant_contact not found
components:
  schemas:

    TenantContactRequest:
      type: object
      required:
        - tenant_id
        - contact_id
        - contact_role
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        contact_role:
          type: string
          maxLength: 12

    TenantContactUpdateRequest:
      type: object
      required:
        - tenant_id
        - contact_id
        - contact_role
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        contact_role:
          type: string
          maxLength: 12

    TenantContactResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - tenant_id
        - contact_id
        - contact_role
        - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        tenant_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        contact_role:
          type: string
          maxLength: 12
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
