openapi: 3.0.0
x-sql-table: tenancy_tenant
info:
  title: TenantResponse API
  version: 1.0.0
paths:
  /tenant:
    get:
      operationId: listTenant
      summary: Get all tenant
      responses:
        '200':
          description: List of tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResponse'
    post:
      operationId: createTenant
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /tenant/{id}:
    get:
      operationId: getTenantById
      summary: Get tenant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: tenant object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '404':
          description: tenant not found
    put:
      operationId: updateTenant
      summary: Update tenant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Invalid request
        '404':
          description: tenant not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTenant
      summary: Delete tenant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: tenant not found
components:
  schemas:

    TenantRequest:
      type: object
      required:
        - tenant_code
        - customer_account_id
        - legal_name
        - display_name
        - region_code
        - data_residency
        - default_currency_code
      additionalProperties: false
      properties:
        tenant_code:
          type: string
          maxLength: 40
        customer_account_id:
          type: string
          format: uuid
        legal_name:
          type: string
        display_name:
          type: string
        status:
          type: string
          default: "draft"
        region_code:
          type: string
        data_residency:
          type: string
        timezone:
          type: string
          default: "UTC"
        default_locale:
          type: string
          default: "en-US"
        default_currency_code:
          type: string
        owning_branch_id:
          type: string
          format: uuid
          nullable: true
        sales_agent_id:
          type: string
          format: uuid
          nullable: true
        is_sandbox:
          type: boolean
          default: false
        parent_tenant_id:
          type: string
          format: uuid
          nullable: true
        legal_hold:
          type: boolean
          default: false
        suspended_reason:
          type: string
          nullable: true
          maxLength: 20
        activated_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        purge_after:
          type: string
          format: date
          nullable: true

