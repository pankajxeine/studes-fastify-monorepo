openapi: 3.0.0
x-sql-table: audit_consent
info:
  title: ConsentResponse API
  version: 1.0.0
paths:
  /consent:
    get:
      operationId: listConsent
      summary: Get all consent
      responses:
        '200':
          description: List of consent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentResponse'
    post:
      operationId: createConsent
      summary: Create a new consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /consent/{consent_id}:
    get:
      operationId: getConsentById
      summary: Get consent by consent_id
      parameters:
        - in: path
          name: consent_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: consent object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '404':
          description: consent not found
    put:
      operationId: updateConsent
      summary: Update consent by consent_id
      parameters:
        - in: path
          name: consent_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: Invalid request
        '404':
          description: consent not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteConsent
      summary: Delete consent by consent_id
      parameters:
        - in: path
          name: consent_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: consent not found
components:
  schemas:

    ConsentRequest:
      type: object
      required:
        - subject_type
        - subject_id
        - purpose
        - granted
        - source
        - policy_version
      additionalProperties: false
      properties:
        subject_type:
          type: string
          maxLength: 10
        subject_id:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 30
        granted:
          type: boolean
        source:
          type: string
          maxLength: 20
        policy_version:
          type: string
          maxLength: 20
        evidence_ref:
          type: string
          nullable: true
        captured_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
          nullable: true

    ConsentUpdateRequest:
      type: object
      required:
        - subject_type
        - subject_id
        - purpose
        - granted
        - source
        - policy_version
        - evidence_ref
        - captured_at
        - withdrawn_at
      additionalProperties: false
      properties:
        subject_type:
          type: string
          maxLength: 10
        subject_id:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 30
        granted:
          type: boolean
        source:
          type: string
          maxLength: 20
        policy_version:
          type: string
          maxLength: 20
        evidence_ref:
          type: string
          nullable: true
        captured_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
          nullable: true

    ConsentResponse:
      type: object
      required:
        - record_code
        - consent_id
        - subject_type
        - subject_id
        - purpose
        - granted
        - source
        - policy_version
        - captured_at
      additionalProperties: false
      properties:
        record_code:
          type: string
          readOnly: true
        consent_id:
          type: string
          format: uuid
          readOnly: true
        subject_type:
          type: string
          maxLength: 10
        subject_id:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 30
        granted:
          type: boolean
        source:
          type: string
          maxLength: 20
        policy_version:
          type: string
          maxLength: 20
        evidence_ref:
          type: string
          nullable: true
        captured_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
  
