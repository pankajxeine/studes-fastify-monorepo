      summary: Get onboarding_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: onboarding_request object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRequestResponse'
        '404':
          description: onboarding_request not found
    put:
      operationId: updateOnboardingRequest
      summary: Update onboarding_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequestUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingRequestResponse'
        '400':
          description: Invalid request
        '404':
          description: onboarding_request not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteOnboardingRequest
      summary: Delete onboarding_request by request_id
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: onboarding_request not found
