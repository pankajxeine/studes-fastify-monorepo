openapi: 3.0.0
x-sql-table: onboarding_checklist_item
info:
  title: ChecklistItemResponse API
  version: 1.0.0
paths:
  /checklist_item:
    get:
      operationId: listChecklistItem
      summary: Get all checklist_item
      responses:
        '200':
          description: List of checklist_item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChecklistItemResponse'
    post:
      operationId: createChecklistItem
      summary: Create a new checklist_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /checklist_item/{id}:
    get:
      operationId: getChecklistItemById
      summary: Get checklist_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: checklist_item object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResponse'
        '404':
          description: checklist_item not found
    put:
      operationId: updateChecklistItem
      summary: Update checklist_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItemResponse'
        '400':
          description: Invalid request
        '404':
          description: checklist_item not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteChecklistItem
      summary: Delete checklist_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: checklist_item not found
components:
  schemas:

    ChecklistItemRequest:
      type: object
      required:
        - request_id
        - item_code
        - title
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        item_code:
          type: string
        title:
          type: string
        is_mandatory:
          type: boolean
          default: true
        status:
          type: string
          maxLength: 8
          default: "pending"
        completed_by_user_id:
          type: string
          format: uuid
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true

    ChecklistItemUpdateRequest:
      type: object
      required:
        - request_id
        - item_code
        - title
        - is_mandatory
        - status
        - completed_by_user_id
        - completed_at
        - note
      additionalProperties: false
      properties:
        request_id:
          type: string
          format: uuid
        item_code:
          type: string
        title:
          type: string
        is_mandatory:
          type: boolean
          default: true
        status:
          type: string
          maxLength: 8
          default: "pending"
        completed_by_user_id:
          type: string
          format: uuid
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true

    ChecklistItemResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - request_id
        - item_code
        - title
        - is_mandatory
        - status
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        request_id:
          type: string
          format: uuid
        item_code:
          type: string
        title:
          type: string
        is_mandatory:
          type: boolean
          default: true
        status:
          type: string
          maxLength: 8
          default: "pending"
        completed_by_user_id:
          type: string
          format: uuid
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
  
