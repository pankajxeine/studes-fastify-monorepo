openapi: 3.0.0
x-sql-table: partner_sales_agent
info:
  title: SalesAgentResponse API
  version: 1.0.0
paths:
  /sales_agent:
    get:
      operationId: listSalesAgent
      summary: Get all sales_agent
      responses:
        '200':
          description: List of sales_agent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesAgentResponse'
    post:
      operationId: createSalesAgent
      summary: Create a new sales_agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAgentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /sales_agent/{sales_agent_id}:
    get:
      operationId: getSalesAgentById
      summary: Get sales_agent by sales_agent_id
      parameters:
        - in: path
          name: sales_agent_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: sales_agent object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAgentResponse'
        '404':
          description: sales_agent not found
    put:
      operationId: updateSalesAgent
      summary: Update sales_agent by sales_agent_id
      parameters:
        - in: path
          name: sales_agent_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesAgentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAgentResponse'
        '400':
          description: Invalid request
        '404':
          description: sales_agent not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteSalesAgent
      summary: Delete sales_agent by sales_agent_id
      parameters:
        - in: path
          name: sales_agent_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: sales_agent not found
