openapi: 3.0.0
x-sql-table: org_legal_entity
info:
  title: LegalEntityResponse API
  version: 1.0.0
paths:
  /legal_entity:
    get:
      operationId: listLegalEntity
      summary: Get all legal_entity
      responses:
        '200':
          description: List of legal_entity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalEntityResponse'
    post:
      operationId: createLegalEntity
      summary: Create a new legal_entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /legal_entity/{id}:
    get:
      operationId: getLegalEntityById
      summary: Get legal_entity by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: legal_entity object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '404':
          description: legal_entity not found
    put:
      operationId: updateLegalEntity
      summary: Update legal_entity by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          description: Invalid request
        '404':
          description: legal_entity not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLegalEntity
      summary: Delete legal_entity by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: legal_entity not found
components:
  schemas:

    LegalEntityRequest:
      type: object
      required:
        - legal_entity_code
        - legal_name
        - country_code
        - functional_currency_code
        - registered_address
        - invoice_prefix
      additionalProperties: false
      properties:
        legal_entity_code:
          type: string
        legal_name:
          type: string
        country_code:
          type: string
        tax_registration_no:
          type: string
          nullable: true
          maxLength: 40
        functional_currency_code:
          type: string
        registered_address:
        invoice_prefix:
          type: string
          maxLength: 10
        is_active:
          type: boolean
          default: true

    LegalEntityUpdateRequest:
      type: object
      required:
        - legal_entity_code
        - legal_name
        - country_code
        - tax_registration_no
        - functional_currency_code
        - registered_address
        - invoice_prefix
        - is_active
      additionalProperties: false
      properties:
        legal_entity_code:
          type: string
        legal_name:
          type: string
        country_code:
          type: string
        tax_registration_no:
          type: string
          nullable: true
          maxLength: 40
        functional_currency_code:
          type: string
        registered_address:
        invoice_prefix:
          type: string
          maxLength: 10
        is_active:
          type: boolean
          default: true

    LegalEntityResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - legal_entity_id
        - legal_entity_code
        - legal_name
        - country_code
        - functional_currency_code
        - registered_address
        - invoice_prefix
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        legal_entity_id:
          type: string
          format: uuid
          readOnly: true
        legal_entity_code:
          type: string
        legal_name:
          type: string
        country_code:
          type: string
        tax_registration_no:
          type: string
          nullable: true
          maxLength: 40
        functional_currency_code:
          type: string
        registered_address:
        invoice_prefix:
          type: string
          maxLength: 10
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
