openapi: 3.0.0
x-sql-table: payment_acceptance_configuration
info:
  title: AcceptanceConfigurationResponse API
  version: 1.0.0
paths:
  /acceptance_configuration:
    get:
      operationId: listAcceptanceConfiguration
      summary: Get all acceptance_configuration
      responses:
        '200':
          description: List of acceptance_configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcceptanceConfigurationResponse'
    post:
      operationId: createAcceptanceConfiguration
      summary: Create a new acceptance_configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceConfigurationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceConfigurationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /acceptance_configuration/{id}:
    get:
      operationId: getAcceptanceConfigurationById
      summary: Get acceptance_configuration by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: acceptance_configuration object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceConfigurationResponse'
        '404':
          description: acceptance_configuration not found
    put:
      operationId: updateAcceptanceConfiguration
      summary: Update acceptance_configuration by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceConfigurationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceConfigurationResponse'
        '400':
          description: Invalid request
        '404':
          description: acceptance_configuration not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAcceptanceConfiguration
      summary: Delete acceptance_configuration by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: acceptance_configuration not found
components:
  schemas:

    AcceptanceConfigurationRequest:
      type: object
      required:
        - tenant_application_id
        - outlet_id
        - mode_code
        - channel
        - currency_code
      additionalProperties: false
      properties:
        tenant_application_id:
          type: string
          format: uuid
        outlet_id:
          type: string
          format: uuid
        mode_code:
          type: string
        merchant_account_id:
          type: string
          format: uuid
          nullable: true
        pos_terminal_id:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          maxLength: 10
          enum:
            - "pos"
            - "web"
            - "mobile"
            - "backoffice"
        currency_code:
          type: string
        upi_flow:
          type: string
          nullable: true
          maxLength: 10
          enum:
            - "intent"
            - "dynamic_qr"
            - "static_qr"
        upi_vpa:
          type: string
          nullable: true
        upi_verified_at:
          type: string
          format: date-time
          nullable: true
        minimum_amount:
          type: number
          format: double
          default: 0
        maximum_amount:
          type: number
          format: double
          nullable: true
        capture_mode:
          type: string
          maxLength: 9
          default: "automatic"
          enum:
            - "automatic"
            - "manual"
        is_enabled:
          type: boolean
          default: false
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true

