openapi: 3.0.0
info:
  title: DateFormatsResponse API
  version: 1.0.0
paths:
  /date_formats:
    get:
      operationId: listDateFormats
      summary: Get all date_formats
      responses:
        '200':
          description: List of date_formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DateFormatsResponse'
    post:
      operationId: createDateFormat
      summary: Create a new date_formats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateFormatsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateFormatsResponse'

  /date_formats/{id}:
    get:
      operationId: getDateFormatsById
      summary: Get date_formats by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: date_formats object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateFormatsResponse'
    put:
      operationId: updateDateFormat
      summary: Update date_formats by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DateFormatsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateFormatsResponse'
    delete:
      operationId: deleteDateFormat
      summary: Delete date_formats by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    DateFormatsRequest:
      type: object
      properties:
        id:
          type: integer
        date_format:
          type: string
          maxLength: 255

    DateFormatsResponse:
      type: object
      properties:
        id:
          type: integer
        date_format:
          type: string
          maxLength: 255
  
