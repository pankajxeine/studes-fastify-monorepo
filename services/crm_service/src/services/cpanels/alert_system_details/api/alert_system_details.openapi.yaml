openapi: 3.0.0
info:
  title: AlertSystemDetailsResponse API
  version: 1.0.0
paths:
  /alert_system_details:
    get:
      operationId: listAlertSystemDetails
      summary: Get all alert_system_details
      responses:
        '200':
          description: List of alert_system_details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertSystemDetailsResponse'
    post:
      operationId: createAlertSystemDetail
      summary: Create a new alert_system_details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSystemDetailsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemDetailsResponse'

  /alert_system_details/{id}:
    get:
      operationId: getAlertSystemDetailsById
      summary: Get alert_system_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: alert_system_details object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemDetailsResponse'
    put:
      operationId: updateAlertSystemDetail
      summary: Update alert_system_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSystemDetailsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemDetailsResponse'
    delete:
      operationId: deleteAlertSystemDetail
      summary: Delete alert_system_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    AlertSystemDetailsRequest:
      type: object
      properties:
        id:
          type: integer
        alert_system_id:
          type: integer
        sub_id:
          type: integer
        read_at:
          type: string
          format: date-time
        alert_read_user_ids:
          type: object

    AlertSystemDetailsResponse:
      type: object
      properties:
        id:
          type: integer
        alert_system_id:
          type: integer
        sub_id:
          type: integer
        read_at:
          type: string
          format: date-time
        alert_read_user_ids:
          type: object
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
  
