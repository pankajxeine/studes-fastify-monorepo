openapi: 3.0.0
info:
  title: ModuleFieldsResponse API
  version: 1.0.0
paths:
  /module_fields:
    get:
      operationId: listModuleFields
      summary: Get all module_fields
      responses:
        '200':
          description: List of module_fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleFieldsResponse'
    post:
      operationId: createModuleField
      summary: Create a new module_fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleFieldsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFieldsResponse'

  /module_fields/{id}:
    get:
      operationId: getModuleFieldsById
      summary: Get module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: module_fields object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFieldsResponse'
    put:
      operationId: updateModuleField
      summary: Update module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleFieldsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleFieldsResponse'
    delete:
      operationId: deleteModuleField
      summary: Delete module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    ModuleFieldsRequest:
      type: object
      properties:
        id:
          type: integer
        industry_id:
          type: integer
        module_id:
          type: integer
        module_key:
          type: string
          maxLength: 50
        block_id:
          type: integer
        block_key:
          type: string
          maxLength: 50
        table_name:
          type: string
          maxLength: 50
        field_label:
          type: string
          maxLength: 50
        field_name:
          type: string
          maxLength: 50
        field_type:
          type: string
          maxLength: 30
        field_key:
          type: string
          maxLength: 50
        import_is_required:
          type: boolean
        export_is_required:
          type: boolean
        is_skipped:
          type: boolean
        sequence:
          type: integer

    ModuleFieldsResponse:
      type: object
      properties:
        id:
          type: integer
        industry_id:
          type: integer
        module_id:
          type: integer
        module_key:
          type: string
          maxLength: 50
        block_id:
          type: integer
        block_key:
          type: string
          maxLength: 50
        table_name:
          type: string
          maxLength: 50
        field_label:
          type: string
          maxLength: 50
        field_name:
          type: string
          maxLength: 50
        field_type:
          type: string
          maxLength: 30
        field_key:
          type: string
          maxLength: 50
        import_is_required:
          type: boolean
        export_is_required:
          type: boolean
        is_skipped:
          type: boolean
        sequence:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
