openapi: 3.0.0
info:
  title: CrmModulesResponse API
  version: 1.0.0
paths:
  /crm_modules:
    get:
      operationId: listCrmModules
      summary: Get all crm_modules
      responses:
        '200':
          description: List of crm_modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmModulesResponse'
    post:
      operationId: createCrmModule
      summary: Create a new crm_modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmModulesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModulesResponse'

  /crm_modules/{id}:
    get:
      operationId: getCrmModulesById
      summary: Get crm_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_modules object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModulesResponse'
    put:
      operationId: updateCrmModule
      summary: Update crm_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmModulesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModulesResponse'
    delete:
      operationId: deleteCrmModule
      summary: Delete crm_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmModulesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        module_key:
          type: string
          maxLength: 50
        sequence:
          type: integer

    CrmModulesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        module_key:
          type: string
          maxLength: 50
        sequence:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
