openapi: 3.0.0
info:
  title: VerifoneLogsResponse API
  version: 1.0.0
paths:
  /verifone_logs:
    get:
      operationId: listVerifoneLogs
      summary: Get all verifone_logs
      responses:
        '200':
          description: List of verifone_logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerifoneLogsResponse'
    post:
      operationId: createVerifoneLog
      summary: Create a new verifone_logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifoneLogsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifoneLogsResponse'

  /verifone_logs/{id}:
    get:
      operationId: getVerifoneLogsById
      summary: Get verifone_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: verifone_logs object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifoneLogsResponse'
    put:
      operationId: updateVerifoneLog
      summary: Update verifone_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifoneLogsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifoneLogsResponse'
    delete:
      operationId: deleteVerifoneLog
      summary: Delete verifone_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    VerifoneLogsRequest:
      type: object
      properties:
        id:
          type: integer
        api_name:
          type: string
          maxLength: 255
        request:
          type: string
        response:
          type: string
        endpoint_url:
          type: string
        finished:
          type: string
          enum:
            - "E"
            - "N"
            - "Y"

    VerifoneLogsResponse:
      type: object
      properties:
        id:
          type: integer
        api_name:
          type: string
          maxLength: 255
        request:
          type: string
        response:
          type: string
        endpoint_url:
          type: string
        finished:
          type: string
          enum:
            - "E"
            - "N"
            - "Y"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
