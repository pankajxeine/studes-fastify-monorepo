openapi: 3.0.0
info:
  title: SubCompaniesResponse API
  version: 1.0.0
paths:
  /sub_companies:
    get:
      operationId: listSubCompanies
      summary: Get all sub_companies
      responses:
        '200':
          description: List of sub_companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCompaniesResponse'
    post:
      operationId: createSubCompanie
      summary: Create a new sub_companies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompaniesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompaniesResponse'

  /sub_companies/{id}:
    get:
      operationId: getSubCompaniesById
      summary: Get sub_companies by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: sub_companies object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompaniesResponse'
    put:
      operationId: updateSubCompanie
      summary: Update sub_companies by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompaniesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompaniesResponse'
    delete:
      operationId: deleteSubCompanie
      summary: Delete sub_companies by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    SubCompaniesRequest:
      type: object
      properties:
        id:
          type: integer
        sub_id:
          type: integer
        customer_id:
          type: integer
        name:
          type: string
          maxLength: 100
        email:
          type: string
        timezone_id:
          type: integer
        address1:
          type: string
          maxLength: 100
        address2:
          type: string
          maxLength: 100
        country_id:
          type: integer
        state_id:
          type: integer
        city:
          type: string
          maxLength: 50
        postal_code:
          type: string
          maxLength: 10
        phone:
          type: string
        website:
          type: string
        created_by:
          type: integer

    SubCompaniesResponse:
      type: object
      properties:
        id:
          type: integer
        sub_id:
          type: integer
        customer_id:
          type: integer
        name:
          type: string
          maxLength: 100
        email:
          type: string
        timezone_id:
          type: integer
        address1:
          type: string
          maxLength: 100
        address2:
          type: string
          maxLength: 100
        country_id:
          type: integer
        state_id:
          type: integer
        city:
          type: string
          maxLength: 50
        postal_code:
          type: string
          maxLength: 10
        phone:
          type: string
        website:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: integer
  
