openapi: 3.0.0
info:
  title: UserAlertsResponse API
  version: 1.0.0
paths:
  /user_alerts:
    get:
      operationId: listUserAlerts
      summary: Get all user_alerts
      responses:
        '200':
          description: List of user_alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAlertsResponse'
    post:
      operationId: createUserAlert
      summary: Create a new user_alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAlertsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAlertsResponse'

  /user_alerts/{id}:
    get:
      operationId: getUserAlertsById
      summary: Get user_alerts by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: user_alerts object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAlertsResponse'
    put:
      operationId: updateUserAlert
      summary: Update user_alerts by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAlertsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAlertsResponse'
    delete:
      operationId: deleteUserAlert
      summary: Delete user_alerts by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    UserAlertsRequest:
      type: object
      properties:
        id:
          type: integer
        service_ticket_id:
          type: integer
        customer_id:
          type: integer
        alert_type_id:
          type: integer
        summary:
          type: string
          maxLength: 500
        alert_priority:
          type: string
          enum:
            - "High"
            - "Medium"
            - "Low"
            - "Blocker"
            - "Critical"
        primary_service_request_id:
          type: integer
        alert_status:
          type: string
          enum:
            - "Open"
            - "Closed"
        created_by:
          type: integer
        updated_by:
          type: integer

    UserAlertsResponse:
      type: object
      properties:
        id:
          type: integer
        service_ticket_id:
          type: integer
        customer_id:
          type: integer
        alert_type_id:
          type: integer
        summary:
          type: string
          maxLength: 500
        alert_priority:
          type: string
          enum:
            - "High"
            - "Medium"
            - "Low"
            - "Blocker"
            - "Critical"
        primary_service_request_id:
          type: integer
        alert_status:
          type: string
          enum:
            - "Open"
            - "Closed"
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
