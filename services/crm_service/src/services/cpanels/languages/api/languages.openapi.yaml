openapi: 3.0.0
info:
  title: LanguagesResponse API
  version: 1.0.0
paths:
  /languages:
    get:
      operationId: listLanguages
      summary: Get all languages
      responses:
        '200':
          description: List of languages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LanguagesResponse'
    post:
      operationId: createLanguage
      summary: Create a new languages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'

  /languages/{id}:
    get:
      operationId: getLanguagesById
      summary: Get languages by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: languages object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'
    put:
      operationId: updateLanguage
      summary: Update languages by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguagesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'
    delete:
      operationId: deleteLanguage
      summary: Delete languages by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    LanguagesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 30
        native_name:
          type: string
          maxLength: 30
        code:
          type: string
          maxLength: 30
        iso1_code:
          type: string
          maxLength: 5
        iso2_code:
          type: string
          maxLength: 5
        iso3_code:
          type: string
          maxLength: 5
        status:
          type: string
          enum:
            - "Active"
            - "Inactive"

    LanguagesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 30
        native_name:
          type: string
          maxLength: 30
        code:
          type: string
          maxLength: 30
        iso1_code:
          type: string
          maxLength: 5
        iso2_code:
          type: string
          maxLength: 5
        iso3_code:
          type: string
          maxLength: 5
        status:
          type: string
          enum:
            - "Active"
            - "Inactive"
  
