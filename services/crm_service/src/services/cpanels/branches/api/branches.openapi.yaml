openapi: 3.0.0
info:
  title: BranchesResponse API
  version: 1.0.0
paths:
  /branches:
    get:
      operationId: listBranches
      summary: Get all branches
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchesResponse'
    post:
      operationId: createBranche
      summary: Create a new branches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'

  /branches/{id}:
    get:
      operationId: getBranchesById
      summary: Get branches by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: branches object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'
    put:
      operationId: updateBranche
      summary: Update branches by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'
    delete:
      operationId: deleteBranche
      summary: Delete branches by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    BranchesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 250
        address1:
          type: string
          maxLength: 50
        address2:
          type: string
          maxLength: 50
        notes:
          type: string
          maxLength: 250
        city:
          type: string
          maxLength: 30
        state_id:
          type: integer
        country_id:
          type: integer
        postal_code:
          type: string
          maxLength: 10
        status:
          type: string
          enum:
            - "Active"
            - "Inactive"
        created_by:
          type: integer
        updated_by:
          type: integer

    BranchesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 250
        address1:
          type: string
          maxLength: 50
        address2:
          type: string
          maxLength: 50
        notes:
          type: string
          maxLength: 250
        city:
          type: string
          maxLength: 30
        state_id:
          type: integer
        country_id:
          type: integer
        postal_code:
          type: string
          maxLength: 10
        status:
          type: string
          enum:
            - "Active"
            - "Inactive"
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
