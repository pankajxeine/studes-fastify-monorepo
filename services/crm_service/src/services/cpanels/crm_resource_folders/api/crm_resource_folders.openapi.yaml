openapi: 3.0.0
info:
  title: CrmResourceFoldersResponse API
  version: 1.0.0
paths:
  /crm_resource_folders:
    get:
      operationId: listCrmResourceFolders
      summary: Get all crm_resource_folders
      responses:
        '200':
          description: List of crm_resource_folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmResourceFoldersResponse'
    post:
      operationId: createCrmResourceFolder
      summary: Create a new crm_resource_folders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmResourceFoldersRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFoldersResponse'

  /crm_resource_folders/{id}:
    get:
      operationId: getCrmResourceFoldersById
      summary: Get crm_resource_folders by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_resource_folders object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFoldersResponse'
    put:
      operationId: updateCrmResourceFolder
      summary: Update crm_resource_folders by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmResourceFoldersRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFoldersResponse'
    delete:
      operationId: deleteCrmResourceFolder
      summary: Delete crm_resource_folders by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmResourceFoldersRequest:
      type: object
      properties:
        id:
          type: integer
        folder_name:
          type: string
          maxLength: 100
        parent_folder_id:
          type: integer
        created_by:
          type: integer
        updated_by:
          type: integer

    CrmResourceFoldersResponse:
      type: object
      properties:
        id:
          type: integer
        folder_name:
          type: string
          maxLength: 100
        parent_folder_id:
          type: integer
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
