openapi: 3.0.0
info:
  title: PaxStoreLinksResponse API
  version: 1.0.0
paths:
  /pax_store_links:
    get:
      operationId: listPaxStoreLinks
      summary: Get all pax_store_links
      responses:
        '200':
          description: List of pax_store_links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaxStoreLinksResponse'
    post:
      operationId: createPaxStoreLink
      summary: Create a new pax_store_links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaxStoreLinksRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxStoreLinksResponse'

  /pax_store_links/{id}:
    get:
      operationId: getPaxStoreLinksById
      summary: Get pax_store_links by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: pax_store_links object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxStoreLinksResponse'
    put:
      operationId: updatePaxStoreLink
      summary: Update pax_store_links by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaxStoreLinksRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaxStoreLinksResponse'
    delete:
      operationId: deletePaxStoreLink
      summary: Delete pax_store_links by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    PaxStoreLinksRequest:
      type: object
      properties:
        id:
          type: integer
        app_link:
          type: string
          maxLength: 150

    PaxStoreLinksResponse:
      type: object
      properties:
        id:
          type: integer
        app_link:
          type: string
          maxLength: 150
        industry:
          type: string
          enum:
            - "clothing"
            - "food"
            - "service"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
