openapi: 3.0.0
info:
  title: FilterModulesResponse API
  version: 1.0.0
paths:
  /filter_modules:
    get:
      operationId: listFilterModules
      summary: Get all filter_modules
      responses:
        '200':
          description: List of filter_modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterModulesResponse'
    post:
      operationId: createFilterModule
      summary: Create a new filter_modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterModulesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModulesResponse'

  /filter_modules/{id}:
    get:
      operationId: getFilterModulesById
      summary: Get filter_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: filter_modules object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModulesResponse'
    put:
      operationId: updateFilterModule
      summary: Update filter_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterModulesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModulesResponse'
    delete:
      operationId: deleteFilterModule
      summary: Delete filter_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    FilterModulesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100

    FilterModulesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
