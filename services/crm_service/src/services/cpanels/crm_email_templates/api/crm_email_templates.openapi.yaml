openapi: 3.0.0
info:
  title: CrmEmailTemplatesResponse API
  version: 1.0.0
paths:
  /crm_email_templates:
    get:
      operationId: listCrmEmailTemplates
      summary: Get all crm_email_templates
      responses:
        '200':
          description: List of crm_email_templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmEmailTemplatesResponse'
    post:
      operationId: createCrmEmailTemplate
      summary: Create a new crm_email_templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmEmailTemplatesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailTemplatesResponse'

  /crm_email_templates/{id}:
    get:
      operationId: getCrmEmailTemplatesById
      summary: Get crm_email_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_email_templates object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailTemplatesResponse'
    put:
      operationId: updateCrmEmailTemplate
      summary: Update crm_email_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmEmailTemplatesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailTemplatesResponse'
    delete:
      operationId: deleteCrmEmailTemplate
      summary: Delete crm_email_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmEmailTemplatesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        short_code:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        email_subject:
          type: string
        email_message:
          type: string
        email_images:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer

    CrmEmailTemplatesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        short_code:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        email_subject:
          type: string
        email_message:
          type: string
        email_images:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
