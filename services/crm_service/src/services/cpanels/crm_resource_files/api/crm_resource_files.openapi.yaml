openapi: 3.0.0
info:
  title: CrmResourceFilesResponse API
  version: 1.0.0
paths:
  /crm_resource_files:
    get:
      operationId: listCrmResourceFiles
      summary: Get all crm_resource_files
      responses:
        '200':
          description: List of crm_resource_files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmResourceFilesResponse'
    post:
      operationId: createCrmResourceFile
      summary: Create a new crm_resource_files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmResourceFilesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFilesResponse'

  /crm_resource_files/{id}:
    get:
      operationId: getCrmResourceFilesById
      summary: Get crm_resource_files by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_resource_files object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFilesResponse'
    put:
      operationId: updateCrmResourceFile
      summary: Update crm_resource_files by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmResourceFilesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmResourceFilesResponse'
    delete:
      operationId: deleteCrmResourceFile
      summary: Delete crm_resource_files by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmResourceFilesRequest:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        file_name:
          type: string
          maxLength: 150
        file_origional_name:
          type: string
          maxLength: 150
        file_description:
          type: string
          maxLength: 150
        file_type:
          type: string
          maxLength: 150
        file_size:
          type: string
          maxLength: 50
        created_by:
          type: integer
        updated_by:
          type: integer

    CrmResourceFilesResponse:
      type: object
      properties:
        id:
          type: integer
        folder_id:
          type: integer
        file_name:
          type: string
          maxLength: 150
        file_origional_name:
          type: string
          maxLength: 150
        file_description:
          type: string
          maxLength: 150
        file_type:
          type: string
          maxLength: 150
        file_size:
          type: string
          maxLength: 50
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
