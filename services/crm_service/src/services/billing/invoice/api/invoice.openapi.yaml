openapi: 3.0.0
x-sql-table: billing_invoice
info:
  title: InvoiceResponse API
  version: 1.0.0
paths:
  /invoice:
    get:
      operationId: listInvoice
      summary: Get all invoice
      responses:
        '200':
          description: List of invoice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
    post:
      operationId: createInvoice
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /invoice/{invoice_id}:
    get:
      operationId: getInvoiceById
      summary: Get invoice by invoice_id
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: invoice object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: invoice not found
    put:
      operationId: updateInvoice
      summary: Update invoice by invoice_id
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          description: Invalid request
        '404':
          description: invoice not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteInvoice
      summary: Delete invoice by invoice_id
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: invoice not found
components:
  schemas:

    InvoiceRequest:
      type: object
      required:
        - billing_account_id
        - legal_entity_id
        - currency_code
      additionalProperties: false
      properties:
        invoice_number:
          type: string
          nullable: true
          maxLength: 40
        billing_account_id:
          type: string
          format: uuid
        legal_entity_id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
          nullable: true
        invoice_type:
          type: string
          maxLength: 12
          default: "subscription"
        currency_code:
          type: string
        status:
          type: string
          default: "draft"
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        issue_date:
          type: string
          format: date
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        subtotal:
          type: string
          default: 0
        discount_total:
          type: string
          default: 0
        tax_total:
          type: string
          default: 0
        total:
          type: string
          default: 0
        amount_paid:
          type: string
          default: 0
        amount_credited:
          type: string
          default: 0
        balance_due:
          type: string
          nullable: true
        fx_rate_to_functional:
          type: number
          format: double
          nullable: true
        finalized_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        voided_at:
          type: string
          format: date-time
          nullable: true
        void_reason:
          type: string
          nullable: true
        written_off_at:
          type: string
          format: date-time
          nullable: true
        pdf_ref:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    InvoiceUpdateRequest:
