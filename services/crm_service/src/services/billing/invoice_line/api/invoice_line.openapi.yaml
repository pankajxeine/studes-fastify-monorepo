        plan_price_id:
          type: string
          format: uuid
          nullable: true
        addon_price_id:
          type: string
          format: uuid
          nullable: true
        subscription_item_id:
          type: string
          format: uuid
          nullable: true
        feature_id:
          type: string
          format: uuid
          nullable: true
        coupon_id:
          type: string
          format: uuid
          nullable: true
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
        quantity:
          type: number
          format: double
          default: 1
        unit_amount:
          type: string
