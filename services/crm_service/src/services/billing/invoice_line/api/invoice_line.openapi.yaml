openapi: 3.0.0
x-sql-table: billing_invoice_line
info:
  title: InvoiceLineResponse API
  version: 1.0.0
paths:
  /invoice_line:
    get:
      operationId: listInvoiceLine
      summary: Get all invoice_line
      responses:
        '200':
          description: List of invoice_line
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceLineResponse'
    post:
      operationId: createInvoiceLine
      summary: Create a new invoice_line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceLineRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /invoice_line/{invoice_line_id}:
    get:
      operationId: getInvoiceLineById
      summary: Get invoice_line by invoice_line_id
      parameters:
        - in: path
          name: invoice_line_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: invoice_line object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineResponse'
        '404':
          description: invoice_line not found
    put:
      operationId: updateInvoiceLine
      summary: Update invoice_line by invoice_line_id
      parameters:
        - in: path
          name: invoice_line_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceLineUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLineResponse'
        '400':
          description: Invalid request
        '404':
          description: invoice_line not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteInvoiceLine
      summary: Delete invoice_line by invoice_line_id
      parameters:
        - in: path
          name: invoice_line_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: invoice_line not found
