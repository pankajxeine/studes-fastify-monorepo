openapi: 3.0.0
x-sql-table: commission_commission_plan
info:
  title: CommissionPlanResponse API
  version: 1.0.0
paths:
  /commission_plan:
    get:
      operationId: listCommissionPlan
      summary: Get all commission_plan
      responses:
        '200':
          description: List of commission_plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommissionPlanResponse'
    post:
      operationId: createCommissionPlan
      summary: Create a new commission_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /commission_plan/{id}:
    get:
      operationId: getCommissionPlanById
      summary: Get commission_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: commission_plan object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanResponse'
        '404':
          description: commission_plan not found
    put:
      operationId: updateCommissionPlan
      summary: Update commission_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanResponse'
        '400':
          description: Invalid request
        '404':
          description: commission_plan not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteCommissionPlan
      summary: Delete commission_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: commission_plan not found
components:
  schemas:

    CommissionPlanRequest:
      type: object
      required:
        - plan_code
        - name
        - currency_code
        - valid_from
      additionalProperties: false
      properties:
        plan_code:
          type: string
        name:
          type: string
        currency_code:
          type: string
        clawback_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 730
          default: 90
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: true

    CommissionPlanUpdateRequest:
      type: object
      required:
        - plan_code
        - name
        - currency_code
        - clawback_days
        - valid_from
        - valid_to
        - is_active
      additionalProperties: false
      properties:
        plan_code:
          type: string
        name:
          type: string
        currency_code:
          type: string
        clawback_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 730
          default: 90
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: true

    CommissionPlanResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - commission_plan_id
        - plan_code
        - name
        - currency_code
        - clawback_days
        - valid_from
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        commission_plan_id:
          type: string
          format: uuid
          readOnly: true
        plan_code:
          type: string
        name:
          type: string
        currency_code:
          type: string
        clawback_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 730
          default: 90
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
