openapi: 3.0.0
x-sql-table: provisioning_provisioning_job
info:
  title: ProvisioningJobResponse API
  version: 1.0.0
paths:
  /provisioning_job:
    get:
      operationId: listProvisioningJob
      summary: Get all provisioning_job
      responses:
        '200':
          description: List of provisioning_job
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProvisioningJobResponse'
    post:
      operationId: createProvisioningJob
      summary: Create a new provisioning_job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningJobRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningJobResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /provisioning_job/{job_id}:
    get:
      operationId: getProvisioningJobById
      summary: Get provisioning_job by job_id
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: provisioning_job object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningJobResponse'
        '404':
          description: provisioning_job not found
    put:
      operationId: updateProvisioningJob
      summary: Update provisioning_job by job_id
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningJobUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisioningJobResponse'
        '400':
          description: Invalid request
        '404':
          description: provisioning_job not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteProvisioningJob
      summary: Delete provisioning_job by job_id
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: provisioning_job not found
components:
  schemas:

    ProvisioningJobRequest:
      type: object
      required:
        - tenant_application_id
        - job_type
        - idempotency_key
      additionalProperties: false
      properties:
        tenant_application_id:
          type: string
          format: uuid
        job_type:
          type: string
          maxLength: 12
        status:
          type: string
          maxLength: 12
          default: "queued"
        idempotency_key:
          type: string
          maxLength: 100
        payload:
          default: "{}"
        result:
          nullable: true
        attempts:
          type: integer
          format: int32
          default: 0
        max_attempts:
          type: integer
          format: int32
          default: 5
        run_after:
          type: string
          format: date-time
        locked_by:
          type: string
          nullable: true
          maxLength: 60
        locked_until:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true

