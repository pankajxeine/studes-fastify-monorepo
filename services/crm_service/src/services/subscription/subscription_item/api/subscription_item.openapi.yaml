openapi: 3.0.0
x-sql-table: subscription_subscription_item
info:
  title: SubscriptionItemResponse API
  version: 1.0.0
paths:
  /subscription_item:
    get:
      operationId: listSubscriptionItem
      summary: Get all subscription_item
      responses:
        '200':
          description: List of subscription_item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionItemResponse'
    post:
      operationId: createSubscriptionItem
      summary: Create a new subscription_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /subscription_item/{subscription_item_id}:
    get:
      operationId: getSubscriptionItemById
      summary: Get subscription_item by subscription_item_id
      parameters:
        - in: path
          name: subscription_item_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: subscription_item object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '404':
          description: subscription_item not found
    put:
      operationId: updateSubscriptionItem
      summary: Update subscription_item by subscription_item_id
      parameters:
        - in: path
          name: subscription_item_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionItemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '400':
          description: Invalid request
        '404':
          description: subscription_item not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteSubscriptionItem
      summary: Delete subscription_item by subscription_item_id
      parameters:
        - in: path
          name: subscription_item_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: subscription_item not found
components:
  schemas:

    SubscriptionItemRequest:
      type: object
      required:
        - subscription_id
        - addon_price_id
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        addon_price_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          default: 1
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true

    SubscriptionItemUpdateRequest:
      type: object
      required:
        - subscription_id
        - addon_price_id
        - quantity
        - valid_from
        - valid_to
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          format: uuid
        addon_price_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          default: 1
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true

    SubscriptionItemResponse:
      type: object
      required:
        - record_code
        - subscription_item_id
        - subscription_id
        - addon_price_id
        - quantity
        - valid_from
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        record_code:
          type: string
          readOnly: true
        subscription_item_id:
          type: string
          format: uuid
          readOnly: true
        subscription_id:
          type: string
          format: uuid
        addon_price_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          default: 1
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
