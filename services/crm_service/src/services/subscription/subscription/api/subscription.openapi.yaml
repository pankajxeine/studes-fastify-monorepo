openapi: 3.0.0
x-sql-table: subscription_subscription
info:
  title: SubscriptionResponse API
  version: 1.0.0
paths:
  /subscription:
    get:
      operationId: listSubscription
      summary: Get all subscription
      responses:
        '200':
          description: List of subscription
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'
    post:
      operationId: createSubscription
      summary: Create a new subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /subscription/{id}:
    get:
      operationId: getSubscriptionById
      summary: Get subscription by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: subscription object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '404':
          description: subscription not found
    put:
      operationId: updateSubscription
      summary: Update subscription by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Invalid request
        '404':
          description: subscription not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteSubscription
      summary: Delete subscription by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: subscription not found
components:
  schemas:

    SubscriptionRequest:
      type: object
      required:
        - tenant_application_id
        - billing_account_id
        - plan_version_id
        - plan_price_id
        - status
        - current_period_start
        - current_period_end
      additionalProperties: false
      properties:
        subscription_number:
          type: string
          maxLength: 20
        tenant_application_id:
          type: string
          format: uuid
        billing_account_id:
          type: string
          format: uuid
        plan_version_id:
          type: string
          format: uuid
        plan_price_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        quantity:
          type: integer
          format: int32
          default: 1
        discount_percent:
          type: string
          default: 0
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        grace_until:
          type: string
          format: date-time
          nullable: true
        cancel_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
