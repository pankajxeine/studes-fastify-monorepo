      operationId: getAddonItemById
      summary: Get addon_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: addon_item object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonItemResponse'
        '404':
          description: addon_item not found
    put:
      operationId: updateAddonItem
      summary: Update addon_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonItemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonItemResponse'
        '400':
          description: Invalid request
        '404':
          description: addon_item not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAddonItem
      summary: Delete addon_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: addon_item not found
components:
