          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        addon_item_id:
          type: string
          format: uuid
          readOnly: true
        addon_version_id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        feature_id:
          type: string
