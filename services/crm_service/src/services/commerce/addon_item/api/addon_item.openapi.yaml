    get:
      operationId: listAddonItem
      summary: Get all addon_item
      responses:
        '200':
          description: List of addon_item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddonItemResponse'
    post:
      operationId: createAddonItem
      summary: Create a new addon_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonItemRequest'
      responses:
