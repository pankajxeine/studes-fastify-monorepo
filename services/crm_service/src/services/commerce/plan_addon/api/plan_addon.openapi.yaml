    get:
      operationId: listPlanAddon
      summary: Get all plan_addon
      responses:
        '200':
          description: List of plan_addon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanAddonResponse'
    post:
      operationId: createPlanAddon
      summary: Create a new plan_addon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAddonRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAddonResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /plan_addon/{id}:
    get:
      operationId: getPlanAddonById
      summary: Get plan_addon by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: plan_addon object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAddonResponse'
        '404':
          description: plan_addon not found
    put:
      operationId: updatePlanAddon
      summary: Update plan_addon by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAddonUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAddonResponse'
        '400':
          description: Invalid request
        '404':
          description: plan_addon not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePlanAddon
      summary: Delete plan_addon by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: plan_addon not found
components:
