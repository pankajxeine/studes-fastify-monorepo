        - addon_id
      additionalProperties: false
      properties:
        plan_version_id:
          type: string
          format: uuid
        addon_id:
          type: string
          format: uuid

    PlanAddonUpdateRequest:
      type: object
      required:
        - plan_version_id
        - addon_id
      additionalProperties: false
      properties:
        plan_version_id:
          type: string
          format: uuid
        addon_id:
          type: string
          format: uuid

    PlanAddonResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - plan_version_id
        - addon_id
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
