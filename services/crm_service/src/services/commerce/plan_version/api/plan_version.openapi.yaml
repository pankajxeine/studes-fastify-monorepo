openapi: 3.0.0
x-sql-table: commerce_plan_version
info:
  title: PlanVersionResponse API
  version: 1.0.0
paths:
  /plan_version:
    get:
      operationId: listPlanVersion
      summary: Get all plan_version
      responses:
        '200':
          description: List of plan_version
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanVersionResponse'
    post:
      operationId: createPlanVersion
      summary: Create a new plan_version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVersionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /plan_version/{id}:
    get:
      operationId: getPlanVersionById
      summary: Get plan_version by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: plan_version object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionResponse'
        '404':
          description: plan_version not found
    put:
      operationId: updatePlanVersion
      summary: Update plan_version by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVersionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionResponse'
        '400':
          description: Invalid request
        '404':
          description: plan_version not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePlanVersion
      summary: Delete plan_version by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: plan_version not found
components:
  schemas:

    PlanVersionRequest:
      type: object
      required:
        - plan_id
        - version_no
      additionalProperties: false
      properties:
        plan_id:
          type: string
          format: uuid
        version_no:
          type: integer
          format: int32
        status:
          type: string
          maxLength: 10
          default: "draft"
        trial_days:
          type: integer
          format: int32
          minimum: 0
          maximum: 90
          default: 0
        grace_days:
          type: integer
          format: int32
          nullable: true
        min_term_months:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 1
        sla_policy_id:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        published_by_user_id:
          type: string
          format: uuid
          nullable: true
        retired_at:
          type: string
          format: date-time
          nullable: true

    PlanVersionUpdateRequest:
      type: object
      required:
        - plan_id
