openapi: 3.0.0
x-sql-table: notify_template_locale
info:
  title: TemplateLocaleResponse API
  version: 1.0.0
paths:
  /template_locale:
    get:
      operationId: listTemplateLocale
      summary: Get all template_locale
      responses:
        '200':
          description: List of template_locale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateLocaleResponse'
    post:
      operationId: createTemplateLocale
      summary: Create a new template_locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateLocaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateLocaleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /template_locale/{id}:
    get:
      operationId: getTemplateLocaleById
      summary: Get template_locale by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: template_locale object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateLocaleResponse'
        '404':
          description: template_locale not found
    put:
      operationId: updateTemplateLocale
      summary: Update template_locale by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateLocaleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateLocaleResponse'
        '400':
          description: Invalid request
        '404':
          description: template_locale not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTemplateLocale
      summary: Delete template_locale by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: template_locale not found
components:
  schemas:

    TemplateLocaleRequest:
      type: object
      required:
        - template_version_id
        - locale
        - body_text
      additionalProperties: false
      properties:
        template_version_id:
          type: string
          format: uuid
        locale:
          type: string
        subject:
          type: string
          nullable: true
        body_html:
          type: string
          nullable: true
        body_text:
          type: string

    TemplateLocaleUpdateRequest:
      type: object
      required:
        - template_version_id
        - locale
        - subject
        - body_html
        - body_text
      additionalProperties: false
      properties:
        template_version_id:
          type: string
          format: uuid
        locale:
          type: string
        subject:
          type: string
          nullable: true
        body_html:
          type: string
          nullable: true
        body_text:
          type: string

    TemplateLocaleResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - template_version_id
        - locale
        - body_text
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        template_version_id:
          type: string
          format: uuid
        locale:
          type: string
        subject:
          type: string
          nullable: true
        body_html:
          type: string
          nullable: true
        body_text:
          type: string
  
