openapi: 3.0.0
x-sql-table: notify_delivery_attempt
info:
  title: DeliveryAttemptResponse API
  version: 1.0.0
paths:
  /delivery_attempt:
    get:
      operationId: listDeliveryAttempt
      summary: Get all delivery_attempt
      responses:
        '200':
          description: List of delivery_attempt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryAttemptResponse'
    post:
      operationId: createDeliveryAttempt
      summary: Create a new delivery_attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAttemptRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttemptResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /delivery_attempt/{id}:
    get:
      operationId: getDeliveryAttemptById
      summary: Get delivery_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: delivery_attempt object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttemptResponse'
        '404':
          description: delivery_attempt not found
    put:
      operationId: updateDeliveryAttempt
      summary: Update delivery_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAttemptUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttemptResponse'
        '400':
          description: Invalid request
        '404':
          description: delivery_attempt not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDeliveryAttempt
      summary: Delete delivery_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: delivery_attempt not found
components:
  schemas:

    DeliveryAttemptRequest:
      type: object
      required:
        - notification_id
        - attempt_no
        - provider_code
        - status
      additionalProperties: false
      properties:
        notification_id:
          type: string
          format: uuid
        attempt_no:
          type: integer
          format: int32
        provider_code:
          type: string
        provider_message_id:
          type: string
          nullable: true
          maxLength: 120
        status:
          type: string
          maxLength: 10
        error:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    DeliveryAttemptUpdateRequest:
      type: object
      required:
        - notification_id
        - attempt_no
        - provider_code
        - provider_message_id
        - status
        - error
        - attempted_at
      additionalProperties: false
      properties:
        notification_id:
          type: string
          format: uuid
        attempt_no:
          type: integer
          format: int32
        provider_code:
          type: string
        provider_message_id:
          type: string
          nullable: true
          maxLength: 120
        status:
          type: string
          maxLength: 10
        error:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    DeliveryAttemptResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - notification_id
        - attempt_no
        - provider_code
        - status
        - attempted_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        notification_id:
          type: string
          format: uuid
        attempt_no:
          type: integer
          format: int32
        provider_code:
          type: string
        provider_message_id:
          type: string
          nullable: true
          maxLength: 120
        status:
          type: string
          maxLength: 10
        error:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time
  
