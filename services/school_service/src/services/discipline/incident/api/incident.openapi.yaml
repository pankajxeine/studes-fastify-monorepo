          readOnly: true
        record_code:
          type: string
          readOnly: true
        incident_id:
          type: string
          format: uuid
          readOnly: true
        incident_no:
          type: string
          maxLength: 30
        campus_id:
          type: string
          format: uuid
        incident_category_code:
          type: string
        severity:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
