          format: uuid
        section_id:
          type: string
          format: uuid
          nullable: true
        grading_scheme_id:
          type: string
          format: uuid
          nullable: true
        room_id:
          type: string
          format: uuid
          nullable: true
        offering_code:
          type: string
          maxLength: 30
        capacity:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 1000
        delivery_mode:
          type: string
          maxLength: 12
          default: "in_person"
        status:
          type: string
