openapi: 3.0.0
x-sql-table: acad_program
info:
  title: ProgramResponse API
  version: 1.0.0
paths:
  /program:
    get:
      operationId: listProgram
      summary: Get all program
      responses:
        '200':
          description: List of program
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramResponse'
    post:
      operationId: createProgram
      summary: Create a new program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /program/{id}:
    get:
      operationId: getProgramById
      summary: Get program by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: program object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '404':
          description: program not found
    put:
      operationId: updateProgram
      summary: Update program by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400':
          description: Invalid request
        '404':
          description: program not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteProgram
      summary: Delete program by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: program not found
components:
  schemas:

    ProgramRequest:
      type: object
      required:
        - campus_id
        - grading_scheme_id
        - code
        - name
        - level
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        grading_scheme_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        level:
          type: string
        is_credit_based:
          type: boolean
          default: false
        award_title:
          type: string
          nullable: true
        duration_terms:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 30
        total_credits_required:
          type: number
          format: double
          nullable: true
        min_credits_per_term:
          type: number
          format: double
          nullable: true
        max_credits_per_term:
          type: number
          format: double
          nullable: true
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true

    ProgramUpdateRequest:
      type: object
      required:
        - campus_id
        - department_id
        - grading_scheme_id
        - code
        - name
        - level
        - is_credit_based
        - award_title
        - duration_terms
        - total_credits_required
        - min_credits_per_term
        - max_credits_per_term
        - description
        - is_active
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        grading_scheme_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        level:
          type: string
        is_credit_based:
          type: boolean
          default: false
        award_title:
          type: string
          nullable: true
        duration_terms:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 30
        total_credits_required:
          type: number
          format: double
          nullable: true
        min_credits_per_term:
          type: number
          format: double
          nullable: true
        max_credits_per_term:
          type: number
          format: double
          nullable: true
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true

    ProgramResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - program_id
        - campus_id
        - grading_scheme_id
        - code
        - name
        - level
        - is_credit_based
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        program_id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        grading_scheme_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        level:
          type: string
        is_credit_based:
          type: boolean
          default: false
        award_title:
          type: string
          nullable: true
        duration_terms:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 30
        total_credits_required:
          type: number
          format: double
          nullable: true
        min_credits_per_term:
          type: number
          format: double
          nullable: true
        max_credits_per_term:
          type: number
          format: double
          nullable: true
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
  
