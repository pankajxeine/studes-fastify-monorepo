openapi: 3.0.0
x-sql-table: acad_course
info:
  title: CourseResponse API
  version: 1.0.0
paths:
  /course:
    get:
      operationId: listCourse
      summary: Get all course
      responses:
        '200':
          description: List of course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
    post:
      operationId: createCourse
      summary: Create a new course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /course/{id}:
    get:
      operationId: getCourseById
      summary: Get course by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: course object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '404':
          description: course not found
    put:
      operationId: updateCourse
      summary: Update course by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
        '400':
          description: Invalid request
        '404':
          description: course not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteCourse
      summary: Delete course by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: course not found
components:
  schemas:

    CourseRequest:
      type: object
      required:
        - department_id
        - code
        - name
      additionalProperties: false
      properties:
        department_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        description:
          type: string
          nullable: true
        course_type:
          type: string
          default: "core"
        credits:
          type: number
          format: double
          nullable: true
        lecture_hours_per_week:
          type: number
          format: double
          nullable: true
        lab_hours_per_week:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true

    CourseUpdateRequest:
      type: object
      required:
        - department_id
        - code
        - name
        - description
        - course_type
        - credits
        - lecture_hours_per_week
        - lab_hours_per_week
        - is_active
      additionalProperties: false
      properties:
        department_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        description:
          type: string
          nullable: true
        course_type:
          type: string
          default: "core"
        credits:
          type: number
          format: double
          nullable: true
        lecture_hours_per_week:
          type: number
          format: double
          nullable: true
        lab_hours_per_week:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true

    CourseResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - course_id
        - department_id
        - code
        - name
        - course_type
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        course_id:
          type: string
          format: uuid
          readOnly: true
        department_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        description:
          type: string
          nullable: true
        course_type:
          type: string
          default: "core"
        credits:
          type: number
          format: double
          nullable: true
        lecture_hours_per_week:
          type: number
          format: double
          nullable: true
        lab_hours_per_week:
          type: number
          format: double
          nullable: true
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
  
