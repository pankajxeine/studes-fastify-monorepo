openapi: 3.0.0
x-sql-table: acad_holiday
info:
  title: HolidayResponse API
  version: 1.0.0
paths:
  /holiday:
    get:
      operationId: listHoliday
      summary: Get all holiday
      responses:
        '200':
          description: List of holiday
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayResponse'
    post:
      operationId: createHoliday
      summary: Create a new holiday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /holiday/{id}:
    get:
      operationId: getHolidayById
      summary: Get holiday by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: holiday object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayResponse'
        '404':
          description: holiday not found
    put:
      operationId: updateHoliday
      summary: Update holiday by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayResponse'
        '400':
          description: Invalid request
        '404':
          description: holiday not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteHoliday
      summary: Delete holiday by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: holiday not found
components:
  schemas:

    HolidayRequest:
      type: object
      required:
        - academic_year_id
        - name
        - start_date
        - end_date
      additionalProperties: false
      properties:
        academic_year_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        holiday_kind:
          type: string
          maxLength: 20
          default: "public_holiday"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_staff_working_day:
          type: boolean
          default: false
        description:
          type: string
          nullable: true

    HolidayUpdateRequest:
      type: object
      required:
        - academic_year_id
        - campus_id
        - name
        - holiday_kind
        - start_date
        - end_date
        - is_staff_working_day
        - description
      additionalProperties: false
      properties:
        academic_year_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        holiday_kind:
          type: string
          maxLength: 20
          default: "public_holiday"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_staff_working_day:
          type: boolean
          default: false
        description:
          type: string
          nullable: true

    HolidayResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - holiday_id
        - academic_year_id
        - name
        - holiday_kind
        - start_date
        - end_date
        - is_staff_working_day
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        holiday_id:
          type: string
          format: uuid
          readOnly: true
        academic_year_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        holiday_kind:
          type: string
          maxLength: 20
          default: "public_holiday"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_staff_working_day:
          type: boolean
          default: false
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
