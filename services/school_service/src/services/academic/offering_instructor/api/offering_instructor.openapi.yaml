openapi: 3.0.0
x-sql-table: acad_offering_instructor
info:
  title: OfferingInstructorResponse API
  version: 1.0.0
paths:
  /offering_instructor:
    get:
      operationId: listOfferingInstructor
      summary: Get all offering_instructor
      responses:
        '200':
          description: List of offering_instructor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfferingInstructorResponse'
    post:
      operationId: createOfferingInstructor
      summary: Create a new offering_instructor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferingInstructorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingInstructorResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /offering_instructor/{id}:
    get:
      operationId: getOfferingInstructorById
      summary: Get offering_instructor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: offering_instructor object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingInstructorResponse'
        '404':
          description: offering_instructor not found
    put:
      operationId: updateOfferingInstructor
      summary: Update offering_instructor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferingInstructorUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingInstructorResponse'
        '400':
          description: Invalid request
        '404':
          description: offering_instructor not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteOfferingInstructor
      summary: Delete offering_instructor by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: offering_instructor not found
components:
  schemas:

    OfferingInstructorRequest:
      type: object
      required:
        - course_offering_id
        - staff_id
        - valid_from
      additionalProperties: false
      properties:
        course_offering_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        instructor_role:
          type: string
          maxLength: 20
          default: "primary"
        is_primary:
          type: boolean
          default: true
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        load_percentage:
          type: string
          default: 100

    OfferingInstructorUpdateRequest:
      type: object
      required:
        - course_offering_id
        - staff_id
        - instructor_role
        - is_primary
        - valid_from
        - valid_to
        - validity
        - load_percentage
      additionalProperties: false
      properties:
        course_offering_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        instructor_role:
          type: string
          maxLength: 20
          default: "primary"
        is_primary:
          type: boolean
          default: true
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        load_percentage:
          type: string
          default: 100

    OfferingInstructorResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - offering_instructor_id
        - course_offering_id
        - staff_id
        - instructor_role
        - is_primary
        - valid_from
        - load_percentage
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        offering_instructor_id:
          type: string
          format: uuid
          readOnly: true
        course_offering_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        instructor_role:
          type: string
          maxLength: 20
          default: "primary"
        is_primary:
          type: boolean
          default: true
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        load_percentage:
          type: string
          default: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
