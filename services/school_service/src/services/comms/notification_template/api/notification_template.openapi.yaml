openapi: 3.0.0
x-sql-table: comms_notification_template
info:
  title: NotificationTemplateResponse API
  version: 1.0.0
paths:
  /notification_template:
    get:
      operationId: listNotificationTemplate
      summary: Get all notification_template
      responses:
        '200':
          description: List of notification_template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationTemplateResponse'
    post:
      operationId: createNotificationTemplate
      summary: Create a new notification_template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /notification_template/{id}:
    get:
      operationId: getNotificationTemplateById
      summary: Get notification_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: notification_template object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateResponse'
        '404':
          description: notification_template not found
    put:
      operationId: updateNotificationTemplate
      summary: Update notification_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTemplateUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateResponse'
        '400':
          description: Invalid request
        '404':
          description: notification_template not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteNotificationTemplate
      summary: Delete notification_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: notification_template not found
components:
