    NotificationTemplateRequest:
      type: object
      required:
        - name
        - channel
        - body_template
      additionalProperties: false
      properties:
        notification_template_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        channel:
          type: string
        subject_template:
          type: string
          nullable: true
        body_template:
          type: string
        is_mandatory:
          type: boolean
          default: false
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    NotificationTemplateUpdateRequest:
      type: object
      required:
        - notification_template_code
        - name
        - description
        - channel
        - subject_template
        - body_template
        - is_mandatory
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        notification_template_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        channel:
          type: string
        subject_template:
          type: string
          nullable: true
        body_template:
          type: string
        is_mandatory:
          type: boolean
          default: false
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    NotificationTemplateResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - channel
        - body_template
        - is_mandatory
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        notification_template_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        channel:
          type: string
        subject_template:
          type: string
          nullable: true
        body_template:
          type: string
        is_mandatory:
          type: boolean
          default: false
        sort_order:
          type: integer
