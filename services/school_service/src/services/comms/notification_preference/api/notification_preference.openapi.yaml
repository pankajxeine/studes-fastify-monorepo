openapi: 3.0.0
x-sql-table: comms_notification_preference
info:
  title: NotificationPreferenceResponse API
  version: 1.0.0
paths:
  /notification_preference:
    get:
      operationId: listNotificationPreference
      summary: Get all notification_preference
      responses:
        '200':
          description: List of notification_preference
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreferenceResponse'
    post:
      operationId: createNotificationPreference
      summary: Create a new notification_preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /notification_preference/{id}:
    get:
      operationId: getNotificationPreferenceById
      summary: Get notification_preference by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: notification_preference object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceResponse'
        '404':
          description: notification_preference not found
    put:
      operationId: updateNotificationPreference
      summary: Update notification_preference by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceResponse'
        '400':
          description: Invalid request
        '404':
          description: notification_preference not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteNotificationPreference
      summary: Delete notification_preference by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: notification_preference not found
components:
  schemas:

    NotificationPreferenceRequest:
      type: object
      required:
        - app_user_id
        - notification_template_code
        - channel
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        notification_template_code:
          type: string
        channel:
          type: string
        is_enabled:
          type: boolean
          default: true

    NotificationPreferenceUpdateRequest:
      type: object
      required:
        - app_user_id
        - notification_template_code
        - channel
        - is_enabled
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        notification_template_code:
          type: string
        channel:
          type: string
        is_enabled:
          type: boolean
          default: true

    NotificationPreferenceResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - notification_preference_id
        - app_user_id
        - notification_template_code
        - channel
        - is_enabled
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        notification_preference_id:
          type: string
          format: uuid
          readOnly: true
        app_user_id:
          type: string
          format: uuid
        notification_template_code:
          type: string
        channel:
          type: string
        is_enabled:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
