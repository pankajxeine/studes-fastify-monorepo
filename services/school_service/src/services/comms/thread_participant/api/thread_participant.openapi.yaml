        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
          nullable: true
        last_read_at:
          type: string
          format: date-time
          nullable: true
        is_muted:
          type: boolean
          default: false

    ThreadParticipantUpdateRequest:
