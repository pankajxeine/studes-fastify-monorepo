openapi: 3.0.0
x-sql-table: comms_thread_participant
info:
  title: ThreadParticipantResponse API
  version: 1.0.0
paths:
  /thread_participant:
    get:
      operationId: listThreadParticipant
      summary: Get all thread_participant
      responses:
        '200':
          description: List of thread_participant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreadParticipantResponse'
    post:
      operationId: createThreadParticipant
      summary: Create a new thread_participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadParticipantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadParticipantResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /thread_participant/{id}:
    get:
      operationId: getThreadParticipantById
      summary: Get thread_participant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: thread_participant object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadParticipantResponse'
        '404':
          description: thread_participant not found
    put:
      operationId: updateThreadParticipant
      summary: Update thread_participant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadParticipantUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadParticipantResponse'
        '400':
          description: Invalid request
        '404':
          description: thread_participant not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteThreadParticipant
      summary: Delete thread_participant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: thread_participant not found
