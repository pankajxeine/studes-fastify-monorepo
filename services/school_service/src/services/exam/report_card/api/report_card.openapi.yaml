openapi: 3.0.0
x-sql-table: exam_report_card
info:
  title: ReportCardResponse API
  version: 1.0.0
paths:
  /report_card:
    get:
      operationId: listReportCard
      summary: Get all report_card
      responses:
        '200':
          description: List of report_card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportCardResponse'
    post:
      operationId: createReportCard
      summary: Create a new report_card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCardRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCardResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /report_card/{id}:
    get:
      operationId: getReportCardById
      summary: Get report_card by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: report_card object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCardResponse'
        '404':
          description: report_card not found
    put:
      operationId: updateReportCard
      summary: Update report_card by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCardUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCardResponse'
        '400':
          description: Invalid request
        '404':
          description: report_card not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteReportCard
      summary: Delete report_card by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: report_card not found
components:
  schemas:

    ReportCardRequest:
      type: object
      required:
        - student_id
        - student_enrollment_id
        - term_id
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        student_enrollment_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
        exam_id:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          default: "term_end"
          enum:
            - "progress"
            - "term_end"
            - "annual"
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "generated"
            - "published"
            - "withdrawn"
        overall_percentage:
          type: string
          nullable: true
        overall_grade:
          type: string
          nullable: true
          maxLength: 5
        gpa:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 4
        class_rank:
          type: integer
          format: int32
          nullable: true
        class_size:
          type: integer
          format: int32
          nullable: true
        attendance_pct:
          type: string
          nullable: true
        days_present:
          type: number
          format: double
          nullable: true
        working_days:
          type: integer
          format: int32
          nullable: true
        file_id:
          type: string
          format: uuid
          nullable: true
        generated_at:
          type: string
          format: date-time
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        published_by_user_id:
          type: string
          format: uuid
          nullable: true
        withdrawn_reason:
          type: string
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_by_person_id:
          type: string
          format: uuid
          nullable: true

