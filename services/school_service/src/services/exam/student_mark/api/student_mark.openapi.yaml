openapi: 3.0.0
x-sql-table: exam_student_mark
info:
  title: StudentMarkResponse API
  version: 1.0.0
paths:
  /student_mark:
    get:
      operationId: listStudentMark
      summary: Get all student_mark
      responses:
        '200':
          description: List of student_mark
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentMarkResponse'
    post:
      operationId: createStudentMark
      summary: Create a new student_mark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMarkRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentMarkResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /student_mark/{id}:
    get:
      operationId: getStudentMarkById
      summary: Get student_mark by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: student_mark object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentMarkResponse'
        '404':
          description: student_mark not found
    put:
      operationId: updateStudentMark
      summary: Update student_mark by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMarkUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentMarkResponse'
        '400':
          description: Invalid request
        '404':
          description: student_mark not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStudentMark
      summary: Delete student_mark by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: student_mark not found
components:
  schemas:

    StudentMarkRequest:
      type: object
      required:
        - exam_schedule_id
        - student_id
        - entered_by_staff_id
      additionalProperties: false
      properties:
        exam_schedule_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        marks_obtained:
          type: number
          format: double
          nullable: true
        is_absent:
          type: boolean
          default: false
        is_exempt:
          type: boolean
          default: false
        percentage:
          type: string
          nullable: true
        grade_label:
          type: string
          nullable: true
          maxLength: 5
        entered_by_staff_id:
          type: string
          format: uuid
        entered_at:
          type: string
          format: date-time
        original_marks:
          type: number
          format: double
          nullable: true
        moderation_reason:
          type: string
          nullable: true
        moderated_at:
          type: string
          format: date-time
          nullable: true
        remarks:
          type: string
          nullable: true

