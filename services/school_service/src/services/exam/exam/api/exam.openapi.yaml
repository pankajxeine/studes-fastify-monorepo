        - record_code
        - exam_id
        - academic_year_id
        - term_id
        - campus_id
        - assessment_type_code
        - code
        - name
        - start_date
        - end_date
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
