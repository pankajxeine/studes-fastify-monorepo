openapi: 3.0.0
x-sql-table: exam_assessment_type
info:
  title: AssessmentTypeResponse API
  version: 1.0.0
paths:
  /assessment_type:
    get:
      operationId: listAssessmentType
      summary: Get all assessment_type
      responses:
        '200':
          description: List of assessment_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentTypeResponse'
    post:
      operationId: createAssessmentType
      summary: Create a new assessment_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /assessment_type/{id}:
    get:
      operationId: getAssessmentTypeById
      summary: Get assessment_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: assessment_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentTypeResponse'
        '404':
          description: assessment_type not found
    put:
      operationId: updateAssessmentType
      summary: Update assessment_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: assessment_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAssessmentType
      summary: Delete assessment_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: assessment_type not found
components:
  schemas:

    AssessmentTypeRequest:
      type: object
      required:
        - name
        - category
      additionalProperties: false
      properties:
        assessment_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          enum:
            - "formative"
            - "summative"
            - "practical"
            - "coursework"
        is_scheduled_exam:
          type: boolean
          default: true
        default_max_marks:
          type: number
          format: double
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    AssessmentTypeUpdateRequest:
      type: object
      required:
        - assessment_type_code
        - name
        - description
        - category
        - is_scheduled_exam
        - default_max_marks
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        assessment_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          enum:
            - "formative"
            - "summative"
            - "practical"
            - "coursework"
        is_scheduled_exam:
          type: boolean
          default: true
        default_max_marks:
          type: number
          format: double
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    AssessmentTypeResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - category
        - is_scheduled_exam
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        assessment_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          enum:
            - "formative"
            - "summative"
            - "practical"
            - "coursework"
        is_scheduled_exam:
          type: boolean
          default: true
        default_max_marks:
          type: number
          format: double
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
