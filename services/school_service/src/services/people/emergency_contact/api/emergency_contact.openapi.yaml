          nullable: true
        relationship_type_code:
          type: string
        phone:
          type: string
        alt_phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        priority:
          type: integer
          format: int32
          minimum: 1
          maximum: 9
          default: 1
        notes:
          type: string
