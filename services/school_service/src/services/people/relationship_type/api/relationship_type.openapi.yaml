openapi: 3.0.0
x-sql-table: ppl_relationship_type
info:
  title: RelationshipTypeResponse API
  version: 1.0.0
paths:
  /relationship_type:
    get:
      operationId: listRelationshipType
      summary: Get all relationship_type
      responses:
        '200':
          description: List of relationship_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationshipTypeResponse'
    post:
      operationId: createRelationshipType
      summary: Create a new relationship_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /relationship_type/{id}:
    get:
      operationId: getRelationshipTypeById
      summary: Get relationship_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: relationship_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipTypeResponse'
        '404':
          description: relationship_type not found
    put:
      operationId: updateRelationshipType
      summary: Update relationship_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: relationship_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteRelationshipType
      summary: Delete relationship_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: relationship_type not found
components:
  schemas:

    RelationshipTypeRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        relationship_type_code:
          type: string
          nullable: true
        name:
          type: string
        is_guardian_eligible:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RelationshipTypeUpdateRequest:
      type: object
      required:
        - relationship_type_code
        - name
        - is_guardian_eligible
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        relationship_type_code:
          type: string
          nullable: true
        name:
          type: string
        is_guardian_eligible:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RelationshipTypeResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - is_guardian_eligible
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        relationship_type_code:
          type: string
          nullable: true
        name:
          type: string
        is_guardian_eligible:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
