openapi: 3.0.0
x-sql-table: ppl_person
info:
  title: PersonResponse API
  version: 1.0.0
paths:
  /person:
    get:
      operationId: listPerson
      summary: Get all person
      responses:
        '200':
          description: List of person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonResponse'
    post:
      operationId: createPerson
      summary: Create a new person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /person/{id}:
    get:
      operationId: getPersonById
      summary: Get person by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: person object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '404':
          description: person not found
    put:
      operationId: updatePerson
      summary: Update person by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: Invalid request
        '404':
          description: person not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePerson
      summary: Delete person by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: person not found
components:
  schemas:

    PersonRequest:
      type: object
      required:
        - first_name
        - last_name
      additionalProperties: false
      properties:
        honorific:
          type: string
          nullable: true
          maxLength: 10
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        full_name:
          type: string
          nullable: true
        preferred_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender_code:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
          maxLength: 2
        national_id:
          type: string
          nullable: true
          maxLength: 40
        passport_no:
          type: string
          nullable: true
          maxLength: 30
        primary_email:
          type: string
          nullable: true
        primary_phone:
          type: string
          nullable: true
        first_language:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true

    PersonUpdateRequest:
      type: object
      required:
        - honorific
        - first_name
        - middle_name
        - last_name
        - full_name
        - preferred_name
        - date_of_birth
        - gender_code
        - nationality
        - national_id
        - passport_no
        - primary_email
        - primary_phone
        - first_language
        - photo_file_id
        - notes
      additionalProperties: false
      properties:
        honorific:
          type: string
          nullable: true
          maxLength: 10
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        full_name:
          type: string
          nullable: true
        preferred_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender_code:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
          maxLength: 2
        national_id:
          type: string
          nullable: true
          maxLength: 40
        passport_no:
          type: string
          nullable: true
          maxLength: 30
        primary_email:
          type: string
          nullable: true
        primary_phone:
          type: string
          nullable: true
        first_language:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true

    PersonResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - person_id
        - first_name
        - last_name
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        person_id:
          type: string
          format: uuid
          readOnly: true
        honorific:
          type: string
          nullable: true
          maxLength: 10
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        full_name:
          type: string
          nullable: true
        preferred_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender_code:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
          maxLength: 2
        national_id:
          type: string
          nullable: true
          maxLength: 40
        passport_no:
          type: string
          nullable: true
          maxLength: 30
        primary_email:
          type: string
          nullable: true
        primary_phone:
          type: string
          nullable: true
        first_language:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
