openapi: 3.0.0
x-sql-table: ppl_person_address
info:
  title: PersonAddressResponse API
  version: 1.0.0
paths:
  /person_address:
    get:
      operationId: listPersonAddress
      summary: Get all person_address
      responses:
        '200':
          description: List of person_address
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonAddressResponse'
    post:
      operationId: createPersonAddress
      summary: Create a new person_address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonAddressResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /person_address/{id}:
    get:
      operationId: getPersonAddressById
      summary: Get person_address by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: person_address object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonAddressResponse'
        '404':
          description: person_address not found
    put:
      operationId: updatePersonAddress
      summary: Update person_address by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonAddressUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonAddressResponse'
        '400':
          description: Invalid request
        '404':
          description: person_address not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePersonAddress
      summary: Delete person_address by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: person_address not found
components:
  schemas:

    PersonAddressRequest:
      type: object
      required:
        - person_id
        - address_line1
        - city
        - country_code
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        address_type:
          type: string
          maxLength: 12
          default: "home"
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        city:
          type: string
        state_region:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
          maxLength: 20
        country_code:
          type: string
          maxLength: 2
        is_primary:
          type: boolean
          default: false
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true

    PersonAddressUpdateRequest:
      type: object
      required:
        - person_id
        - address_type
        - address_line1
        - address_line2
        - city
        - state_region
        - postal_code
        - country_code
        - is_primary
        - valid_from
        - valid_to
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        address_type:
          type: string
          maxLength: 12
          default: "home"
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        city:
          type: string
        state_region:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
          maxLength: 20
        country_code:
          type: string
          maxLength: 2
        is_primary:
          type: boolean
          default: false
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true

    PersonAddressResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - person_address_id
        - person_id
        - address_type
        - address_line1
        - city
        - country_code
        - is_primary
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        person_address_id:
          type: string
          format: uuid
          readOnly: true
        person_id:
          type: string
          format: uuid
        address_type:
          type: string
          maxLength: 12
          default: "home"
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        city:
          type: string
        state_region:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
          maxLength: 20
        country_code:
          type: string
          maxLength: 2
        is_primary:
          type: boolean
          default: false
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
