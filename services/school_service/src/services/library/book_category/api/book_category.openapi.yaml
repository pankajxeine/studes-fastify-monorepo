openapi: 3.0.0
x-sql-table: lib_book_category
info:
  title: BookCategoryResponse API
  version: 1.0.0
paths:
  /book_category:
    get:
      operationId: listBookCategory
      summary: Get all book_category
      responses:
        '200':
          description: List of book_category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCategoryResponse'
    post:
      operationId: createBookCategory
      summary: Create a new book_category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCategoryResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /book_category/{id}:
    get:
      operationId: getBookCategoryById
      summary: Get book_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: book_category object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCategoryResponse'
        '404':
          description: book_category not found
    put:
      operationId: updateBookCategory
      summary: Update book_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCategoryUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCategoryResponse'
        '400':
          description: Invalid request
        '404':
          description: book_category not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteBookCategory
      summary: Delete book_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: book_category not found
components:
  schemas:

    BookCategoryRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        book_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        dewey_class:
          type: string
          nullable: true
          maxLength: 20
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    BookCategoryUpdateRequest:
      type: object
      required:
        - book_category_code
        - name
        - description
        - dewey_class
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        book_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        dewey_class:
          type: string
          nullable: true
          maxLength: 20
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    BookCategoryResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        book_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        dewey_class:
          type: string
          nullable: true
          maxLength: 20
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
