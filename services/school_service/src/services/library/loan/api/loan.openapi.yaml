openapi: 3.0.0
x-sql-table: lib_loan
info:
  title: LoanResponse API
  version: 1.0.0
paths:
  /loan:
    get:
      operationId: listLoan
      summary: Get all loan
      responses:
        '200':
          description: List of loan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponse'
    post:
      operationId: createLoan
      summary: Create a new loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /loan/{id}:
    get:
      operationId: getLoanById
      summary: Get loan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: loan object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '404':
          description: loan not found
    put:
      operationId: updateLoan
      summary: Update loan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid request
        '404':
          description: loan not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLoan
      summary: Delete loan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: loan not found
components:
  schemas:

    LoanRequest:
      type: object
      required:
        - book_copy_id
        - library_membership_id
        - due_on
        - issued_by_user_id
      additionalProperties: false
      properties:
        book_copy_id:
          type: string
          format: uuid
        library_membership_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        due_on:
          type: string
          format: date
        returned_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          maxLength: 10
          default: "open"
        renewal_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          default: 0
        fine_per_day_amount:
          type: string
          default: 0.25
        fine_amount:
          type: string
          default: 0
        fine_waived_amount:
          type: string
          default: 0
        fine_invoice_id:
          type: string
          format: uuid
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
        received_by_user_id:
          type: string
          format: uuid
          nullable: true
        return_condition:
          type: string
          nullable: true
          maxLength: 10
        notes:
          type: string
          nullable: true

    LoanUpdateRequest:
      type: object
      required:
        - book_copy_id
        - library_membership_id
        - issued_at
        - due_on
        - returned_at
        - status
        - renewal_count
        - fine_per_day_amount
        - fine_amount
        - fine_waived_amount
        - fine_invoice_id
        - issued_by_user_id
        - received_by_user_id
        - return_condition
        - notes
      additionalProperties: false
      properties:
        book_copy_id:
          type: string
          format: uuid
        library_membership_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        due_on:
          type: string
          format: date
        returned_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          maxLength: 10
          default: "open"
        renewal_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          default: 0
        fine_per_day_amount:
          type: string
          default: 0.25
        fine_amount:
          type: string
          default: 0
        fine_waived_amount:
          type: string
          default: 0
        fine_invoice_id:
          type: string
          format: uuid
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
        received_by_user_id:
          type: string
          format: uuid
          nullable: true
        return_condition:
          type: string
          nullable: true
          maxLength: 10
        notes:
          type: string
          nullable: true

    LoanResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - loan_id
        - book_copy_id
        - library_membership_id
        - issued_at
        - due_on
        - status
        - renewal_count
        - fine_per_day_amount
        - fine_amount
        - fine_waived_amount
        - issued_by_user_id
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        loan_id:
          type: string
          format: uuid
          readOnly: true
        book_copy_id:
          type: string
          format: uuid
        library_membership_id:
          type: string
          format: uuid
        issued_at:
          type: string
          format: date-time
        due_on:
          type: string
          format: date
        returned_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          maxLength: 10
          default: "open"
        renewal_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          default: 0
        fine_per_day_amount:
          type: string
          default: 0.25
        fine_amount:
          type: string
          default: 0
        fine_waived_amount:
          type: string
          default: 0
        fine_invoice_id:
          type: string
          format: uuid
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
        received_by_user_id:
          type: string
          format: uuid
          nullable: true
        return_condition:
          type: string
          nullable: true
          maxLength: 10
        notes:
          type: string
          nullable: true
