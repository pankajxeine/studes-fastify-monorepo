openapi: 3.0.0
x-sql-table: lib_book_author
info:
  title: BookAuthorResponse API
  version: 1.0.0
paths:
  /book_author:
    get:
      operationId: listBookAuthor
      summary: Get all book_author
      responses:
        '200':
          description: List of book_author
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookAuthorResponse'
    post:
      operationId: createBookAuthor
      summary: Create a new book_author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAuthorRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAuthorResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /book_author/{id}:
    get:
      operationId: getBookAuthorById
      summary: Get book_author by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: book_author object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAuthorResponse'
        '404':
          description: book_author not found
    put:
      operationId: updateBookAuthor
      summary: Update book_author by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAuthorUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAuthorResponse'
        '400':
          description: Invalid request
        '404':
          description: book_author not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteBookAuthor
      summary: Delete book_author by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: book_author not found
components:
  schemas:

    BookAuthorRequest:
      type: object
      required:
        - book_id
        - author_name
      additionalProperties: false
      properties:
        book_id:
          type: string
          format: uuid
        author_name:
          type: string
        author_role:
          type: string
          maxLength: 12
          default: "author"
        sequence_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 1

    BookAuthorUpdateRequest:
      type: object
      required:
        - book_id
        - author_name
        - author_role
        - sequence_no
      additionalProperties: false
      properties:
        book_id:
          type: string
          format: uuid
        author_name:
          type: string
        author_role:
          type: string
          maxLength: 12
          default: "author"
        sequence_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 1

    BookAuthorResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - book_author_id
        - book_id
        - author_name
        - author_role
        - sequence_no
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        book_author_id:
          type: string
          format: uuid
          readOnly: true
        book_id:
          type: string
          format: uuid
        author_name:
          type: string
        author_role:
          type: string
          maxLength: 12
          default: "author"
        sequence_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
