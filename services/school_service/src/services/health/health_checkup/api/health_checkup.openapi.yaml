          maxLength: 10
        hearing_notes:
          type: string
          nullable: true
        dental_notes:
          type: string
          nullable: true
        findings:
          type: string
          nullable: true
        recommendations:
          type: string
          nullable: true
        is_referral_needed:
          type: boolean
          default: false
        checked_by_staff_id:
          type: string
          format: uuid
          nullable: true
        examiner_name:
          type: string
          nullable: true
        file_id:
          type: string
