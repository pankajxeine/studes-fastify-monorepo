openapi: 3.0.0
x-sql-table: health_medical_profile
info:
  title: MedicalProfileResponse API
  version: 1.0.0
paths:
  /medical_profile:
    get:
      operationId: listMedicalProfile
      summary: Get all medical_profile
      responses:
        '200':
          description: List of medical_profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicalProfileResponse'
    post:
      operationId: createMedicalProfile
      summary: Create a new medical_profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalProfileRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalProfileResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /medical_profile/{id}:
    get:
      operationId: getMedicalProfileById
      summary: Get medical_profile by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: medical_profile object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalProfileResponse'
        '404':
          description: medical_profile not found
    put:
      operationId: updateMedicalProfile
      summary: Update medical_profile by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalProfileUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalProfileResponse'
        '400':
          description: Invalid request
        '404':
          description: medical_profile not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMedicalProfile
      summary: Delete medical_profile by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: medical_profile not found
components:
  schemas:

    MedicalProfileRequest:
      type: object
      required:
        - person_id
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        blood_group:
          type: string
          nullable: true
          maxLength: 7
        height_cm:
          type: number
          format: double
          nullable: true
          minimum: 30
          maximum: 250
        weight_kg:
          type: number
          format: double
          nullable: true
          minimum: 1
          maximum: 400
        allergies:
          type: string
          nullable: true
        has_severe_allergy:
          type: boolean
          default: false
        chronic_conditions:
          type: string
          nullable: true
        medications:
          type: string
          nullable: true
        dietary_restrictions:
