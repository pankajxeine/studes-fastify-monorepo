openapi: 3.0.0
x-sql-table: atnd_attendance_type
info:
  title: AttendanceTypeResponse API
  version: 1.0.0
paths:
  /attendance_type:
    get:
      operationId: listAttendanceType
      summary: Get all attendance_type
      responses:
        '200':
          description: List of attendance_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceTypeResponse'
    post:
      operationId: createAttendanceType
      summary: Create a new attendance_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /attendance_type/{id}:
    get:
      operationId: getAttendanceTypeById
      summary: Get attendance_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: attendance_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceTypeResponse'
        '404':
          description: attendance_type not found
    put:
      operationId: updateAttendanceType
      summary: Update attendance_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: attendance_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAttendanceType
      summary: Delete attendance_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: attendance_type not found
components:
