      additionalProperties: false
      properties:
        attendance_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        present_weight:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 1
        counts_toward_total:
          type: boolean
          default: true
        is_excused:
          type: boolean
          default: false
        applies_to_students:
          type: boolean
          default: true
        applies_to_staff:
          type: boolean
          default: true
        color_hex:
          type: string
          nullable: true
          maxLength: 7
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

