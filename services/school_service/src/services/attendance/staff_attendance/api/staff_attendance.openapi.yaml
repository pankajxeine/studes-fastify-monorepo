      operationId: getStaffAttendanceById
      summary: Get staff_attendance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: staff_attendance object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAttendanceResponse'
        '404':
          description: staff_attendance not found
    put:
      operationId: updateStaffAttendance
      summary: Update staff_attendance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAttendanceUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAttendanceResponse'
        '400':
          description: Invalid request
        '404':
          description: staff_attendance not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStaffAttendance
      summary: Delete staff_attendance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: staff_attendance not found
