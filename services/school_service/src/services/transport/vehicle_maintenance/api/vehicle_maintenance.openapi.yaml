openapi: 3.0.0
x-sql-table: tran_vehicle_maintenance
info:
  title: VehicleMaintenanceResponse API
  version: 1.0.0
paths:
  /vehicle_maintenance:
    get:
      operationId: listVehicleMaintenance
      summary: Get all vehicle_maintenance
      responses:
        '200':
          description: List of vehicle_maintenance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleMaintenanceResponse'
    post:
      operationId: createVehicleMaintenance
      summary: Create a new vehicle_maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleMaintenanceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleMaintenanceResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /vehicle_maintenance/{id}:
    get:
      operationId: getVehicleMaintenanceById
      summary: Get vehicle_maintenance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: vehicle_maintenance object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleMaintenanceResponse'
        '404':
          description: vehicle_maintenance not found
    put:
      operationId: updateVehicleMaintenance
      summary: Update vehicle_maintenance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleMaintenanceUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleMaintenanceResponse'
        '400':
          description: Invalid request
        '404':
          description: vehicle_maintenance not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteVehicleMaintenance
      summary: Delete vehicle_maintenance by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: vehicle_maintenance not found
components:
  schemas:

    VehicleMaintenanceRequest:
      type: object
      required:
        - vehicle_id
        - maintenance_type
        - scheduled_on
        - description
      additionalProperties: false
      properties:
        vehicle_id:
          type: string
          format: uuid
        vendor_id:
          type: string
          format: uuid
          nullable: true
        maintenance_type:
          type: string
          maxLength: 20
        status:
          type: string
          maxLength: 20
          default: "scheduled"
        scheduled_on:
          type: string
          format: date
        started_on:
          type: string
          format: date
          nullable: true
        completed_on:
          type: string
          format: date
          nullable: true
        odometer_km:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
        cost_amount:
          type: string
          default: 0
        invoice_no:
          type: string
          nullable: true
          maxLength: 40
        next_service_due_on:
          type: string
          format: date
          nullable: true
        next_service_due_km:
          type: integer
          format: int32
          nullable: true
        notes:
          type: string
          nullable: true

    VehicleMaintenanceUpdateRequest:
