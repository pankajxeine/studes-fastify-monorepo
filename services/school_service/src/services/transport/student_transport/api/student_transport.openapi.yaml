openapi: 3.0.0
x-sql-table: tran_student_transport
info:
  title: StudentTransportResponse API
  version: 1.0.0
paths:
  /student_transport:
    get:
      operationId: listStudentTransport
      summary: Get all student_transport
      responses:
        '200':
          description: List of student_transport
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentTransportResponse'
    post:
      operationId: createStudentTransport
      summary: Create a new student_transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransportRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransportResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /student_transport/{id}:
    get:
      operationId: getStudentTransportById
      summary: Get student_transport by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: student_transport object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransportResponse'
        '404':
          description: student_transport not found
    put:
      operationId: updateStudentTransport
      summary: Update student_transport by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransportUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransportResponse'
        '400':
          description: Invalid request
        '404':
          description: student_transport not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStudentTransport
      summary: Delete student_transport by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: student_transport not found
components:
  schemas:

    StudentTransportRequest:
      type: object
      required:
        - student_id
        - route_stop_id
        - academic_year_id
        - start_date
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        route_stop_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        service_type:
          type: string
          maxLength: 20
          default: "both"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 20
          default: "active"
        pickup_person_note:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    StudentTransportUpdateRequest:
      type: object
      required:
        - student_id
        - route_stop_id
        - academic_year_id
        - service_type
        - start_date
        - end_date
        - validity
        - status
        - pickup_person_note
        - notes
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        route_stop_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        service_type:
          type: string
          maxLength: 20
          default: "both"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 20
          default: "active"
        pickup_person_note:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    StudentTransportResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - student_transport_id
        - student_id
        - route_stop_id
        - academic_year_id
        - service_type
        - start_date
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        student_transport_id:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          format: uuid
        route_stop_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        service_type:
          type: string
          maxLength: 20
          default: "both"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 20
          default: "active"
        pickup_person_note:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
