        - distance_km
        - last_route_stop_id
        - stop_checkins
        - students_boarded
        - delay_minutes
        - incident_notes
      additionalProperties: false
      properties:
        route_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_staff_id:
          type: string
          format: uuid
        trip_date:
          type: string
          format: date
        direction:
          type: string
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "in_progress"
            - "completed"
            - "cancelled"
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        odometer_start_km:
          type: integer
          format: int32
          nullable: true
        odometer_end_km:
          type: integer
          format: int32
          nullable: true
        distance_km:
          type: integer
          format: int32
          nullable: true
        last_route_stop_id:
          type: string
          format: uuid
          nullable: true
        stop_checkins:
