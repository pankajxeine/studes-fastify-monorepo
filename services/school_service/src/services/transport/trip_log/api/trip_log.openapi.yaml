openapi: 3.0.0
x-sql-table: tran_trip_log
info:
  title: TripLogResponse API
  version: 1.0.0
paths:
  /trip_log:
    get:
      operationId: listTripLog
      summary: Get all trip_log
      responses:
        '200':
          description: List of trip_log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripLogResponse'
    post:
      operationId: createTripLog
      summary: Create a new trip_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripLogRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLogResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /trip_log/{id}:
    get:
      operationId: getTripLogById
      summary: Get trip_log by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: trip_log object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLogResponse'
        '404':
          description: trip_log not found
    put:
      operationId: updateTripLog
      summary: Update trip_log by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripLogUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLogResponse'
        '400':
          description: Invalid request
        '404':
          description: trip_log not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTripLog
      summary: Delete trip_log by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: trip_log not found
components:
  schemas:

    TripLogRequest:
      type: object
      required:
        - route_id
        - vehicle_id
        - driver_staff_id
        - trip_date
        - direction
      additionalProperties: false
      properties:
        route_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
        driver_staff_id:
          type: string
          format: uuid
        trip_date:
          type: string
          format: date
        direction:
          type: string
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "in_progress"
            - "completed"
            - "cancelled"
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        odometer_start_km:
          type: integer
          format: int32
          nullable: true
        odometer_end_km:
          type: integer
          format: int32
          nullable: true
        distance_km:
          type: integer
          format: int32
          nullable: true
        last_route_stop_id:
          type: string
          format: uuid
          nullable: true
        stop_checkins:
          default: "[]"
        students_boarded:
          type: integer
          format: int32
          default: 0
        delay_minutes:
          type: integer
          format: int32
          default: 0
        incident_notes:
          type: string
          nullable: true

    TripLogUpdateRequest:
      type: object
      required:
        - route_id
        - vehicle_id
        - driver_staff_id
        - trip_date
        - direction
        - status
        - started_at
        - ended_at
        - odometer_start_km
