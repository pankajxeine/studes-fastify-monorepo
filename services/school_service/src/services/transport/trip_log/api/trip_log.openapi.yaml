        - public_id
        - record_code
        - trip_log_id
        - route_id
        - vehicle_id
        - driver_staff_id
        - trip_date
        - direction
        - status
        - stop_checkins
        - students_boarded
        - delay_minutes
        - created_at
        - updated_at
      additionalProperties: false
