openapi: 3.0.0
x-sql-table: iam_role_permission
info:
  title: RolePermissionResponse API
  version: 1.0.0
paths:
  /role_permission:
    get:
      operationId: listRolePermission
      summary: Get all role_permission
      responses:
        '200':
          description: List of role_permission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolePermissionResponse'
    post:
      operationId: createRolePermission
      summary: Create a new role_permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /role_permission/{id}:
    get:
      operationId: getRolePermissionById
      summary: Get role_permission by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: role_permission object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionResponse'
        '404':
          description: role_permission not found
    put:
      operationId: updateRolePermission
      summary: Update role_permission by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionResponse'
        '400':
          description: Invalid request
        '404':
          description: role_permission not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteRolePermission
      summary: Delete role_permission by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: role_permission not found
components:
  schemas:

    RolePermissionRequest:
      type: object
      required:
        - role_code
        - permission_code
      additionalProperties: false
      properties:
        role_code:
          type: string
        permission_code:
          type: string

    RolePermissionUpdateRequest:
      type: object
      required:
        - role_code
        - permission_code
      additionalProperties: false
      properties:
        role_code:
          type: string
        permission_code:
          type: string

    RolePermissionResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - role_code
        - permission_code
        - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        role_code:
          type: string
        permission_code:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
