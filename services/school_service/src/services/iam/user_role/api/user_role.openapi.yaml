        - role_code
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        role_code:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        granted_by_user_id:
          type: string
          format: uuid
          nullable: true
        granted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by_user_id:
          type: string
          format: uuid
          nullable: true
        revoke_reason:
          type: string
          nullable: true

