openapi: 3.0.0
x-sql-table: iam_user_role
info:
  title: UserRoleResponse API
  version: 1.0.0
paths:
  /user_role:
    get:
      operationId: listUserRole
      summary: Get all user_role
      responses:
        '200':
          description: List of user_role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'
    post:
      operationId: createUserRole
      summary: Create a new user_role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /user_role/{id}:
    get:
      operationId: getUserRoleById
      summary: Get user_role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: user_role object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
        '404':
          description: user_role not found
    put:
      operationId: updateUserRole
      summary: Update user_role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResponse'
        '400':
          description: Invalid request
        '404':
          description: user_role not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteUserRole
      summary: Delete user_role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: user_role not found
components:
