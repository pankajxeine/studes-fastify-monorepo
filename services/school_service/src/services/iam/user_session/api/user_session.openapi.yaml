          nullable: true
        client_type:
          type: string
          maxLength: 10
          default: "web"
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
