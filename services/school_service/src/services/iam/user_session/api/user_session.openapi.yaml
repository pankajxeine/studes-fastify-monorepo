openapi: 3.0.0
x-sql-table: iam_user_session
info:
  title: UserSessionResponse API
  version: 1.0.0
paths:
  /user_session:
    get:
      operationId: listUserSession
      summary: Get all user_session
      responses:
        '200':
          description: List of user_session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionResponse'
    post:
      operationId: createUserSession
      summary: Create a new user_session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /user_session/{id}:
    get:
      operationId: getUserSessionById
      summary: Get user_session by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: user_session object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
        '404':
          description: user_session not found
    put:
      operationId: updateUserSession
      summary: Update user_session by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSessionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
        '400':
          description: Invalid request
        '404':
          description: user_session not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteUserSession
      summary: Delete user_session by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: user_session not found
components:
  schemas:

    UserSessionRequest:
      type: object
      required:
        - app_user_id
        - token_hash
        - expires_at
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        client_type:
          type: string
          maxLength: 10
          default: "web"
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
          nullable: true
          maxLength: 20

    UserSessionUpdateRequest:
      type: object
      required:
        - app_user_id
        - token_hash
        - campus_id
        - client_type
        - ip_address
        - user_agent
        - started_at
        - last_seen_at
        - expires_at
        - ended_at
        - end_reason
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        client_type:
          type: string
          maxLength: 10
          default: "web"
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
          nullable: true
          maxLength: 20

    UserSessionResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - user_session_id
        - app_user_id
        - token_hash
        - client_type
        - started_at
        - last_seen_at
        - expires_at
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        user_session_id:
          type: string
          format: uuid
          readOnly: true
        app_user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        campus_id:
          type: string
