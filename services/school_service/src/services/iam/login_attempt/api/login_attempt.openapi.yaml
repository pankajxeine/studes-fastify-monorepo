openapi: 3.0.0
x-sql-table: iam_login_attempt
info:
  title: LoginAttemptResponse API
  version: 1.0.0
paths:
  /login_attempt:
    get:
      operationId: listLoginAttempt
      summary: Get all login_attempt
      responses:
        '200':
          description: List of login_attempt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginAttemptResponse'
    post:
      operationId: createLoginAttempt
      summary: Create a new login_attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAttemptRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /login_attempt/{id}:
    get:
      operationId: getLoginAttemptById
      summary: Get login_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: login_attempt object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptResponse'
        '404':
          description: login_attempt not found
    put:
      operationId: updateLoginAttempt
      summary: Update login_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAttemptUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAttemptResponse'
        '400':
          description: Invalid request
        '404':
          description: login_attempt not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLoginAttempt
      summary: Delete login_attempt by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: login_attempt not found
components:
  schemas:

    LoginAttemptRequest:
      type: object
      required:
        - username_entered
        - is_success
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
          nullable: true
        username_entered:
          type: string
          maxLength: 254
        attempted_at:
          type: string
          format: date-time
        is_success:
          type: boolean
        failure_reason:
          type: string
          nullable: true
          maxLength: 20
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true

    LoginAttemptUpdateRequest:
      type: object
      required:
        - app_user_id
        - username_entered
        - attempted_at
        - is_success
        - failure_reason
        - ip_address
        - user_agent
      additionalProperties: false
      properties:
        app_user_id:
          type: string
          format: uuid
          nullable: true
        username_entered:
          type: string
          maxLength: 254
        attempted_at:
          type: string
          format: date-time
        is_success:
          type: boolean
        failure_reason:
          type: string
          nullable: true
          maxLength: 20
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true

    LoginAttemptResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - login_attempt_id
        - username_entered
        - attempted_at
        - is_success
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        login_attempt_id:
          type: string
          format: uuid
          readOnly: true
        app_user_id:
          type: string
          format: uuid
          nullable: true
        username_entered:
          type: string
          maxLength: 254
        attempted_at:
          type: string
          format: date-time
        is_success:
          type: boolean
        failure_reason:
          type: string
          nullable: true
          maxLength: 20
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
