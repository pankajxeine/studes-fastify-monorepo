openapi: 3.0.0
x-sql-table: iam_role
info:
  title: RoleResponse API
  version: 1.0.0
paths:
  /role:
    get:
      operationId: listRole
      summary: Get all role
      responses:
        '200':
          description: List of role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
    post:
      operationId: createRole
      summary: Create a new role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /role/{id}:
    get:
      operationId: getRoleById
      summary: Get role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: role object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: role not found
    put:
      operationId: updateRole
      summary: Update role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Invalid request
        '404':
          description: role not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteRole
      summary: Delete role by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: role not found
components:
  schemas:

    RoleRequest:
      type: object
      required:
        - name
        - persona
        - portal
      additionalProperties: false
      properties:
        role_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        portal:
          type: string
          maxLength: 30
        is_org_wide:
          type: boolean
          default: false
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RoleUpdateRequest:
      type: object
      required:
        - role_code
        - name
        - description
        - persona
        - portal
        - is_org_wide
        - is_system
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        role_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        portal:
          type: string
          maxLength: 30
        is_org_wide:
          type: boolean
          default: false
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    RoleResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - persona
        - portal
        - is_org_wide
        - is_system
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        role_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        persona:
          type: string
          maxLength: 20
        portal:
          type: string
          maxLength: 30
        is_org_wide:
          type: boolean
          default: false
        is_system:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
