openapi: 3.0.0
x-sql-table: iam_app_user
info:
  title: AppUserResponse API
  version: 1.0.0
paths:
  /app_user:
    get:
      operationId: listAppUser
      summary: Get all app_user
      responses:
        '200':
          description: List of app_user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUserResponse'
    post:
      operationId: createAppUser
      summary: Create a new app_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /app_user/{id}:
    get:
      operationId: getAppUserById
      summary: Get app_user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: app_user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserResponse'
        '404':
          description: app_user not found
    put:
      operationId: updateAppUser
      summary: Update app_user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUserUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUserResponse'
        '400':
          description: Invalid request
        '404':
          description: app_user not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAppUser
      summary: Delete app_user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: app_user not found
components:
  schemas:

    AppUserRequest:
      type: object
      required:
        - person_id
        - username
        - email
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 60
        email:
          type: string
        password_hash:
          type: string
          nullable: true
        status:
          type: string
          default: "invited"
        default_campus_id:
          type: string
          format: uuid
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        failed_login_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 0
        locked_until:
          type: string
          format: date-time
          nullable: true
        password_changed_at:
          type: string
          format: date-time
          nullable: true
        must_change_password:
          type: boolean
          default: false
        is_mfa_enabled:
          type: boolean
          default: false
        locale:
          type: string
          maxLength: 10
          default: "en-US"
        invited_at:
          type: string
          format: date-time
          nullable: true
        activated_at:
          type: string
          format: date-time
          nullable: true

