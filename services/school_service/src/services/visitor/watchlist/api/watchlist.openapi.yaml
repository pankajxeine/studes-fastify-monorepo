openapi: 3.0.0
x-sql-table: visitor_watchlist
info:
  title: WatchlistResponse API
  version: 1.0.0
paths:
  /watchlist:
    get:
      operationId: listWatchlist
      summary: Get all watchlist
      responses:
        '200':
          description: List of watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistResponse'
    post:
      operationId: createWatchlist
      summary: Create a new watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /watchlist/{id}:
    get:
      operationId: getWatchlistById
      summary: Get watchlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: watchlist object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '404':
          description: watchlist not found
    put:
      operationId: updateWatchlist
      summary: Update watchlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
        '400':
          description: Invalid request
        '404':
          description: watchlist not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteWatchlist
      summary: Delete watchlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: watchlist not found
