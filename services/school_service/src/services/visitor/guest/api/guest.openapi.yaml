openapi: 3.0.0
x-sql-table: visitor_guest
info:
  title: GuestResponse API
  version: 1.0.0
paths:
  /guest:
    get:
      operationId: listGuest
      summary: Get all guest
      responses:
        '200':
          description: List of guest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestResponse'
    post:
      operationId: createGuest
      summary: Create a new guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /guest/{id}:
    get:
      operationId: getGuestById
      summary: Get guest by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: guest object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '404':
          description: guest not found
    put:
      operationId: updateGuest
      summary: Update guest by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '400':
          description: Invalid request
        '404':
          description: guest not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteGuest
      summary: Delete guest by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: guest not found
components:
  schemas:

    GuestRequest:
      type: object
      required:
        - person_id
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        guest_type:
          type: string
          default: "visitor"
        organization_name:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        vendor_id:
          type: string
          format: uuid
          nullable: true
        id_document_type:
          type: string
          nullable: true
          maxLength: 20
        id_document_no:
          type: string
          nullable: true
          maxLength: 40
        id_document_key:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        vehicle_no:
          type: string
          nullable: true
          maxLength: 20
        safety_induction_on:
          type: string
          format: date
          nullable: true
        nda_signed_on:
          type: string
          format: date
          nullable: true
        is_frequent_visitor:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    GuestUpdateRequest:
      type: object
      required:
        - person_id
        - guest_type
        - organization_name
        - designation
        - vendor_id
        - id_document_type
        - id_document_no
        - id_document_key
        - photo_file_id
        - vehicle_no
        - safety_induction_on
        - nda_signed_on
        - is_frequent_visitor
        - is_active
        - notes
      additionalProperties: false
      properties:
        person_id:
          type: string
          format: uuid
        guest_type:
          type: string
          default: "visitor"
        organization_name:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        vendor_id:
          type: string
          format: uuid
          nullable: true
        id_document_type:
          type: string
          nullable: true
          maxLength: 20
        id_document_no:
          type: string
          nullable: true
          maxLength: 40
        id_document_key:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        vehicle_no:
          type: string
          nullable: true
          maxLength: 20
        safety_induction_on:
          type: string
          format: date
          nullable: true
        nda_signed_on:
          type: string
          format: date
          nullable: true
        is_frequent_visitor:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    GuestResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - guest_id
        - person_id
        - guest_type
        - is_frequent_visitor
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        guest_id:
          type: string
          format: uuid
          readOnly: true
        person_id:
          type: string
          format: uuid
        guest_type:
          type: string
          default: "visitor"
        organization_name:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        vendor_id:
          type: string
          format: uuid
          nullable: true
        id_document_type:
          type: string
          nullable: true
          maxLength: 20
        id_document_no:
          type: string
          nullable: true
          maxLength: 40
        id_document_key:
          type: string
          nullable: true
          maxLength: 40
        photo_file_id:
          type: string
          format: uuid
          nullable: true
        vehicle_no:
          type: string
          nullable: true
          maxLength: 20
        safety_induction_on:
          type: string
          format: date
          nullable: true
        nda_signed_on:
          type: string
          format: date
          nullable: true
        is_frequent_visitor:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
