openapi: 3.0.0
x-sql-table: ttbl_timetable_entry
info:
  title: TimetableEntryResponse API
  version: 1.0.0
paths:
  /timetable_entry:
    get:
      operationId: listTimetableEntry
      summary: Get all timetable_entry
      responses:
        '200':
          description: List of timetable_entry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimetableEntryResponse'
    post:
      operationId: createTimetableEntry
      summary: Create a new timetable_entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableEntryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableEntryResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /timetable_entry/{id}:
    get:
      operationId: getTimetableEntryById
      summary: Get timetable_entry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: timetable_entry object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableEntryResponse'
        '404':
          description: timetable_entry not found
    put:
      operationId: updateTimetableEntry
      summary: Update timetable_entry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableEntryUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableEntryResponse'
        '400':
          description: Invalid request
        '404':
          description: timetable_entry not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteTimetableEntry
      summary: Delete timetable_entry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: timetable_entry not found
components:
