          format: uuid
        section_id:
          type: string
          format: uuid
          nullable: true
        staff_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
          nullable: true
        period_id:
          type: string
          format: uuid
        day_of_week:
          type: string
        entry_type:
          type: string
          maxLength: 20
          default: "lecture"
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
        effective:
          type: string
          nullable: true
        notes:
          type: string
