openapi: 3.0.0
x-sql-table: ttbl_substitution
info:
  title: SubstitutionResponse API
  version: 1.0.0
paths:
  /substitution:
    get:
      operationId: listSubstitution
      summary: Get all substitution
      responses:
        '200':
          description: List of substitution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubstitutionResponse'
    post:
      operationId: createSubstitution
      summary: Create a new substitution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstitutionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /substitution/{id}:
    get:
      operationId: getSubstitutionById
      summary: Get substitution by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: substitution object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutionResponse'
        '404':
          description: substitution not found
    put:
      operationId: updateSubstitution
      summary: Update substitution by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubstitutionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutionResponse'
        '400':
          description: Invalid request
        '404':
          description: substitution not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteSubstitution
      summary: Delete substitution by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: substitution not found
components:
  schemas:

    SubstitutionRequest:
      type: object
      required:
        - timetable_entry_id
        - substitution_date
        - reason
      additionalProperties: false
      properties:
        timetable_entry_id:
          type: string
          format: uuid
        substitution_date:
          type: string
          format: date
        substitute_staff_id:
          type: string
          format: uuid
          nullable: true
        substitute_room_id:
          type: string
          format: uuid
          nullable: true
        is_class_cancelled:
          type: boolean
          default: false
        reason:
          type: string
        leave_request_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          default: "pending"
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true

    SubstitutionUpdateRequest:
      type: object
      required:
        - timetable_entry_id
        - substitution_date
        - substitute_staff_id
        - substitute_room_id
        - is_class_cancelled
        - reason
        - leave_request_id
        - status
        - requested_by_user_id
        - approved_by_user_id
        - approved_at
        - notes
      additionalProperties: false
      properties:
        timetable_entry_id:
          type: string
          format: uuid
        substitution_date:
          type: string
          format: date
        substitute_staff_id:
          type: string
          format: uuid
          nullable: true
        substitute_room_id:
          type: string
          format: uuid
          nullable: true
        is_class_cancelled:
          type: boolean
          default: false
        reason:
          type: string
        leave_request_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          default: "pending"
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true

    SubstitutionResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - substitution_id
        - timetable_entry_id
        - substitution_date
        - is_class_cancelled
        - reason
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        substitution_id:
          type: string
          format: uuid
          readOnly: true
        timetable_entry_id:
          type: string
          format: uuid
        substitution_date:
          type: string
          format: date
        substitute_staff_id:
          type: string
          format: uuid
          nullable: true
        substitute_room_id:
          type: string
          format: uuid
          nullable: true
        is_class_cancelled:
          type: boolean
          default: false
        reason:
          type: string
        leave_request_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          default: "pending"
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
