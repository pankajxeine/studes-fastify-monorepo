openapi: 3.0.0
x-sql-table: lms_lesson_plan
info:
  title: LessonPlanResponse API
  version: 1.0.0
paths:
  /lesson_plan:
    get:
      operationId: listLessonPlan
      summary: Get all lesson_plan
      responses:
        '200':
          description: List of lesson_plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonPlanResponse'
    post:
      operationId: createLessonPlan
      summary: Create a new lesson_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /lesson_plan/{id}:
    get:
      operationId: getLessonPlanById
      summary: Get lesson_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: lesson_plan object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanResponse'
        '404':
          description: lesson_plan not found
    put:
      operationId: updateLessonPlan
      summary: Update lesson_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanResponse'
        '400':
          description: Invalid request
        '404':
          description: lesson_plan not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLessonPlan
      summary: Delete lesson_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: lesson_plan not found
components:
  schemas:

    LessonPlanRequest:
      type: object
      required:
        - course_offering_id
        - staff_id
        - planned_date
        - unit_title
        - topic
        - learning_objectives
      additionalProperties: false
      properties:
        course_offering_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        planned_date:
          type: string
          format: date
        period_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
          default: 1
        sequence_no:
          type: integer
          format: int32
          nullable: true
        unit_title:
          type: string
        topic:
          type: string
        learning_objectives:
          type: string
        teaching_methods:
          type: string
          nullable: true
        resources:
          type: string
          nullable: true
        homework:
          type: string
          nullable: true
        assessment_notes:
          type: string
          nullable: true
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "submitted"
            - "approved"
            - "delivered"
            - "cancelled"
        submitted_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by_user_id:
