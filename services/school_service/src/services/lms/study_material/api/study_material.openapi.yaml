          type: string
          nullable: true
        material_type:
          type: string
        file_id:
          type: string
          format: uuid
          nullable: true
        external_url:
          type: string
          nullable: true
        unit_title:
          type: string
          nullable: true
        uploaded_by_user_id:
          type: string
          format: uuid
        is_published:
