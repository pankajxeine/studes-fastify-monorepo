openapi: 3.0.0
x-sql-table: fin_fee_installment
info:
  title: FeeInstallmentResponse API
  version: 1.0.0
paths:
  /fee_installment:
    get:
      operationId: listFeeInstallment
      summary: Get all fee_installment
      responses:
        '200':
          description: List of fee_installment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeeInstallmentResponse'
    post:
      operationId: createFeeInstallment
      summary: Create a new fee_installment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeInstallmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeInstallmentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /fee_installment/{id}:
    get:
      operationId: getFeeInstallmentById
      summary: Get fee_installment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: fee_installment object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeInstallmentResponse'
        '404':
          description: fee_installment not found
    put:
      operationId: updateFeeInstallment
      summary: Update fee_installment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeInstallmentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeInstallmentResponse'
        '400':
          description: Invalid request
        '404':
          description: fee_installment not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteFeeInstallment
      summary: Delete fee_installment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: fee_installment not found
components:
  schemas:

    FeeInstallmentRequest:
      type: object
      required:
        - fee_structure_id
        - installment_no
        - name
        - issue_on
        - due_on
        - amount
      additionalProperties: false
      properties:
        fee_structure_id:
          type: string
          format: uuid
        installment_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        name:
          type: string
        term_id:
          type: string
          format: uuid
          nullable: true
        issue_on:
          type: string
          format: date
        due_on:
          type: string
          format: date
        amount:
          type: string

    FeeInstallmentUpdateRequest:
      type: object
      required:
        - fee_structure_id
        - installment_no
        - name
        - term_id
        - issue_on
        - due_on
        - amount
      additionalProperties: false
      properties:
        fee_structure_id:
          type: string
          format: uuid
        installment_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        name:
          type: string
        term_id:
          type: string
          format: uuid
          nullable: true
        issue_on:
          type: string
          format: date
        due_on:
          type: string
          format: date
        amount:
          type: string

    FeeInstallmentResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - fee_installment_id
        - fee_structure_id
        - installment_no
        - name
        - issue_on
        - due_on
        - amount
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        fee_installment_id:
          type: string
          format: uuid
          readOnly: true
        fee_structure_id:
          type: string
          format: uuid
        installment_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        name:
          type: string
        term_id:
          type: string
          format: uuid
          nullable: true
        issue_on:
          type: string
          format: date
        due_on:
          type: string
          format: date
        amount:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
