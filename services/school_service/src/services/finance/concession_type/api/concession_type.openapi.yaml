    put:
      operationId: updateConcessionType
      summary: Update concession_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcessionTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcessionTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: concession_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteConcessionType
      summary: Delete concession_type by ID
      parameters:
