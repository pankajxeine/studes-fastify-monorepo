openapi: 3.0.0
x-sql-table: fin_invoice
info:
  title: InvoiceResponse API
  version: 1.0.0
paths:
  /invoice:
    get:
      operationId: listInvoice
      summary: Get all invoice
      responses:
        '200':
          description: List of invoice
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
    post:
      operationId: createInvoice
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /invoice/{id}:
    get:
      operationId: getInvoiceById
      summary: Get invoice by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: invoice object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: invoice not found
    put:
      operationId: updateInvoice
      summary: Update invoice by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          description: Invalid request
        '404':
          description: invoice not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteInvoice
      summary: Delete invoice by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: invoice not found
components:
  schemas:

    InvoiceRequest:
      type: object
      required:
        - invoice_no
        - student_id
        - academic_year_id
        - campus_id
        - invoice_date
        - due_on
      additionalProperties: false
      properties:
        invoice_no:
          type: string
          maxLength: 30
        student_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
        fee_installment_id:
          type: string
          format: uuid
          nullable: true
        term_id:
          type: string
          format: uuid
          nullable: true
        invoice_date:
          type: string
          format: date
        due_on:
          type: string
          format: date
        status:
          type: string
          default: "draft"
        subtotal_amount:
          type: string
          default: 0
        discount_amount:
          type: string
          default: 0
        total_amount:
          type: string
          default: 0
        paid_amount:
          type: string
          default: 0
        balance_amount:
          type: number
          format: double
          nullable: true
        notes:
          type: string
          nullable: true
        issued_at:
          type: string
          format: date-time
          nullable: true
        issued_by_user_id:
          type: string
          format: uuid
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancelled_by_user_id:
          type: string
          format: uuid
          nullable: true
        cancellation_reason:
          type: string
          nullable: true

