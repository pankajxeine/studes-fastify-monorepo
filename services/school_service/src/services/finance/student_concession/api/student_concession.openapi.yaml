openapi: 3.0.0
x-sql-table: fin_student_concession
info:
  title: StudentConcessionResponse API
  version: 1.0.0
paths:
  /student_concession:
    get:
      operationId: listStudentConcession
      summary: Get all student_concession
      responses:
        '200':
          description: List of student_concession
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentConcessionResponse'
    post:
      operationId: createStudentConcession
      summary: Create a new student_concession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentConcessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentConcessionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /student_concession/{id}:
    get:
      operationId: getStudentConcessionById
      summary: Get student_concession by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: student_concession object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentConcessionResponse'
        '404':
          description: student_concession not found
    put:
      operationId: updateStudentConcession
      summary: Update student_concession by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentConcessionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentConcessionResponse'
        '400':
          description: Invalid request
        '404':
          description: student_concession not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStudentConcession
      summary: Delete student_concession by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: student_concession not found
