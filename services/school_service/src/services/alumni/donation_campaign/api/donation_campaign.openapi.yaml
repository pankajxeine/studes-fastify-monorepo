openapi: 3.0.0
x-sql-table: alumni_donation_campaign
info:
  title: DonationCampaignResponse API
  version: 1.0.0
paths:
  /donation_campaign:
    get:
      operationId: listDonationCampaign
      summary: Get all donation_campaign
      responses:
        '200':
          description: List of donation_campaign
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonationCampaignResponse'
    post:
      operationId: createDonationCampaign
      summary: Create a new donation_campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCampaignRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCampaignResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /donation_campaign/{id}:
    get:
      operationId: getDonationCampaignById
      summary: Get donation_campaign by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: donation_campaign object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCampaignResponse'
        '404':
          description: donation_campaign not found
    put:
      operationId: updateDonationCampaign
      summary: Update donation_campaign by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCampaignUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCampaignResponse'
        '400':
          description: Invalid request
        '404':
          description: donation_campaign not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDonationCampaign
      summary: Delete donation_campaign by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: donation_campaign not found
components:
  schemas:

    DonationCampaignRequest:
      type: object
      required:
        - code
        - name
        - fund_purpose
        - goal_amount
        - starts_on
        - ends_on
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        fund_purpose:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        goal_amount:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "active"
            - "closed"
            - "cancelled"
        owner_staff_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: true

    DonationCampaignUpdateRequest:
      type: object
      required:
        - code
        - name
        - description
        - fund_purpose
        - campus_id
        - goal_amount
        - starts_on
        - ends_on
        - status
        - owner_staff_id
        - is_public
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        fund_purpose:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        goal_amount:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "active"
            - "closed"
            - "cancelled"
        owner_staff_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: true

    DonationCampaignResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - donation_campaign_id
        - code
        - name
        - fund_purpose
        - goal_amount
        - starts_on
        - ends_on
        - status
        - is_public
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        donation_campaign_id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        fund_purpose:
          type: string
        campus_id:
          type: string
          format: uuid
          nullable: true
        goal_amount:
          type: string
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "active"
            - "closed"
            - "cancelled"
        owner_staff_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
