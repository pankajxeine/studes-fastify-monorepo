openapi: 3.0.0
x-sql-table: alumni_alumni_employment
info:
  title: AlumniEmploymentResponse API
  version: 1.0.0
paths:
  /alumni_employment:
    get:
      operationId: listAlumniEmployment
      summary: Get all alumni_employment
      responses:
        '200':
          description: List of alumni_employment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlumniEmploymentResponse'
    post:
      operationId: createAlumniEmployment
      summary: Create a new alumni_employment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumniEmploymentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniEmploymentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /alumni_employment/{id}:
    get:
      operationId: getAlumniEmploymentById
      summary: Get alumni_employment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: alumni_employment object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniEmploymentResponse'
        '404':
          description: alumni_employment not found
    put:
      operationId: updateAlumniEmployment
      summary: Update alumni_employment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumniEmploymentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumniEmploymentResponse'
        '400':
          description: Invalid request
        '404':
          description: alumni_employment not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAlumniEmployment
      summary: Delete alumni_employment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: alumni_employment not found
