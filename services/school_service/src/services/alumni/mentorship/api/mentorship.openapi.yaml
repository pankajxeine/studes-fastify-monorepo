        meeting_frequency:
          type: string
          maxLength: 20
          default: "monthly"
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        started_on:
          type: string
          format: date
          nullable: true
        ended_on:
          type: string
          format: date
          nullable: true
        decline_reason:
          type: string
          nullable: true
        mentee_rating:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 5
        mentee_feedback:
          type: string
          nullable: true
        mentor_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
