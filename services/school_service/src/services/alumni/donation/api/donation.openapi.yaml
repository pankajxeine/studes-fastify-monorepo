openapi: 3.0.0
x-sql-table: alumni_donation
info:
  title: DonationResponse API
  version: 1.0.0
paths:
  /donation:
    get:
      operationId: listDonation
      summary: Get all donation
      responses:
        '200':
          description: List of donation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonationResponse'
    post:
      operationId: createDonation
      summary: Create a new donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /donation/{id}:
    get:
      operationId: getDonationById
      summary: Get donation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: donation object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '404':
          description: donation not found
    put:
      operationId: updateDonation
      summary: Update donation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationResponse'
        '400':
          description: Invalid request
        '404':
          description: donation not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDonation
      summary: Delete donation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: donation not found
components:
  schemas:

    DonationRequest:
      type: object
      required:
        - donation_no
        - donor_person_id
        - amount
      additionalProperties: false
      properties:
        donation_no:
          type: string
          maxLength: 30
        donation_campaign_id:
          type: string
          format: uuid
          nullable: true
        donor_person_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
        status:
          type: string
          default: "pledged"
          enum:
            - "pledged"
            - "received"
            - "refunded"
            - "cancelled"
        pledged_on:
          type: string
          format: date
        received_at:
          type: string
          format: date-time
          nullable: true
        is_anonymous:
          type: boolean
          default: false
        dedication:
          type: string
          nullable: true
        donor_message:
          type: string
          nullable: true
        receipt_no:
          type: string
          nullable: true
          maxLength: 30
        receipt_issued_at:
          type: string
          format: date-time
          nullable: true
        cancelled_reason:
          type: string
          nullable: true

    DonationUpdateRequest:
      type: object
      required:
        - donation_no
        - donation_campaign_id
        - donor_person_id
        - payment_id
        - amount
        - status
        - pledged_on
        - received_at
        - is_anonymous
        - dedication
        - donor_message
        - receipt_no
        - receipt_issued_at
        - cancelled_reason
      additionalProperties: false
      properties:
        donation_no:
          type: string
          maxLength: 30
        donation_campaign_id:
          type: string
          format: uuid
          nullable: true
        donor_person_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
        status:
          type: string
          default: "pledged"
          enum:
            - "pledged"
            - "received"
            - "refunded"
            - "cancelled"
        pledged_on:
          type: string
          format: date
        received_at:
          type: string
          format: date-time
          nullable: true
        is_anonymous:
          type: boolean
          default: false
        dedication:
          type: string
          nullable: true
        donor_message:
          type: string
          nullable: true
        receipt_no:
          type: string
          nullable: true
          maxLength: 30
        receipt_issued_at:
          type: string
          format: date-time
          nullable: true
        cancelled_reason:
          type: string
          nullable: true

    DonationResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - donation_id
        - donation_no
        - donor_person_id
        - amount
        - status
        - pledged_on
        - is_anonymous
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        donation_id:
          type: string
          format: uuid
          readOnly: true
        donation_no:
          type: string
          maxLength: 30
        donation_campaign_id:
          type: string
          format: uuid
          nullable: true
        donor_person_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
        status:
          type: string
          default: "pledged"
          enum:
            - "pledged"
            - "received"
            - "refunded"
            - "cancelled"
        pledged_on:
          type: string
          format: date
        received_at:
          type: string
          format: date-time
          nullable: true
        is_anonymous:
          type: boolean
          default: false
        dedication:
          type: string
          nullable: true
        donor_message:
          type: string
          nullable: true
        receipt_no:
          type: string
          nullable: true
          maxLength: 30
        receipt_issued_at:
          type: string
          format: date-time
          nullable: true
        cancelled_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
