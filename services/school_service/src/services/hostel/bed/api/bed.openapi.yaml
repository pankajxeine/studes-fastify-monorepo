openapi: 3.0.0
x-sql-table: hstl_bed
info:
  title: BedResponse API
  version: 1.0.0
paths:
  /bed:
    get:
      operationId: listBed
      summary: Get all bed
      responses:
        '200':
          description: List of bed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BedResponse'
    post:
      operationId: createBed
      summary: Create a new bed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /bed/{id}:
    get:
      operationId: getBedById
      summary: Get bed by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: bed object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedResponse'
        '404':
          description: bed not found
    put:
      operationId: updateBed
      summary: Update bed by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BedUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedResponse'
        '400':
          description: Invalid request
        '404':
          description: bed not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteBed
      summary: Delete bed by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: bed not found
components:
  schemas:

    BedRequest:
      type: object
      required:
        - hostel_room_id
        - bed_code
      additionalProperties: false
      properties:
        hostel_room_id:
          type: string
          format: uuid
        bed_code:
          type: string
          maxLength: 10
        status:
          type: string
          maxLength: 20
          default: "available"
        has_study_desk:
          type: boolean
          default: true
        has_locker:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    BedUpdateRequest:
      type: object
      required:
        - hostel_room_id
        - bed_code
        - status
        - has_study_desk
        - has_locker
        - notes
      additionalProperties: false
      properties:
        hostel_room_id:
          type: string
          format: uuid
        bed_code:
          type: string
          maxLength: 10
        status:
          type: string
          maxLength: 20
          default: "available"
        has_study_desk:
          type: boolean
          default: true
        has_locker:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    BedResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - bed_id
        - hostel_room_id
        - bed_code
        - status
        - has_study_desk
        - has_locker
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        bed_id:
          type: string
          format: uuid
          readOnly: true
        hostel_room_id:
          type: string
          format: uuid
        bed_code:
          type: string
          maxLength: 10
        status:
          type: string
          maxLength: 20
          default: "available"
        has_study_desk:
          type: boolean
          default: true
        has_locker:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
