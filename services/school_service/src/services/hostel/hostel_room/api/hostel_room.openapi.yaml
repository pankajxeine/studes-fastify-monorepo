          default: false
        has_air_conditioning:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    HostelRoomResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - hostel_room_id
        - hostel_id
        - room_no
        - floor_no
        - room_type
        - bed_count
        - has_attached_bath
