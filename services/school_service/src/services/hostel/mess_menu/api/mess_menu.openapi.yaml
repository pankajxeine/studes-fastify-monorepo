      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: mess_menu object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessMenuResponse'
        '404':
          description: mess_menu not found
    put:
      operationId: updateMessMenu
      summary: Update mess_menu by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessMenuUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessMenuResponse'
        '400':
          description: Invalid request
        '404':
          description: mess_menu not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMessMenu
      summary: Delete mess_menu by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: mess_menu not found
