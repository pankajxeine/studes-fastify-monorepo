openapi: 3.0.0
x-sql-table: org_setting
info:
  title: SettingResponse API
  version: 1.0.0
paths:
  /setting:
    get:
      operationId: listSetting
      summary: Get all setting
      responses:
        '200':
          description: List of setting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingResponse'
    post:
      operationId: createSetting
      summary: Create a new setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /setting/{id}:
    get:
      operationId: getSettingById
      summary: Get setting by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: setting object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '404':
          description: setting not found
    put:
      operationId: updateSetting
      summary: Update setting by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '400':
          description: Invalid request
        '404':
          description: setting not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteSetting
      summary: Delete setting by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: setting not found
components:
  schemas:

    SettingRequest:
      type: object
      required:
        - module
        - setting_key
        - value
        - value_type
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        module:
          type: string
          maxLength: 20
        setting_key:
          type: string
          maxLength: 80
        value:
        value_type:
          type: string
          maxLength: 10
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true

    SettingUpdateRequest:
      type: object
      required:
        - campus_id
        - module
        - setting_key
        - value
        - value_type
        - description
        - is_editable
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        module:
          type: string
          maxLength: 20
        setting_key:
          type: string
          maxLength: 80
        value:
        value_type:
          type: string
          maxLength: 10
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true

    SettingResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - setting_id
        - module
        - setting_key
        - value
        - value_type
        - is_editable
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        setting_id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
          nullable: true
        module:
          type: string
          maxLength: 20
        setting_key:
          type: string
          maxLength: 80
        value:
        value_type:
          type: string
          maxLength: 10
        description:
          type: string
          nullable: true
        is_editable:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
