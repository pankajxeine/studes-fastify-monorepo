          maxLength: 20
        country_code:
          type: string
          maxLength: 2
        currency_code:
          type: string
          maxLength: 3
        timezone:
          type: string
        locale:
          type: string
          maxLength: 10
          default: "en-US"
        academic_year_start_month:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          default: 8
        logo_file_id:
          type: string
