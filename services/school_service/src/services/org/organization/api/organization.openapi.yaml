openapi: 3.0.0
x-sql-table: org_organization
info:
  title: OrganizationResponse API
  version: 1.0.0
paths:
  /organization:
    get:
      operationId: listOrganization
      summary: Get all organization
      responses:
        '200':
          description: List of organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationResponse'
    post:
      operationId: createOrganization
      summary: Create a new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /organization/{id}:
    get:
      operationId: getOrganizationById
      summary: Get organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: organization object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '404':
          description: organization not found
    put:
      operationId: updateOrganization
      summary: Update organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          description: Invalid request
        '404':
          description: organization not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteOrganization
      summary: Delete organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: organization not found
components:
  schemas:

    OrganizationRequest:
      type: object
      required:
        - name
        - country_code
        - currency_code
        - timezone
      additionalProperties: false
      properties:
        is_singleton:
          type: boolean
          default: true
        name:
          type: string
        short_name:
          type: string
          nullable: true
          maxLength: 30
        legal_name:
          type: string
          nullable: true
        registration_no:
          type: string
          nullable: true
          maxLength: 60
        tax_id:
          type: string
          nullable: true
          maxLength: 40
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        address_line1:
          type: string
