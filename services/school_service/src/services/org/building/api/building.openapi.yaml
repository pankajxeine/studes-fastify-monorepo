openapi: 3.0.0
x-sql-table: org_building
info:
  title: BuildingResponse API
  version: 1.0.0
paths:
  /building:
    get:
      operationId: listBuilding
      summary: Get all building
      responses:
        '200':
          description: List of building
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuildingResponse'
    post:
      operationId: createBuilding
      summary: Create a new building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /building/{id}:
    get:
      operationId: getBuildingById
      summary: Get building by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: building object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
        '404':
          description: building not found
    put:
      operationId: updateBuilding
      summary: Update building by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingResponse'
        '400':
          description: Invalid request
        '404':
          description: building not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteBuilding
      summary: Delete building by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: building not found
components:
  schemas:

    BuildingRequest:
      type: object
      required:
        - campus_id
        - code
        - name
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        floors:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 1
        year_built:
          type: integer
          format: int32
          nullable: true
          minimum: 1500
          maximum: 2100
        has_lift:
          type: boolean
          default: false
        is_accessible:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    BuildingUpdateRequest:
      type: object
      required:
        - campus_id
        - code
        - name
        - floors
        - year_built
        - has_lift
        - is_accessible
        - is_active
        - notes
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        floors:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 1
        year_built:
          type: integer
          format: int32
          nullable: true
          minimum: 1500
          maximum: 2100
        has_lift:
          type: boolean
          default: false
        is_accessible:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    BuildingResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - building_id
        - campus_id
        - code
        - name
        - floors
        - has_lift
        - is_accessible
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        building_id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
        floors:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 1
        year_built:
          type: integer
          format: int32
          nullable: true
          minimum: 1500
          maximum: 2100
        has_lift:
          type: boolean
          default: false
        is_accessible:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
