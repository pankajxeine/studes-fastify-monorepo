          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_paid:
          type: boolean
          default: true
        is_balance_tracked:
          type: boolean
          default: true
        annual_quota_days:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 365
        carry_forward_max_days:
          type: number
          format: double
          default: 0
        max_consecutive_days:
          type: integer
          format: int32
          nullable: true
        allows_half_day:
          type: boolean
          default: true
        requires_document_after_days:
          type: integer
          format: int32
          nullable: true
        applicable_category:
          type: string
          nullable: true
        applicable_gender_code:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
