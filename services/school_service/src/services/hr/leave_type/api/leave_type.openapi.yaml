openapi: 3.0.0
x-sql-table: hr_leave_type
info:
  title: LeaveTypeResponse API
  version: 1.0.0
paths:
  /leave_type:
    get:
      operationId: listLeaveType
      summary: Get all leave_type
      responses:
        '200':
          description: List of leave_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveTypeResponse'
    post:
      operationId: createLeaveType
      summary: Create a new leave_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /leave_type/{id}:
    get:
      operationId: getLeaveTypeById
      summary: Get leave_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: leave_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveTypeResponse'
        '404':
          description: leave_type not found
    put:
      operationId: updateLeaveType
      summary: Update leave_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: leave_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLeaveType
      summary: Delete leave_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: leave_type not found
components:
