openapi: 3.0.0
x-sql-table: hr_staff_qualification
info:
  title: StaffQualificationResponse API
  version: 1.0.0
paths:
  /staff_qualification:
    get:
      operationId: listStaffQualification
      summary: Get all staff_qualification
      responses:
        '200':
          description: List of staff_qualification
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffQualificationResponse'
    post:
      operationId: createStaffQualification
      summary: Create a new staff_qualification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffQualificationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQualificationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /staff_qualification/{id}:
    get:
      operationId: getStaffQualificationById
      summary: Get staff_qualification by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: staff_qualification object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQualificationResponse'
        '404':
          description: staff_qualification not found
    put:
      operationId: updateStaffQualification
      summary: Update staff_qualification by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffQualificationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffQualificationResponse'
        '400':
          description: Invalid request
        '404':
          description: staff_qualification not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStaffQualification
      summary: Delete staff_qualification by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: staff_qualification not found
components:
  schemas:

    StaffQualificationRequest:
      type: object
      required:
        - staff_id
        - qualification_level
        - degree_name
        - institution
      additionalProperties: false
      properties:
        staff_id:
          type: string
          format: uuid
        qualification_level:
          type: string
          maxLength: 20
        degree_name:
          type: string
        specialization:
          type: string
          nullable: true
        institution:
          type: string
        year_completed:
          type: integer
          format: int32
          nullable: true
          minimum: 1950
          maximum: 2100
        grade_or_score:
          type: string
          nullable: true
          maxLength: 20
        is_highest:
          type: boolean
          default: false
        file_id:
          type: string
          format: uuid
          nullable: true
        verified_by_user_id:
          type: string
          format: uuid
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true

    StaffQualificationUpdateRequest:
      type: object
      required:
        - staff_id
        - qualification_level
        - degree_name
        - specialization
        - institution
        - year_completed
        - grade_or_score
        - is_highest
        - file_id
        - verified_by_user_id
        - verified_at
      additionalProperties: false
      properties:
        staff_id:
          type: string
          format: uuid
        qualification_level:
          type: string
          maxLength: 20
        degree_name:
          type: string
        specialization:
          type: string
          nullable: true
        institution:
          type: string
        year_completed:
