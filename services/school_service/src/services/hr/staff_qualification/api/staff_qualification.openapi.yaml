        grade_or_score:
          type: string
          nullable: true
          maxLength: 20
        is_highest:
          type: boolean
          default: false
        file_id:
          type: string
          format: uuid
          nullable: true
        verified_by_user_id:
          type: string
          format: uuid
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true

    StaffQualificationResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - staff_qualification_id
        - staff_id
        - qualification_level
        - degree_name
        - institution
        - is_highest
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
