openapi: 3.0.0
x-sql-table: hr_payroll_run
info:
  title: PayrollRunResponse API
  version: 1.0.0
paths:
  /payroll_run:
    get:
      operationId: listPayrollRun
      summary: Get all payroll_run
      responses:
        '200':
          description: List of payroll_run
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayrollRunResponse'
    post:
      operationId: createPayrollRun
      summary: Create a new payroll_run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollRunRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollRunResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /payroll_run/{id}:
    get:
      operationId: getPayrollRunById
      summary: Get payroll_run by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: payroll_run object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollRunResponse'
        '404':
          description: payroll_run not found
    put:
      operationId: updatePayrollRun
      summary: Update payroll_run by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollRunUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollRunResponse'
        '400':
          description: Invalid request
        '404':
          description: payroll_run not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePayrollRun
      summary: Delete payroll_run by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: payroll_run not found
