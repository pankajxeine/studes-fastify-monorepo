openapi: 3.0.0
x-sql-table: hr_designation
info:
  title: DesignationResponse API
  version: 1.0.0
paths:
  /designation:
    get:
      operationId: listDesignation
      summary: Get all designation
      responses:
        '200':
          description: List of designation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesignationResponse'
    post:
      operationId: createDesignation
      summary: Create a new designation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /designation/{id}:
    get:
      operationId: getDesignationById
      summary: Get designation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: designation object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationResponse'
        '404':
          description: designation not found
    put:
      operationId: updateDesignation
      summary: Update designation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationResponse'
        '400':
          description: Invalid request
        '404':
          description: designation not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDesignation
      summary: Delete designation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: designation not found
components:
  schemas:

    DesignationRequest:
      type: object
      required:
        - name
        - staff_category
      additionalProperties: false
      properties:
        designation_code:
          type: string
          nullable: true
        name:
          type: string
        staff_category:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    DesignationUpdateRequest:
      type: object
      required:
        - designation_code
        - name
        - staff_category
        - description
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        designation_code:
          type: string
          nullable: true
        name:
          type: string
        staff_category:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    DesignationResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - staff_category
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        designation_code:
          type: string
          nullable: true
        name:
          type: string
        staff_category:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
