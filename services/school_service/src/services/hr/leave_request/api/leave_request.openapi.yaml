openapi: 3.0.0
x-sql-table: hr_leave_request
info:
  title: LeaveRequestResponse API
  version: 1.0.0
paths:
  /leave_request:
    get:
      operationId: listLeaveRequest
      summary: Get all leave_request
      responses:
        '200':
          description: List of leave_request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequestResponse'
    post:
      operationId: createLeaveRequest
      summary: Create a new leave_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /leave_request/{id}:
    get:
      operationId: getLeaveRequestById
      summary: Get leave_request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: leave_request object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          description: leave_request not found
    put:
      operationId: updateLeaveRequest
      summary: Update leave_request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '400':
          description: Invalid request
        '404':
          description: leave_request not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteLeaveRequest
      summary: Delete leave_request by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: leave_request not found
