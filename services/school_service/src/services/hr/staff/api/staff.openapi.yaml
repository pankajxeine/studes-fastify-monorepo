        - confirmed_on
        - exit_on
        - exit_reason
        - reporting_to_staff_id
        - work_email
        - work_phone
        - max_weekly_periods
        - notice_period_days
        - tax_id
        - bank_account_name
        - bank_account_no
        - bank_routing_code
        - notes
