openapi: 3.0.0
x-sql-table: invnt_stock_transaction
info:
  title: StockTransactionResponse API
  version: 1.0.0
paths:
  /stock_transaction:
    get:
      operationId: listStockTransaction
      summary: Get all stock_transaction
      responses:
        '200':
          description: List of stock_transaction
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockTransactionResponse'
    post:
      operationId: createStockTransaction
      summary: Create a new stock_transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransactionResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /stock_transaction/{id}:
    get:
      operationId: getStockTransactionById
      summary: Get stock_transaction by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: stock_transaction object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransactionResponse'
        '404':
          description: stock_transaction not found
    put:
      operationId: updateStockTransaction
      summary: Update stock_transaction by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransactionResponse'
        '400':
          description: Invalid request
        '404':
          description: stock_transaction not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStockTransaction
      summary: Delete stock_transaction by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: stock_transaction not found
components:
  schemas:

    StockTransactionRequest:
      type: object
      required:
        - txn_no
        - item_id
        - campus_id
        - room_id
        - txn_type
        - quantity
      additionalProperties: false
      properties:
        txn_no:
          type: string
          maxLength: 20
        item_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        to_room_id:
          type: string
          format: uuid
          nullable: true
        txn_type:
          type: string
        quantity:
          type: number
          format: double
        quantity_delta:
          type: number
          format: double
          nullable: true
        unit_cost_amount:
          type: string
          default: 0
        total_cost_amount:
          type: number
          format: double
          nullable: true
        balance_after:
          type: number
          format: double
          default: 0
        purchase_order_line_id:
          type: string
          format: uuid
          nullable: true
        issued_to_person_id:
          type: string
          format: uuid
          nullable: true
        reference_no:
          type: string
          nullable: true
          maxLength: 40
        reason:
          type: string
          nullable: true
        txn_at:
          type: string
          format: date-time
        performed_by_user_id:
          type: string
          format: uuid
          nullable: true

