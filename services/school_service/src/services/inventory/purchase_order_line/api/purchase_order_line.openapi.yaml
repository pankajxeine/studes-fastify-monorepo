openapi: 3.0.0
x-sql-table: invnt_purchase_order_line
info:
  title: PurchaseOrderLineResponse API
  version: 1.0.0
paths:
  /purchase_order_line:
    get:
      operationId: listPurchaseOrderLine
      summary: Get all purchase_order_line
      responses:
        '200':
          description: List of purchase_order_line
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrderLineResponse'
    post:
      operationId: createPurchaseOrderLine
      summary: Create a new purchase_order_line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderLineRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderLineResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /purchase_order_line/{id}:
    get:
      operationId: getPurchaseOrderLineById
      summary: Get purchase_order_line by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: purchase_order_line object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderLineResponse'
        '404':
          description: purchase_order_line not found
    put:
      operationId: updatePurchaseOrderLine
      summary: Update purchase_order_line by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderLineUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderLineResponse'
        '400':
          description: Invalid request
        '404':
          description: purchase_order_line not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePurchaseOrderLine
      summary: Delete purchase_order_line by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: purchase_order_line not found
