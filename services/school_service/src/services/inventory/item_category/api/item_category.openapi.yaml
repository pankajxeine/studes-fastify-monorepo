openapi: 3.0.0
x-sql-table: invnt_item_category
info:
  title: ItemCategoryResponse API
  version: 1.0.0
paths:
  /item_category:
    get:
      operationId: listItemCategory
      summary: Get all item_category
      responses:
        '200':
          description: List of item_category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemCategoryResponse'
    post:
      operationId: createItemCategory
      summary: Create a new item_category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCategoryResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /item_category/{id}:
    get:
      operationId: getItemCategoryById
      summary: Get item_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: item_category object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCategoryResponse'
        '404':
          description: item_category not found
    put:
      operationId: updateItemCategory
      summary: Update item_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCategoryUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCategoryResponse'
        '400':
          description: Invalid request
        '404':
          description: item_category not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteItemCategory
      summary: Delete item_category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: item_category not found
components:
  schemas:

    ItemCategoryRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        item_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_consumable:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    ItemCategoryUpdateRequest:
      type: object
      required:
        - item_category_code
        - name
        - description
        - is_consumable
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        item_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_consumable:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    ItemCategoryResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - is_consumable
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        item_category_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_consumable:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
