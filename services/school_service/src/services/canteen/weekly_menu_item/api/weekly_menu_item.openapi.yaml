          type: string
          format: uuid
        canteen_outlet_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        meal_period_code:
          type: string
        day_of_week:
          type: string
        planned_qty:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 5000
        sort_order:
          type: integer
          format: int32
          default: 0

    WeeklyMenuItemResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - weekly_menu_item_id
        - weekly_menu_id
        - canteen_outlet_id
        - menu_item_id
        - meal_period_code
        - day_of_week
        - sort_order
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        weekly_menu_item_id:
          type: string
          format: uuid
          readOnly: true
        weekly_menu_id:
          type: string
          format: uuid
        canteen_outlet_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        meal_period_code:
          type: string
        day_of_week:
          type: string
        planned_qty:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 5000
        sort_order:
          type: integer
          format: int32
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
