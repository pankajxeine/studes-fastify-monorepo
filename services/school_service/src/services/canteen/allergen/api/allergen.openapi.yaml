openapi: 3.0.0
x-sql-table: cntn_allergen
info:
  title: AllergenResponse API
  version: 1.0.0
paths:
  /allergen:
    get:
      operationId: listAllergen
      summary: Get all allergen
      responses:
        '200':
          description: List of allergen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AllergenResponse'
    post:
      operationId: createAllergen
      summary: Create a new allergen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /allergen/{id}:
    get:
      operationId: getAllergenById
      summary: Get allergen by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: allergen object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenResponse'
        '404':
          description: allergen not found
    put:
      operationId: updateAllergen
      summary: Update allergen by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergenUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergenResponse'
        '400':
          description: Invalid request
        '404':
          description: allergen not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteAllergen
      summary: Delete allergen by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: allergen not found
components:
  schemas:

    AllergenRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        allergen_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_major:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    AllergenUpdateRequest:
      type: object
      required:
        - allergen_code
        - name
        - description
        - is_major
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        allergen_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_major:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    AllergenResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - is_major
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        allergen_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        is_major:
          type: boolean
          default: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
