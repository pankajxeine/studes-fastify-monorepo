openapi: 3.0.0
x-sql-table: cntn_canteen_order
info:
  title: CanteenOrderResponse API
  version: 1.0.0
paths:
  /canteen_order:
    get:
      operationId: listCanteenOrder
      summary: Get all canteen_order
      responses:
        '200':
          description: List of canteen_order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanteenOrderResponse'
    post:
      operationId: createCanteenOrder
      summary: Create a new canteen_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanteenOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanteenOrderResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /canteen_order/{id}:
    get:
      operationId: getCanteenOrderById
      summary: Get canteen_order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: canteen_order object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanteenOrderResponse'
        '404':
          description: canteen_order not found
    put:
      operationId: updateCanteenOrder
      summary: Update canteen_order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanteenOrderUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanteenOrderResponse'
        '400':
          description: Invalid request
        '404':
          description: canteen_order not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteCanteenOrder
      summary: Delete canteen_order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: canteen_order not found
components:
  schemas:

    CanteenOrderRequest:
      type: object
      required:
        - order_no
        - canteen_outlet_id
        - person_id
        - payment_mode
      additionalProperties: false
      properties:
        order_no:
          type: string
          maxLength: 30
        canteen_outlet_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        daily_menu_id:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          default: "pos"
          enum:
            - "pos"
            - "pre_order"
            - "kiosk"
        payment_mode:
          type: string
          enum:
            - "wallet"
            - "meal_plan"
            - "cash"
            - "card"
            - "complimentary"
        wallet_id:
          type: string
          format: uuid
          nullable: true
        meal_subscription_id:
          type: string
          format: uuid
          nullable: true
        payment_reference:
          type: string
          nullable: true
          maxLength: 60
        status:
          type: string
          default: "placed"
          enum:
            - "placed"
            - "preparing"
            - "ready"
            - "served"
            - "cancelled"
        pickup_date:
          type: string
          format: date
        total_amount:
          type: string
          default: 0
        ordered_at:
          type: string
          format: date-time
        preparing_at:
          type: string
          format: date-time
          nullable: true
        ready_at:
          type: string
          format: date-time
          nullable: true
        served_at:
          type: string
