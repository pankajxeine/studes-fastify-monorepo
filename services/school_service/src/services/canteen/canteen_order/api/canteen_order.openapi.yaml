          nullable: true
        served_by_staff_id:
          type: string
          format: uuid
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        placed_by_user_id:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true

