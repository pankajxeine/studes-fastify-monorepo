                  $ref: '#/components/schemas/MealPlanPeriodResponse'
    post:
      operationId: createMealPlanPeriod
      summary: Create a new meal_plan_period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanPeriodRequest'
      responses:
