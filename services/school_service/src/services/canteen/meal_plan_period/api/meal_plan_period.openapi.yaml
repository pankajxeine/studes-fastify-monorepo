          type: string
          format: uuid
        meal_period_code:
          type: string

    MealPlanPeriodResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - meal_plan_id
        - meal_period_code
        - created_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        meal_plan_id:
          type: string
          format: uuid
        meal_period_code:
          type: string
        created_at:
          type: string
