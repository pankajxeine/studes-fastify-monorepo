          description: meal_plan_period not found
    put:
      operationId: updateMealPlanPeriod
      summary: Update meal_plan_period by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanPeriodUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanPeriodResponse'
        '400':
          description: Invalid request
        '404':
          description: meal_plan_period not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMealPlanPeriod
      summary: Delete meal_plan_period by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: meal_plan_period not found
components:
