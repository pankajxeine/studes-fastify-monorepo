openapi: 3.0.0
x-sql-table: cntn_daily_menu_item
info:
  title: DailyMenuItemResponse API
  version: 1.0.0
paths:
  /daily_menu_item:
    get:
      operationId: listDailyMenuItem
      summary: Get all daily_menu_item
      responses:
        '200':
          description: List of daily_menu_item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyMenuItemResponse'
    post:
      operationId: createDailyMenuItem
      summary: Create a new daily_menu_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMenuItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuItemResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /daily_menu_item/{id}:
    get:
      operationId: getDailyMenuItemById
      summary: Get daily_menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: daily_menu_item object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuItemResponse'
        '404':
          description: daily_menu_item not found
    put:
      operationId: updateDailyMenuItem
      summary: Update daily_menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMenuItemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMenuItemResponse'
        '400':
          description: Invalid request
        '404':
          description: daily_menu_item not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDailyMenuItem
      summary: Delete daily_menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: daily_menu_item not found
components:
  schemas:

    DailyMenuItemRequest:
      type: object
      required:
        - daily_menu_id
        - canteen_outlet_id
        - menu_item_id
        - price_amount
      additionalProperties: false
      properties:
        daily_menu_id:
          type: string
          format: uuid
        canteen_outlet_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        price_amount:
          type: string
        planned_qty:
          type: integer
          format: int32
          nullable: true
        sold_qty:
          type: integer
          format: int32
          default: 0
        is_sold_out:
          type: boolean
          default: false
        sort_order:
          type: integer
          format: int32
          default: 0

    DailyMenuItemUpdateRequest:
      type: object
      required:
        - daily_menu_id
        - canteen_outlet_id
        - menu_item_id
        - price_amount
        - planned_qty
        - sold_qty
        - is_sold_out
        - sort_order
      additionalProperties: false
      properties:
        daily_menu_id:
          type: string
          format: uuid
        canteen_outlet_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        price_amount:
          type: string
        planned_qty:
          type: integer
          format: int32
          nullable: true
        sold_qty:
          type: integer
          format: int32
          default: 0
        is_sold_out:
          type: boolean
          default: false
        sort_order:
          type: integer
          format: int32
          default: 0

    DailyMenuItemResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - daily_menu_item_id
        - daily_menu_id
        - canteen_outlet_id
        - menu_item_id
        - price_amount
        - sold_qty
        - is_sold_out
        - sort_order
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        daily_menu_item_id:
          type: string
          format: uuid
          readOnly: true
        daily_menu_id:
          type: string
          format: uuid
        canteen_outlet_id:
          type: string
          format: uuid
        menu_item_id:
          type: string
          format: uuid
        price_amount:
          type: string
        planned_qty:
          type: integer
          format: int32
          nullable: true
        sold_qty:
          type: integer
          format: int32
          default: 0
        is_sold_out:
          type: boolean
          default: false
        sort_order:
          type: integer
          format: int32
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
