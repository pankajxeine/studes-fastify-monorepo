openapi: 3.0.0
x-sql-table: cntn_meal_period
info:
  title: MealPeriodResponse API
  version: 1.0.0
paths:
  /meal_period:
    get:
      operationId: listMealPeriod
      summary: Get all meal_period
      responses:
        '200':
          description: List of meal_period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPeriodResponse'
    post:
      operationId: createMealPeriod
      summary: Create a new meal_period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPeriodRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPeriodResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /meal_period/{id}:
    get:
      operationId: getMealPeriodById
      summary: Get meal_period by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: meal_period object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPeriodResponse'
        '404':
          description: meal_period not found
    put:
      operationId: updateMealPeriod
      summary: Update meal_period by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPeriodUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPeriodResponse'
        '400':
          description: Invalid request
        '404':
          description: meal_period not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMealPeriod
      summary: Delete meal_period by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: meal_period not found
components:
  schemas:

    MealPeriodRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        meal_period_code:
          type: string
          nullable: true
        name:
          type: string
        default_start_time:
          type: string
          format: time
          nullable: true
        default_end_time:
          type: string
          format: time
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    MealPeriodUpdateRequest:
      type: object
      required:
        - meal_period_code
        - name
        - default_start_time
        - default_end_time
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        meal_period_code:
          type: string
          nullable: true
        name:
          type: string
        default_start_time:
          type: string
          format: time
          nullable: true
        default_end_time:
          type: string
          format: time
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    MealPeriodResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        meal_period_code:
          type: string
          nullable: true
        name:
          type: string
        default_start_time:
          type: string
          format: time
          nullable: true
        default_end_time:
          type: string
          format: time
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
