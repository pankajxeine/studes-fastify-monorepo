openapi: 3.0.0
x-sql-table: cntn_meal_plan
info:
  title: MealPlanResponse API
  version: 1.0.0
paths:
  /meal_plan:
    get:
      operationId: listMealPlan
      summary: Get all meal_plan
      responses:
        '200':
          description: List of meal_plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealPlanResponse'
    post:
      operationId: createMealPlan
      summary: Create a new meal_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /meal_plan/{id}:
    get:
      operationId: getMealPlanById
      summary: Get meal_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: meal_plan object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanResponse'
        '404':
          description: meal_plan not found
    put:
      operationId: updateMealPlan
      summary: Update meal_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPlanUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealPlanResponse'
        '400':
          description: Invalid request
        '404':
          description: meal_plan not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMealPlan
      summary: Delete meal_plan by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: meal_plan not found
components:
  schemas:

    MealPlanRequest:
      type: object
      required:
        - canteen_outlet_id
        - term_id
        - code
        - name
        - price_amount
        - valid_from
        - valid_to
      additionalProperties: false
      properties:
        canteen_outlet_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
        fee_head_code:
          type: string
          default: "meal_plan"
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        price_amount:
          type: string
        meals_per_day:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          default: 1
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        is_active:
          type: boolean
          default: true

    MealPlanUpdateRequest:
      type: object
      required:
        - canteen_outlet_id
        - term_id
        - fee_head_code
        - code
        - name
        - description
        - price_amount
        - meals_per_day
        - valid_from
        - valid_to
        - is_active
      additionalProperties: false
      properties:
        canteen_outlet_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
        fee_head_code:
          type: string
          default: "meal_plan"
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        price_amount:
          type: string
        meals_per_day:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          default: 1
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        is_active:
          type: boolean
          default: true

    MealPlanResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - meal_plan_id
        - canteen_outlet_id
        - term_id
        - fee_head_code
        - code
        - name
        - price_amount
        - meals_per_day
        - valid_from
        - valid_to
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        meal_plan_id:
          type: string
          format: uuid
          readOnly: true
        canteen_outlet_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
        fee_head_code:
          type: string
          default: "meal_plan"
        code:
          type: string
          maxLength: 30
        name:
          type: string
        description:
          type: string
          nullable: true
        price_amount:
          type: string
        meals_per_day:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          default: 1
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
