openapi: 3.0.0
x-sql-table: cntn_menu_item
info:
  title: MenuItemResponse API
  version: 1.0.0
paths:
  /menu_item:
    get:
      operationId: listMenuItem
      summary: Get all menu_item
      responses:
        '200':
          description: List of menu_item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemResponse'
    post:
      operationId: createMenuItem
      summary: Create a new menu_item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /menu_item/{id}:
    get:
      operationId: getMenuItemById
      summary: Get menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: menu_item object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '404':
          description: menu_item not found
    put:
      operationId: updateMenuItem
      summary: Update menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400':
          description: Invalid request
        '404':
          description: menu_item not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteMenuItem
      summary: Delete menu_item by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: menu_item not found
components:
  schemas:

    MenuItemRequest:
      type: object
      required:
        - canteen_outlet_id
        - menu_category_code
        - code
        - name
        - price_amount
      additionalProperties: false
      properties:
        canteen_outlet_id:
          type: string
          format: uuid
        menu_category_code:
          type: string
        code:
          type: string
          maxLength: 20
        name:
          type: string
        description:
          type: string
          nullable: true
        ingredients:
          type: string
          nullable: true
        portion_size:
          type: string
          nullable: true
          maxLength: 40
        price_amount:
          type: string
        calories_kcal:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 3000
        spice_level:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          default: 0
        is_vegetarian:
          type: boolean
          default: false
        is_vegan:
          type: boolean
          default: false
        is_halal:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true

    MenuItemUpdateRequest:
      type: object
      required:
        - canteen_outlet_id
        - menu_category_code
        - code
        - name
        - description
        - ingredients
        - portion_size
        - price_amount
        - calories_kcal
        - spice_level
        - is_vegetarian
        - is_vegan
        - is_halal
        - is_active
      additionalProperties: false
      properties:
        canteen_outlet_id:
          type: string
          format: uuid
        menu_category_code:
          type: string
        code:
          type: string
          maxLength: 20
        name:
          type: string
        description:
          type: string
          nullable: true
        ingredients:
          type: string
          nullable: true
        portion_size:
          type: string
          nullable: true
          maxLength: 40
        price_amount:
          type: string
        calories_kcal:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 3000
        spice_level:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          default: 0
        is_vegetarian:
          type: boolean
          default: false
        is_vegan:
          type: boolean
          default: false
        is_halal:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true

    MenuItemResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - menu_item_id
        - canteen_outlet_id
        - menu_category_code
        - code
        - name
        - price_amount
        - spice_level
        - is_vegetarian
        - is_vegan
        - is_halal
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
