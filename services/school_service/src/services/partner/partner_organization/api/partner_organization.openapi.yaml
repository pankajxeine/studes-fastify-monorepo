openapi: 3.0.0
x-sql-table: prtn_partner_organization
info:
  title: PartnerOrganizationResponse API
  version: 1.0.0
paths:
  /partner_organization:
    get:
      operationId: listPartnerOrganization
      summary: Get all partner_organization
      responses:
        '200':
          description: List of partner_organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerOrganizationResponse'
    post:
      operationId: createPartnerOrganization
      summary: Create a new partner_organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrganizationResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /partner_organization/{id}:
    get:
      operationId: getPartnerOrganizationById
      summary: Get partner_organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: partner_organization object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrganizationResponse'
        '404':
          description: partner_organization not found
    put:
      operationId: updatePartnerOrganization
      summary: Update partner_organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerOrganizationUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrganizationResponse'
        '400':
          description: Invalid request
        '404':
          description: partner_organization not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePartnerOrganization
      summary: Delete partner_organization by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: partner_organization not found
