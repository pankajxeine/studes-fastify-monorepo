openapi: 3.0.0
x-sql-table: prtn_partner_type
info:
  title: PartnerTypeResponse API
  version: 1.0.0
paths:
  /partner_type:
    get:
      operationId: listPartnerType
      summary: Get all partner_type
      responses:
        '200':
          description: List of partner_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerTypeResponse'
    post:
      operationId: createPartnerType
      summary: Create a new partner_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /partner_type/{id}:
    get:
      operationId: getPartnerTypeById
      summary: Get partner_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: partner_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTypeResponse'
        '404':
          description: partner_type not found
    put:
      operationId: updatePartnerType
      summary: Update partner_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: partner_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePartnerType
      summary: Delete partner_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: partner_type not found
components:
  schemas:

    PartnerTypeRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        partner_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    PartnerTypeUpdateRequest:
      type: object
      required:
        - partner_type_code
        - name
        - description
        - sort_order
        - is_active
      additionalProperties: false
      properties:
        partner_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

    PartnerTypeResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - name
        - sort_order
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        partner_type_code:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
