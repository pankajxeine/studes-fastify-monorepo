openapi: 3.0.0
x-sql-table: prtn_job_offer
info:
  title: JobOfferResponse API
  version: 1.0.0
paths:
  /job_offer:
    get:
      operationId: listJobOffer
      summary: Get all job_offer
      responses:
        '200':
          description: List of job_offer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobOfferResponse'
    post:
      operationId: createJobOffer
      summary: Create a new job_offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /job_offer/{id}:
    get:
      operationId: getJobOfferById
      summary: Get job_offer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: job_offer object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferResponse'
        '404':
          description: job_offer not found
    put:
      operationId: updateJobOffer
      summary: Update job_offer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOfferUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferResponse'
        '400':
          description: Invalid request
        '404':
          description: job_offer not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteJobOffer
      summary: Delete job_offer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: job_offer not found
components:
  schemas:

    JobOfferRequest:
      type: object
      required:
        - placement_application_id
        - student_id
        - academic_year_id
        - offer_type
        - role_title
      additionalProperties: false
      properties:
        placement_application_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        offer_type:
          type: string
          maxLength: 12
        role_title:
          type: string
        ctc_amount:
          type: string
          nullable: true
        stipend_amount:
          type: string
          nullable: true
        joining_on:
          type: string
          format: date
          nullable: true
        end_on:
          type: string
          format: date
          nullable: true
        work_location:
          type: string
          nullable: true
        offer_letter_file_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "extended"
            - "accepted"
            - "declined"
            - "revoked"
            - "expired"
        offered_at:
          type: string
          format: date-time
          nullable: true
        respond_by_on:
          type: string
          format: date
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
        decline_reason:
          type: string
          nullable: true
        revoked_reason:
          type: string
          nullable: true

