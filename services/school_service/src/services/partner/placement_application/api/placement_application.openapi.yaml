            - "withdrawn"
        applied_at:
          type: string
          format: date-time
        cgpa_at_application:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 4
        cover_note:
          type: string
          nullable: true
        shortlisted_at:
