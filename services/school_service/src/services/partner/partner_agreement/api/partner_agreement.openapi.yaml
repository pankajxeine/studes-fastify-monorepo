    PartnerAgreementRequest:
      type: object
      required:
        - partner_organization_id
        - agreement_type
        - reference_no
        - title
        - valid_from
      additionalProperties: false
      properties:
        partner_organization_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
          nullable: true
        agreement_type:
          type: string
          maxLength: 20
        reference_no:
          type: string
          maxLength: 40
        title:
          type: string
        status:
          type: string
          default: "draft"
          enum:
            - "draft"
            - "under_review"
            - "active"
            - "expired"
            - "terminated"
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
          nullable: true
        validity:
          type: string
          nullable: true
        is_auto_renew:
          type: boolean
          default: false
        renewal_notice_days:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 365
        signed_on:
          type: string
          format: date
          nullable: true
        signed_by_user_id:
          type: string
