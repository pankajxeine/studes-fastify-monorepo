openapi: 3.0.0
x-sql-table: prtn_partner_agreement
info:
  title: PartnerAgreementResponse API
  version: 1.0.0
paths:
  /partner_agreement:
    get:
      operationId: listPartnerAgreement
      summary: Get all partner_agreement
      responses:
        '200':
          description: List of partner_agreement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerAgreementResponse'
    post:
      operationId: createPartnerAgreement
      summary: Create a new partner_agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAgreementRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreementResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /partner_agreement/{id}:
    get:
      operationId: getPartnerAgreementById
      summary: Get partner_agreement by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: partner_agreement object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreementResponse'
        '404':
          description: partner_agreement not found
    put:
      operationId: updatePartnerAgreement
      summary: Update partner_agreement by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerAgreementUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerAgreementResponse'
        '400':
          description: Invalid request
        '404':
          description: partner_agreement not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePartnerAgreement
      summary: Delete partner_agreement by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: partner_agreement not found
components:
