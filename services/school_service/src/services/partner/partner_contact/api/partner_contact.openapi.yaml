openapi: 3.0.0
x-sql-table: prtn_partner_contact
info:
  title: PartnerContactResponse API
  version: 1.0.0
paths:
  /partner_contact:
    get:
      operationId: listPartnerContact
      summary: Get all partner_contact
      responses:
        '200':
          description: List of partner_contact
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerContactResponse'
    post:
      operationId: createPartnerContact
      summary: Create a new partner_contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerContactRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerContactResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /partner_contact/{id}:
    get:
      operationId: getPartnerContactById
      summary: Get partner_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: partner_contact object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerContactResponse'
        '404':
          description: partner_contact not found
    put:
      operationId: updatePartnerContact
      summary: Update partner_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerContactUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerContactResponse'
        '400':
          description: Invalid request
        '404':
          description: partner_contact not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePartnerContact
      summary: Delete partner_contact by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: partner_contact not found
components:
