          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        job_title:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        is_primary:
          type: boolean
          default: false
        can_post_drives:
          type: boolean
          default: false
        start_on:
          type: string
          format: date
        end_on:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true

    PartnerContactUpdateRequest:
