openapi: 3.0.0
x-sql-table: docs_person_document
info:
  title: PersonDocumentResponse API
  version: 1.0.0
paths:
  /person_document:
    get:
      operationId: listPersonDocument
      summary: Get all person_document
      responses:
        '200':
          description: List of person_document
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonDocumentResponse'
    post:
      operationId: createPersonDocument
      summary: Create a new person_document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDocumentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDocumentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /person_document/{id}:
    get:
      operationId: getPersonDocumentById
      summary: Get person_document by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: person_document object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDocumentResponse'
        '404':
          description: person_document not found
    put:
      operationId: updatePersonDocument
      summary: Update person_document by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDocumentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDocumentResponse'
        '400':
          description: Invalid request
        '404':
          description: person_document not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deletePersonDocument
      summary: Delete person_document by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: person_document not found
components:
