          type: string
          format: uuid
        document_type_code:
          type: string
        file_id:
          type: string
          format: uuid
        document_no:
          type: string
          nullable: true
          maxLength: 60
        issuing_authority:
          type: string
          nullable: true
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        verification_status:
          type: string
          default: "pending"
          enum:
            - "pending"
            - "verified"
            - "rejected"
            - "expired"
        submitted_at:
          type: string
          format: date-time
        verified_by_user_id:
          type: string
          format: uuid
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

