openapi: 3.0.0
x-sql-table: docs_issued_certificate
info:
  title: IssuedCertificateResponse API
  version: 1.0.0
paths:
  /issued_certificate:
    get:
      operationId: listIssuedCertificate
      summary: Get all issued_certificate
      responses:
        '200':
          description: List of issued_certificate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuedCertificateResponse'
    post:
      operationId: createIssuedCertificate
      summary: Create a new issued_certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuedCertificateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCertificateResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /issued_certificate/{id}:
    get:
      operationId: getIssuedCertificateById
      summary: Get issued_certificate by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: issued_certificate object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCertificateResponse'
        '404':
          description: issued_certificate not found
    put:
      operationId: updateIssuedCertificate
      summary: Update issued_certificate by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuedCertificateUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCertificateResponse'
        '400':
          description: Invalid request
        '404':
          description: issued_certificate not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteIssuedCertificate
      summary: Delete issued_certificate by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: issued_certificate not found
components:
  schemas:

    IssuedCertificateRequest:
      type: object
      required:
        - certificate_template_id
        - person_id
        - purpose
      additionalProperties: false
      properties:
        certificate_template_id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        status:
          type: string
          default: "requested"
          enum:
            - "requested"
            - "approved"
            - "issued"
            - "rejected"
            - "revoked"
        purpose:
          type: string
        requested_by_user_id:
          type: string
          format: uuid
          nullable: true
        requested_at:
          type: string
          format: date-time
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        certificate_no:
          type: string
          nullable: true
          maxLength: 30
        verification_code:
          type: string
          nullable: true
          maxLength: 16
        issued_by_user_id:
          type: string
          format: uuid
          nullable: true
        issued_on:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true
        file_id:
          type: string
          format: uuid
          nullable: true
        merge_data:
          default: "{}"
        rejection_reason:
          type: string
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revocation_reason:
          type: string
          nullable: true

