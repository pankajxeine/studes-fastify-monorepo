openapi: 3.0.0
x-sql-table: docs_certificate_template
info:
  title: CertificateTemplateResponse API
  version: 1.0.0
paths:
  /certificate_template:
    get:
      operationId: listCertificateTemplate
      summary: Get all certificate_template
      responses:
        '200':
          description: List of certificate_template
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateTemplateResponse'
    post:
      operationId: createCertificateTemplate
      summary: Create a new certificate_template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateTemplateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateTemplateResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /certificate_template/{id}:
    get:
      operationId: getCertificateTemplateById
      summary: Get certificate_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: certificate_template object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateTemplateResponse'
        '404':
          description: certificate_template not found
    put:
      operationId: updateCertificateTemplate
      summary: Update certificate_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateTemplateUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateTemplateResponse'
        '400':
          description: Invalid request
        '404':
          description: certificate_template not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteCertificateTemplate
      summary: Delete certificate_template by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: certificate_template not found
components:
  schemas:

    CertificateTemplateRequest:
      type: object
      required:
        - code
        - name
        - certificate_type
        - body_template
        - number_prefix
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
        certificate_type:
          type: string
        body_template:
          type: string
        template_file_id:
          type: string
          format: uuid
          nullable: true
        number_prefix:
          type: string
          maxLength: 10
        validity_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 3650
        requires_approval:
          type: boolean
          default: true
        signatory_title:
          type: string
          default: "Principal"
        is_active:
          type: boolean
          default: true

    CertificateTemplateUpdateRequest:
      type: object
      required:
        - campus_id
        - code
        - name
        - certificate_type
        - body_template
        - template_file_id
        - number_prefix
        - validity_days
        - requires_approval
        - signatory_title
        - is_active
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
        certificate_type:
          type: string
        body_template:
          type: string
        template_file_id:
          type: string
          format: uuid
          nullable: true
        number_prefix:
          type: string
          maxLength: 10
        validity_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 3650
        requires_approval:
          type: boolean
          default: true
        signatory_title:
          type: string
          default: "Principal"
        is_active:
          type: boolean
          default: true

    CertificateTemplateResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - certificate_template_id
        - code
        - name
        - certificate_type
        - body_template
        - number_prefix
        - requires_approval
        - signatory_title
        - is_active
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        certificate_template_id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
        certificate_type:
          type: string
        body_template:
          type: string
        template_file_id:
          type: string
          format: uuid
          nullable: true
        number_prefix:
          type: string
          maxLength: 10
        validity_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 3650
        requires_approval:
          type: boolean
          default: true
        signatory_title:
          type: string
          default: "Principal"
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
