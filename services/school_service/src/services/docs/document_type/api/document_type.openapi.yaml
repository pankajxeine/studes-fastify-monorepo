          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        applies_to:
          type: string
          maxLength: 10
          default: "any"
        is_identity:
          type: boolean
          default: false
        requires_verification:
          type: boolean
          default: true
        has_expiry:
          type: boolean
          default: false
        max_size_mb:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
        allowed_mime_types:
          type: string
        sort_order:
          type: integer
          format: int32
          default: 0
        is_active:
          type: boolean
          default: true

