openapi: 3.0.0
x-sql-table: docs_document_type
info:
  title: DocumentTypeResponse API
  version: 1.0.0
paths:
  /document_type:
    get:
      operationId: listDocumentType
      summary: Get all document_type
      responses:
        '200':
          description: List of document_type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentTypeResponse'
    post:
      operationId: createDocumentType
      summary: Create a new document_type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /document_type/{id}:
    get:
      operationId: getDocumentTypeById
      summary: Get document_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: document_type object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '404':
          description: document_type not found
    put:
      operationId: updateDocumentType
      summary: Update document_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTypeUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTypeResponse'
        '400':
          description: Invalid request
        '404':
          description: document_type not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteDocumentType
      summary: Delete document_type by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: document_type not found
components:
