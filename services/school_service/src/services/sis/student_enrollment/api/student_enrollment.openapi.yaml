openapi: 3.0.0
x-sql-table: sis_student_enrollment
info:
  title: StudentEnrollmentResponse API
  version: 1.0.0
paths:
  /student_enrollment:
    get:
      operationId: listStudentEnrollment
      summary: Get all student_enrollment
      responses:
        '200':
          description: List of student_enrollment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentEnrollmentResponse'
    post:
      operationId: createStudentEnrollment
      summary: Create a new student_enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentEnrollmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /student_enrollment/{id}:
    get:
      operationId: getStudentEnrollmentById
      summary: Get student_enrollment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: student_enrollment object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentResponse'
        '404':
          description: student_enrollment not found
    put:
      operationId: updateStudentEnrollment
      summary: Update student_enrollment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentEnrollmentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEnrollmentResponse'
        '400':
          description: Invalid request
        '404':
          description: student_enrollment not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStudentEnrollment
      summary: Delete student_enrollment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: student_enrollment not found
components:
