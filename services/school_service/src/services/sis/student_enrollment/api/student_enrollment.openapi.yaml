    StudentEnrollmentRequest:
      type: object
      required:
        - student_id
        - academic_year_id
        - campus_id
        - program_id
        - grade_level_id
        - enrolled_on
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
          nullable: true
        campus_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        grade_level_id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
          nullable: true
        roll_no:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 999
        status:
          type: string
          default: "enrolled"
        enrolled_on:
          type: string
          format: date
        exited_on:
          type: string
          format: date
          nullable: true
        enrollment_period:
          type: string
          nullable: true
        promoted_from_enrollment_id:
          type: string
          format: uuid
          nullable: true
        is_repeating:
          type: boolean
          default: false
        exit_reason:
          type: string
          nullable: true
        remarks:
