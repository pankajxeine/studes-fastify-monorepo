openapi: 3.0.0
x-sql-table: sis_student_transfer
info:
  title: StudentTransferResponse API
  version: 1.0.0
paths:
  /student_transfer:
    get:
      operationId: listStudentTransfer
      summary: Get all student_transfer
      responses:
        '200':
          description: List of student_transfer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentTransferResponse'
    post:
      operationId: createStudentTransfer
      summary: Create a new student_transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransferRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransferResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /student_transfer/{id}:
    get:
      operationId: getStudentTransferById
      summary: Get student_transfer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: student_transfer object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransferResponse'
        '404':
          description: student_transfer not found
    put:
      operationId: updateStudentTransfer
      summary: Update student_transfer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentTransferUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTransferResponse'
        '400':
          description: Invalid request
        '404':
          description: student_transfer not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteStudentTransfer
      summary: Delete student_transfer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: student_transfer not found
components:
  schemas:

    StudentTransferRequest:
      type: object
      required:
        - student_id
        - direction
        - transfer_date
        - other_school_name
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
            - "incoming"
            - "outgoing"
        status:
          type: string
          default: "pending"
        transfer_date:
          type: string
          format: date
        other_school_name:
          type: string
        other_school_city:
          type: string
          nullable: true
        other_school_board:
          type: string
          nullable: true
        last_grade_completed:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        incoming_tc_no:
          type: string
          nullable: true
          maxLength: 40
        issued_certificate_id:
          type: string
          format: uuid
          nullable: true
        requested_by_person_id:
          type: string
          format: uuid
          nullable: true
        decided_by_user_id:
          type: string
          format: uuid
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        remarks:
          type: string
          nullable: true

    StudentTransferUpdateRequest:
      type: object
      required:
