openapi: 3.0.0
x-sql-table: admis_application_assessment
info:
  title: ApplicationAssessmentResponse API
  version: 1.0.0
paths:
  /application_assessment:
    get:
      operationId: listApplicationAssessment
      summary: Get all application_assessment
      responses:
        '200':
          description: List of application_assessment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationAssessmentResponse'
    post:
      operationId: createApplicationAssessment
      summary: Create a new application_assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationAssessmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAssessmentResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /application_assessment/{id}:
    get:
      operationId: getApplicationAssessmentById
      summary: Get application_assessment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: application_assessment object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAssessmentResponse'
        '404':
          description: application_assessment not found
    put:
      operationId: updateApplicationAssessment
      summary: Update application_assessment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationAssessmentUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAssessmentResponse'
        '400':
          description: Invalid request
        '404':
          description: application_assessment not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteApplicationAssessment
      summary: Delete application_assessment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: application_assessment not found
components:
