        - assessment_type
        - scheduled_at
        - ends_at
      additionalProperties: false
      properties:
        application_id:
          type: string
          format: uuid
        assessor_staff_id:
          type: string
          format: uuid
          nullable: true
        room_id:
          type: string
          format: uuid
          nullable: true
        assessment_type:
          type: string
          maxLength: 20
        scheduled_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        slot:
          type: string
          nullable: true
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "completed"
            - "no_show"
            - "cancelled"
        score:
          type: number
          format: double
          nullable: true
        max_score:
          type: number
          format: double
          nullable: true
        result:
          type: string
          nullable: true
          maxLength: 20
        remarks:
          type: string
          nullable: true

