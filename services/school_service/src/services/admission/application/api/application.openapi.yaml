        - has_sibling_in_school
        - application_fee_amount
        - is_fee_waived
      additionalProperties: false
      properties:
        admission_cycle_id:
          type: string
          format: uuid
        applicant_person_id:
          type: string
          format: uuid
        grade_level_id:
          type: string
          format: uuid
