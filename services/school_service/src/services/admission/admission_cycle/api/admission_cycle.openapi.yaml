        application_window:
          type: string
          nullable: true
        status:
          type: string
          default: "planned"
          enum:
            - "planned"
            - "open"
            - "closed"
        application_fee_amount:
          type: string
          default: 0
        offer_validity_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 90
          default: 14
        description:
          type: string
