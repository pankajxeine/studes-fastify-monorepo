openapi: 3.0.0
x-sql-table: admis_inquiry
info:
  title: InquiryResponse API
  version: 1.0.0
paths:
  /inquiry:
    get:
      operationId: listInquiry
      summary: Get all inquiry
      responses:
        '200':
          description: List of inquiry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InquiryResponse'
    post:
      operationId: createInquiry
      summary: Create a new inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /inquiry/{id}:
    get:
      operationId: getInquiryById
      summary: Get inquiry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: inquiry object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '404':
          description: inquiry not found
    put:
      operationId: updateInquiry
      summary: Update inquiry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '400':
          description: Invalid request
        '404':
          description: inquiry not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteInquiry
      summary: Delete inquiry by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: inquiry not found
components:
  schemas:

    InquiryRequest:
      type: object
      required:
        - campus_id
        - inquiry_no
        - contact_name
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
        academic_year_id:
          type: string
          format: uuid
          nullable: true
        program_id:
          type: string
          format: uuid
          nullable: true
        grade_level_id:
          type: string
          format: uuid
          nullable: true
        person_id:
          type: string
          format: uuid
          nullable: true
        assigned_to_staff_id:
          type: string
          format: uuid
          nullable: true
        inquiry_source_code:
          type: string
          default: "walk_in"
        inquiry_no:
          type: string
          maxLength: 30
        contact_name:
          type: string
        contact_email:
          type: string
          nullable: true
        contact_phone:
          type: string
          nullable: true
        prospect_name:
          type: string
          nullable: true
        prospect_date_of_birth:
          type: string
          format: date
          nullable: true
        status:
          type: string
          default: "new"
        received_at:
          type: string
          format: date-time
        next_follow_up_on:
          type: string
          format: date
          nullable: true
        visit_scheduled_at:
          type: string
          format: date-time
          nullable: true
        lost_reason:
          type: string
          nullable: true
        notes:
