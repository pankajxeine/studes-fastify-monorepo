          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        slot:
          type: string
          nullable: true
        meeting_mode:
          type: string
          maxLength: 10
          default: "in_person"
        student_id:
          type: string
          format: uuid
          nullable: true
        booked_by_guardian_id:
          type: string
          format: uuid
          nullable: true
        booked_at:
