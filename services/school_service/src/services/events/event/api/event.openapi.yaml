openapi: 3.0.0
x-sql-table: evnt_event
info:
  title: EventResponse API
  version: 1.0.0
paths:
  /event:
    get:
      operationId: listEvent
      summary: Get all event
      responses:
        '200':
          description: List of event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'
    post:
      operationId: createEvent
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request
        '409':
          description: Unique constraint conflict

  /event/{id}:
    get:
      operationId: getEventById
      summary: Get event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: event object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: event not found
    put:
      operationId: updateEvent
      summary: Update event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Invalid request
        '404':
          description: event not found
        '409':
          description: Unique constraint conflict
    delete:
      operationId: deleteEvent
      summary: Delete event by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: event not found
components:
  schemas:

    EventRequest:
      type: object
      required:
        - title
        - event_type
        - starts_at
        - ends_at
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        event_type:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_all_day:
          type: boolean
          default: false
        venue_room_id:
          type: string
          format: uuid
          nullable: true
        venue_text:
          type: string
          nullable: true
        organizer_staff_id:
          type: string
          format: uuid
          nullable: true
        banner_file_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: false
        requires_rsvp:
          type: boolean
          default: false
        rsvp_deadline_at:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "cancelled"
            - "completed"
        cancelled_reason:
          type: string
          nullable: true

    EventUpdateRequest:
      type: object
      required:
        - campus_id
        - title
        - description
        - event_type
        - starts_at
        - ends_at
        - is_all_day
        - venue_room_id
        - venue_text
        - organizer_staff_id
        - banner_file_id
        - is_public
        - requires_rsvp
        - rsvp_deadline_at
        - capacity
        - status
        - cancelled_reason
      additionalProperties: false
      properties:
        campus_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        event_type:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_all_day:
          type: boolean
          default: false
        venue_room_id:
          type: string
          format: uuid
          nullable: true
        venue_text:
          type: string
          nullable: true
        organizer_staff_id:
          type: string
          format: uuid
          nullable: true
        banner_file_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: false
        requires_rsvp:
          type: boolean
          default: false
        rsvp_deadline_at:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "cancelled"
            - "completed"
        cancelled_reason:
          type: string
          nullable: true

    EventResponse:
      type: object
      required:
        - id
        - public_id
        - record_code
        - event_id
        - title
        - event_type
        - starts_at
        - ends_at
        - is_all_day
        - is_public
        - requires_rsvp
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        record_code:
          type: string
          readOnly: true
        event_id:
          type: string
          format: uuid
          readOnly: true
        campus_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        event_type:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_all_day:
          type: boolean
          default: false
        venue_room_id:
          type: string
          format: uuid
          nullable: true
        venue_text:
          type: string
          nullable: true
        organizer_staff_id:
          type: string
          format: uuid
          nullable: true
        banner_file_id:
          type: string
          format: uuid
          nullable: true
        is_public:
          type: boolean
          default: false
        requires_rsvp:
          type: boolean
          default: false
        rsvp_deadline_at:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
          format: int32
          nullable: true
        status:
          type: string
          default: "scheduled"
          enum:
            - "scheduled"
            - "cancelled"
            - "completed"
        cancelled_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
  
