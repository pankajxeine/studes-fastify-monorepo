openapi: 3.0.0
info:
  title: SubStoreDetailsResponse API
  version: 1.0.0
paths:
  /sub_store_details:
    get:
      operationId: listSubStoreDetails
      summary: Get all sub_store_details
      responses:
        '200':
          description: List of sub_store_details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubStoreDetailsResponse'
    post:
      operationId: createSubStoreDetail
      summary: Create a new sub_store_details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubStoreDetailsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubStoreDetailsResponse'

  /sub_store_details/{id}:
    get:
      operationId: getSubStoreDetailsById
      summary: Get sub_store_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: sub_store_details object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubStoreDetailsResponse'
    put:
      operationId: updateSubStoreDetail
      summary: Update sub_store_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubStoreDetailsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubStoreDetailsResponse'
    delete:
      operationId: deleteSubStoreDetail
      summary: Delete sub_store_details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
