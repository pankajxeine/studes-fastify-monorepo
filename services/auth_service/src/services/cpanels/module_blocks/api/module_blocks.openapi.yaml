openapi: 3.0.0
info:
  title: ModuleBlocksResponse API
  version: 1.0.0
paths:
  /module_blocks:
    get:
      operationId: listModuleBlocks
      summary: Get all module_blocks
      responses:
        '200':
          description: List of module_blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleBlocksResponse'
    post:
      operationId: createModuleBlock
      summary: Create a new module_blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleBlocksRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleBlocksResponse'

  /module_blocks/{id}:
    get:
      operationId: getModuleBlocksById
      summary: Get module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: module_blocks object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleBlocksResponse'
    put:
      operationId: updateModuleBlock
      summary: Update module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleBlocksRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleBlocksResponse'
    delete:
      operationId: deleteModuleBlock
      summary: Delete module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    ModuleBlocksRequest:
      type: object
      properties:
        id:
          type: integer
        module_id:
          type: integer
        name:
          type: string
          maxLength: 50
        block_key:
          type: string
          maxLength: 100

    ModuleBlocksResponse:
      type: object
      properties:
        id:
          type: integer
        module_id:
          type: integer
        name:
          type: string
          maxLength: 50
        block_key:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
