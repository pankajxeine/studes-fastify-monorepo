openapi: 3.0.0
info:
  title: InstituteAuditLogsResponse API
  version: 1.0.0
paths:
  /institute_audit_logs:
    get:
      operationId: listInstituteAuditLogs
      summary: Get all institute_audit_logs
      responses:
        '200':
          description: List of institute_audit_logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstituteAuditLogsResponse'
    post:
      operationId: createInstituteAuditLog
      summary: Create a new institute_audit_logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteAuditLogsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteAuditLogsResponse'

  /institute_audit_logs/{id}:
    get:
      operationId: getInstituteAuditLogsById
      summary: Get institute_audit_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: institute_audit_logs object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteAuditLogsResponse'
    put:
      operationId: updateInstituteAuditLog
      summary: Update institute_audit_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteAuditLogsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteAuditLogsResponse'
    delete:
      operationId: deleteInstituteAuditLog
      summary: Delete institute_audit_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    InstituteAuditLogsRequest:
      type: object
      properties:
        id:
          type: integer
        institute_id:
          type: integer
        admin_user_id:
          type: integer
        action:
          type: string
          maxLength: 50
        module:
          type: string
          maxLength: 50
        payload:
          type: object
        ip_address:
          type: string
          maxLength: 20

    InstituteAuditLogsResponse:
      type: object
      properties:
        id:
          type: integer
        institute_id:
          type: integer
        admin_user_id:
          type: integer
        action:
          type: string
          maxLength: 50
        module:
          type: string
          maxLength: 50
        payload:
          type: object
        ip_address:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
  
