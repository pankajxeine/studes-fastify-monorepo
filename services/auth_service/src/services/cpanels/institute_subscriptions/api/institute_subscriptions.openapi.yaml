openapi: 3.0.0
info:
  title: InstituteSubscriptionsResponse API
  version: 1.0.0
paths:
  /institute_subscriptions:
    get:
      operationId: listInstituteSubscriptions
      summary: Get all institute_subscriptions
      responses:
        '200':
          description: List of institute_subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstituteSubscriptionsResponse'
    post:
      operationId: createInstituteSubscription
      summary: Create a new institute_subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteSubscriptionsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteSubscriptionsResponse'

  /institute_subscriptions/{id}:
    get:
      operationId: getInstituteSubscriptionsById
      summary: Get institute_subscriptions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: institute_subscriptions object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteSubscriptionsResponse'
    put:
      operationId: updateInstituteSubscription
      summary: Update institute_subscriptions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstituteSubscriptionsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstituteSubscriptionsResponse'
    delete:
      operationId: deleteInstituteSubscription
      summary: Delete institute_subscriptions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    InstituteSubscriptionsRequest:
      type: object
      properties:
        id:
          type: integer
        institute_id:
          type: integer
        subscription_plan_id:
          type: integer
        subscription_start_date:
          type: string
          format: date-time
        subscription_end_date:
          type: string
          format: date-time
        billing_cycle:
          type: string
        amount_paid:
          type: number
        payment_status:
          type: string
        subscription_status:
          type: string

    InstituteSubscriptionsResponse:
      type: object
      properties:
        id:
          type: integer
        institute_id:
          type: integer
        subscription_plan_id:
          type: integer
        subscription_start_date:
          type: string
          format: date-time
        subscription_end_date:
          type: string
          format: date-time
        billing_cycle:
          type: string
        amount_paid:
          type: number
        payment_status:
          type: string
        subscription_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
