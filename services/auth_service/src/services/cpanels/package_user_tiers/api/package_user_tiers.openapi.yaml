openapi: 3.0.0
info:
  title: PackageUserTiersResponse API
  version: 1.0.0
paths:
  /package_user_tiers:
    get:
      operationId: listPackageUserTiers
      summary: Get all package_user_tiers
      responses:
        '200':
          description: List of package_user_tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageUserTiersResponse'
    post:
      operationId: createPackageUserTier
      summary: Create a new package_user_tiers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageUserTiersRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageUserTiersResponse'

  /package_user_tiers/{id}:
    get:
      operationId: getPackageUserTiersById
      summary: Get package_user_tiers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: package_user_tiers object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageUserTiersResponse'
    put:
      operationId: updatePackageUserTier
      summary: Update package_user_tiers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageUserTiersRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageUserTiersResponse'
    delete:
      operationId: deletePackageUserTier
      summary: Delete package_user_tiers by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    PackageUserTiersRequest:
      type: object
      properties:
        id:
          type: integer
        user_tier_id:
          type: integer
        package_id:
          type: integer
        price:
          type: number
        cost_price:
          type: number
        status:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer

    PackageUserTiersResponse:
      type: object
      properties:
        id:
          type: integer
        user_tier_id:
          type: integer
        package_id:
          type: integer
        price:
          type: number
        cost_price:
          type: number
        status:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
