openapi: 3.0.0
info:
  title: BusinessHoursResponse API
  version: 1.0.0
paths:
  /business_hours:
    get:
      operationId: listBusinessHours
      summary: Get all business_hours
      responses:
        '200':
          description: List of business_hours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessHoursResponse'
    post:
      operationId: createBusinessHour
      summary: Create a new business_hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessHoursRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHoursResponse'

  /business_hours/{id}:
    get:
      operationId: getBusinessHoursById
      summary: Get business_hours by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: business_hours object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHoursResponse'
    put:
      operationId: updateBusinessHour
      summary: Update business_hours by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessHoursRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessHoursResponse'
    delete:
      operationId: deleteBusinessHour
      summary: Delete business_hours by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    BusinessHoursRequest:
      type: object
      properties:
        id:
          type: integer
        day:
          type: string
          maxLength: 10
        opening_time:
          type: string
          maxLength: 50
        closing_time:
          type: string
          maxLength: 50
        updated_by:
          type: integer

    BusinessHoursResponse:
      type: object
      properties:
        id:
          type: integer
        day:
          type: string
          maxLength: 10
        opening_time:
          type: string
          maxLength: 50
        closing_time:
          type: string
          maxLength: 50
        updated_by:
          type: integer
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
  
