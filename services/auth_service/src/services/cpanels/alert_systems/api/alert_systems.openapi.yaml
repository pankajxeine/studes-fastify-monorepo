openapi: 3.0.0
info:
  title: AlertSystemsResponse API
  version: 1.0.0
paths:
  /alert_systems:
    get:
      operationId: listAlertSystems
      summary: Get all alert_systems
      responses:
        '200':
          description: List of alert_systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertSystemsResponse'
    post:
      operationId: createAlertSystem
      summary: Create a new alert_systems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSystemsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemsResponse'

  /alert_systems/{id}:
    get:
      operationId: getAlertSystemsById
      summary: Get alert_systems by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: alert_systems object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemsResponse'
    put:
      operationId: updateAlertSystem
      summary: Update alert_systems by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSystemsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSystemsResponse'
    delete:
      operationId: deleteAlertSystem
      summary: Delete alert_systems by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    AlertSystemsRequest:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        alert_type:
          type: string
        sites_flag:
          type: string
        updated_by:
          type: integer
        created_by:
          type: integer

    AlertSystemsResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        alert_type:
          type: string
        sites_flag:
          type: string
        updated_by:
          type: integer
        created_by:
          type: integer
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
  
