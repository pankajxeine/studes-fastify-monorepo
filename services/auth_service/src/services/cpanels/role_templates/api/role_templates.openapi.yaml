openapi: 3.0.0
info:
  title: RoleTemplatesResponse API
  version: 1.0.0
paths:
  /role_templates:
    get:
      operationId: listRoleTemplates
      summary: Get all role_templates
      responses:
        '200':
          description: List of role_templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleTemplatesResponse'
    post:
      operationId: createRoleTemplate
      summary: Create a new role_templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleTemplatesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTemplatesResponse'

  /role_templates/{id}:
    get:
      operationId: getRoleTemplatesById
      summary: Get role_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: role_templates object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTemplatesResponse'
    put:
      operationId: updateRoleTemplate
      summary: Update role_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleTemplatesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleTemplatesResponse'
    delete:
      operationId: deleteRoleTemplate
      summary: Delete role_templates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    RoleTemplatesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200
        status:
          type: string

    RoleTemplatesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 200
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
