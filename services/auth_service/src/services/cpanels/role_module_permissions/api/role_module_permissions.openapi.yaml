openapi: 3.0.0
info:
  title: RoleModulePermissionsResponse API
  version: 1.0.0
paths:
  /role_module_permissions:
    get:
      operationId: listRoleModulePermissions
      summary: Get all role_module_permissions
      responses:
        '200':
          description: List of role_module_permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleModulePermissionsResponse'
    post:
      operationId: createRoleModulePermission
      summary: Create a new role_module_permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleModulePermissionsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleModulePermissionsResponse'

  /role_module_permissions/{id}:
    get:
      operationId: getRoleModulePermissionsById
      summary: Get role_module_permissions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: role_module_permissions object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleModulePermissionsResponse'
    put:
      operationId: updateRoleModulePermission
      summary: Update role_module_permissions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleModulePermissionsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleModulePermissionsResponse'
    delete:
      operationId: deleteRoleModulePermission
      summary: Delete role_module_permissions by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    RoleModulePermissionsRequest:
      type: object
      properties:
        id:
          type: integer
        role_id:
          type: integer
        module_id:
          type: integer
        permission:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer

    RoleModulePermissionsResponse:
      type: object
      properties:
        id:
          type: integer
        role_id:
          type: integer
        module_id:
          type: integer
        permission:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
