openapi: 3.0.0
info:
  title: IndustryCronsResponse API
  version: 1.0.0
paths:
  /industry_crons:
    get:
      operationId: listIndustryCrons
      summary: Get all industry_crons
      responses:
        '200':
          description: List of industry_crons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndustryCronsResponse'
    post:
      operationId: createIndustryCron
      summary: Create a new industry_crons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndustryCronsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryCronsResponse'

  /industry_crons/{id}:
    get:
      operationId: getIndustryCronsById
      summary: Get industry_crons by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: industry_crons object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryCronsResponse'
    put:
      operationId: updateIndustryCron
      summary: Update industry_crons by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndustryCronsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryCronsResponse'
    delete:
      operationId: deleteIndustryCron
      summary: Delete industry_crons by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    IndustryCronsRequest:
      type: object
      properties:
        id:
          type: integer
        industry_id:
          type: integer
        cron_id:
          type: integer

    IndustryCronsResponse:
      type: object
      properties:
        id:
          type: integer
        industry_id:
          type: integer
        cron_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
