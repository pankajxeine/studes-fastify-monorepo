openapi: 3.0.0
info:
  title: CustomerDevicesResponse API
  version: 1.0.0
paths:
  /customer_devices:
    get:
      operationId: listCustomerDevices
      summary: Get all customer_devices
      responses:
        '200':
          description: List of customer_devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDevicesResponse'
    post:
      operationId: createCustomerDevice
      summary: Create a new customer_devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDevicesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDevicesResponse'

  /customer_devices/{id}:
    get:
      operationId: getCustomerDevicesById
      summary: Get customer_devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: customer_devices object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDevicesResponse'
    put:
      operationId: updateCustomerDevice
      summary: Update customer_devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerDevicesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDevicesResponse'
    delete:
      operationId: deleteCustomerDevice
      summary: Delete customer_devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CustomerDevicesRequest:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        device_id:
          type: integer

    CustomerDevicesResponse:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        device_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
