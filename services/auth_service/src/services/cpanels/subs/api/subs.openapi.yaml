openapi: 3.0.0
info:
  title: SubsResponse API
  version: 1.0.0
paths:
  /subs:
    get:
      operationId: listSubs
      summary: Get all subs
      responses:
        '200':
          description: List of subs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubsResponse'
    post:
      operationId: createSub
      summary: Create a new subs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubsResponse'

  /subs/{id}:
    get:
      operationId: getSubsById
      summary: Get subs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: subs object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubsResponse'
    put:
      operationId: updateSub
      summary: Update subs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubsResponse'
    delete:
      operationId: deleteSub
      summary: Delete subs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
