          type: integer
        subdomain:
          type: string
          maxLength: 50
        protocol:
          type: string
          maxLength: 5
        shortname:
          type: string
          maxLength: 30
        database_name:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 50
        logo:
          type: string
          maxLength: 255
        cloud_print_logo:
          type: string
          maxLength: 255
        logo_zpl:
          type: string
        site_logo:
          type: string
          maxLength: 255
        favicon_icon:
          type: string
          maxLength: 255
        mobile_logo:
          type: string
          maxLength: 255
        industry_id:
          type: integer
        package_id:
          type: integer
        environment_id:
          type: integer
        industry_environment_id:
          type: integer
        auth_key:
          type: string
          maxLength: 50
        decimal_value:
          type: integer
        s3_folder:
          type: string
          maxLength: 100
        status:
          type: string
        site_created:
          type: string
        allow_package_upgrade:
          type: string
        permission_based_on:
          type: string
        source_of_creation:
          type: string
        default_role:
          type: integer
        is_role_synced:
          type: string
        language_id:
          type: integer
        currency_id:
          type: integer
        bundle_retail_price:
          type: number
        billing_frequency:
          type: string
        signup_date:
          type: string
          format: date-time
        last_access:
          type: string
          format: date-time
        deleted_at:
          type: string
