openapi: 3.0.0
info:
  title: FilterModuleFieldsResponse API
  version: 1.0.0
paths:
  /filter_module_fields:
    get:
      operationId: listFilterModuleFields
      summary: Get all filter_module_fields
      responses:
        '200':
          description: List of filter_module_fields
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterModuleFieldsResponse'
    post:
      operationId: createFilterModuleField
      summary: Create a new filter_module_fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterModuleFieldsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModuleFieldsResponse'

  /filter_module_fields/{id}:
    get:
      operationId: getFilterModuleFieldsById
      summary: Get filter_module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: filter_module_fields object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModuleFieldsResponse'
    put:
      operationId: updateFilterModuleField
      summary: Update filter_module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterModuleFieldsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterModuleFieldsResponse'
    delete:
      operationId: deleteFilterModuleField
      summary: Delete filter_module_fields by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    FilterModuleFieldsRequest:
      type: object
      properties:
        id:
          type: integer
        filter_module_id:
          type: integer
        field_name:
          type: string
          maxLength: 100
        field_key:
          type: string
          maxLength: 100

    FilterModuleFieldsResponse:
      type: object
      properties:
        id:
          type: integer
        filter_module_id:
          type: integer
        field_name:
          type: string
          maxLength: 100
        field_key:
          type: string
          maxLength: 100
  
