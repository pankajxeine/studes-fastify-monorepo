openapi: 3.0.0
info:
  title: DevicesResponse API
  version: 1.0.0
paths:
  /devices:
    get:
      operationId: listDevices
      summary: Get all devices
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevicesResponse'
    post:
      operationId: createDevice
      summary: Create a new devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'

  /devices/{id}:
    get:
      operationId: getDevicesById
      summary: Get devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: devices object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'
    put:
      operationId: updateDevice
      summary: Update devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'
    delete:
      operationId: deleteDevice
      summary: Delete devices by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    DevicesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        status:
          type: string
        device_type:
          type: string
        device_type_code:
          type: string
          maxLength: 150
        api_method:
          type: string
        verifone_package_id:
          type: string
          maxLength: 150
        contents:
          type: string
        videos:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        deleted_at:
          type: string
          format: date-time

    DevicesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 50
        status:
          type: string
        device_type:
          type: string
        device_type_code:
          type: string
          maxLength: 150
        api_method:
          type: string
        verifone_package_id:
          type: string
          maxLength: 150
        contents:
          type: string
        videos:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
  
