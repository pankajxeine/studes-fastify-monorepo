openapi: 3.0.0
info:
  title: WizardContentsResponse API
  version: 1.0.0
paths:
  /wizard_contents:
    get:
      operationId: listWizardContents
      summary: Get all wizard_contents
      responses:
        '200':
          description: List of wizard_contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WizardContentsResponse'
    post:
      operationId: createWizardContent
      summary: Create a new wizard_contents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardContentsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardContentsResponse'

  /wizard_contents/{id}:
    get:
      operationId: getWizardContentsById
      summary: Get wizard_contents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: wizard_contents object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardContentsResponse'
    put:
      operationId: updateWizardContent
      summary: Update wizard_contents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardContentsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardContentsResponse'
    delete:
      operationId: deleteWizardContent
      summary: Delete wizard_contents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    WizardContentsRequest:
      type: object
      properties:
        id:
          type: integer
        page_key:
          type: string
          maxLength: 50
        videos:
          type: string
        contents:
          type: string

    WizardContentsResponse:
      type: object
      properties:
        id:
          type: integer
        page_key:
          type: string
          maxLength: 50
        videos:
          type: string
        contents:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
