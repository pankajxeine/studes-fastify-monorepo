openapi: 3.0.0
info:
  title: CpanelModulesResponse API
  version: 1.0.0
paths:
  /cpanel_modules:
    get:
      operationId: listCpanelModules
      summary: Get all cpanel_modules
      responses:
        '200':
          description: List of cpanel_modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CpanelModulesResponse'
    post:
      operationId: createCpanelModule
      summary: Create a new cpanel_modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CpanelModulesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpanelModulesResponse'

  /cpanel_modules/{id}:
    get:
      operationId: getCpanelModulesById
      summary: Get cpanel_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: cpanel_modules object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpanelModulesResponse'
    put:
      operationId: updateCpanelModule
      summary: Update cpanel_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CpanelModulesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpanelModulesResponse'
    delete:
      operationId: deleteCpanelModule
      summary: Delete cpanel_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CpanelModulesRequest:
      type: object
      properties:
        id:
          type: integer
        module_name:
          type: string
          maxLength: 200
        module_key:
          type: string
          maxLength: 200

    CpanelModulesResponse:
      type: object
      properties:
        id:
          type: integer
        module_name:
          type: string
          maxLength: 200
        module_key:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
