openapi: 3.0.0
info:
  title: HardwaresResponse API
  version: 1.0.0
paths:
  /hardwares:
    get:
      operationId: listHardwares
      summary: Get all hardwares
      responses:
        '200':
          description: List of hardwares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HardwaresResponse'
    post:
      operationId: createHardware
      summary: Create a new hardwares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwaresRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwaresResponse'

  /hardwares/{id}:
    get:
      operationId: getHardwaresById
      summary: Get hardwares by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: hardwares object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwaresResponse'
    put:
      operationId: updateHardware
      summary: Update hardwares by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HardwaresRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HardwaresResponse'
    delete:
      operationId: deleteHardware
      summary: Delete hardwares by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
