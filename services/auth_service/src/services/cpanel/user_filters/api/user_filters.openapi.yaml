openapi: 3.0.0
info:
  title: UserFiltersResponse API
  version: 1.0.0
paths:
  /user_filters:
    get:
      operationId: listUserFilters
      summary: Get all user_filters
      responses:
        '200':
          description: List of user_filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserFiltersResponse'
    post:
      operationId: createUserFilter
      summary: Create a new user_filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFiltersRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFiltersResponse'

  /user_filters/{id}:
    get:
      operationId: getUserFiltersById
      summary: Get user_filters by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: user_filters object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFiltersResponse'
    put:
      operationId: updateUserFilter
      summary: Update user_filters by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFiltersRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFiltersResponse'
    delete:
      operationId: deleteUserFilter
      summary: Delete user_filters by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    UserFiltersRequest:
      type: object
      properties:
        id:
          type: integer
        filter_module_id:
          type: integer
        filter_name:
          type: string
          maxLength: 100
        filter_fields:
          type: object
        created_by:
          type: integer
        updated_by:
          type: integer
        deleted_at:
          type: string
          format: date-time

    UserFiltersResponse:
      type: object
      properties:
        id:
          type: integer
        filter_module_id:
          type: integer
        filter_name:
          type: string
          maxLength: 100
        filter_fields:
          type: object
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
  
