openapi: 3.0.0
info:
  title: CrmEmailConfigResponse API
  version: 1.0.0
paths:
  /crm_email_config:
    get:
      operationId: listCrmEmailConfig
      summary: Get all crm_email_config
      responses:
        '200':
          description: List of crm_email_config
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmEmailConfigResponse'
    post:
      operationId: createCrmEmailConfig
      summary: Create a new crm_email_config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmEmailConfigRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailConfigResponse'

  /crm_email_config/{id}:
    get:
      operationId: getCrmEmailConfigById
      summary: Get crm_email_config by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_email_config object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailConfigResponse'
    put:
      operationId: updateCrmEmailConfig
      summary: Update crm_email_config by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmEmailConfigRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEmailConfigResponse'
    delete:
      operationId: deleteCrmEmailConfig
      summary: Delete crm_email_config by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmEmailConfigRequest:
      type: object
      properties:
        id:
          type: integer
        host:
          type: string
          maxLength: 100
        port:
          type: integer
        user:
          type: string
          maxLength: 100
        pass:
          type: string
          maxLength: 100
        from:
          type: string
          maxLength: 100
        active:
          type: string

    CrmEmailConfigResponse:
      type: object
      properties:
        id:
          type: integer
        host:
          type: string
          maxLength: 100
        port:
          type: integer
        user:
          type: string
          maxLength: 100
        pass:
          type: string
          maxLength: 100
        from:
          type: string
          maxLength: 100
        active:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
