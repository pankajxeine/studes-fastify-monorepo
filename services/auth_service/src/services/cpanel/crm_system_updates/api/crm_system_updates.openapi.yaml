                items:
                  $ref: '#/components/schemas/CrmSystemUpdatesResponse'
    post:
      operationId: createCrmSystemUpdate
      summary: Create a new crm_system_updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmSystemUpdatesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
