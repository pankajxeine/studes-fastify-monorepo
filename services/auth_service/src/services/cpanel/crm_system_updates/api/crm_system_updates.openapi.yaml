  /crm_system_updates/{id}:
    get:
      operationId: getCrmSystemUpdatesById
      summary: Get crm_system_updates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_system_updates object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmSystemUpdatesResponse'
    put:
      operationId: updateCrmSystemUpdate
      summary: Update crm_system_updates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmSystemUpdatesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmSystemUpdatesResponse'
    delete:
      operationId: deleteCrmSystemUpdate
      summary: Delete crm_system_updates by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
