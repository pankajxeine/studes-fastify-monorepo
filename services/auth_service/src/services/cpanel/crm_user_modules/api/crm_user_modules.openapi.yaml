openapi: 3.0.0
info:
  title: CrmUserModulesResponse API
  version: 1.0.0
paths:
  /crm_user_modules:
    get:
      operationId: listCrmUserModules
      summary: Get all crm_user_modules
      responses:
        '200':
          description: List of crm_user_modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmUserModulesResponse'
    post:
      operationId: createCrmUserModule
      summary: Create a new crm_user_modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmUserModulesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmUserModulesResponse'

  /crm_user_modules/{id}:
    get:
      operationId: getCrmUserModulesById
      summary: Get crm_user_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_user_modules object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmUserModulesResponse'
    put:
      operationId: updateCrmUserModule
      summary: Update crm_user_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmUserModulesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmUserModulesResponse'
    delete:
      operationId: deleteCrmUserModule
      summary: Delete crm_user_modules by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmUserModulesRequest:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        module_id:
          type: integer
        permission:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer

    CrmUserModulesResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        module_id:
          type: integer
        permission:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
