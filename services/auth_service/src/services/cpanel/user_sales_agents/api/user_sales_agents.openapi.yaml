openapi: 3.0.0
info:
  title: UserSalesAgentsResponse API
  version: 1.0.0
paths:
  /user_sales_agents:
    get:
      operationId: listUserSalesAgents
      summary: Get all user_sales_agents
      responses:
        '200':
          description: List of user_sales_agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSalesAgentsResponse'
    post:
      operationId: createUserSalesAgent
      summary: Create a new user_sales_agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSalesAgentsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSalesAgentsResponse'

  /user_sales_agents/{id}:
    get:
      operationId: getUserSalesAgentsById
      summary: Get user_sales_agents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: user_sales_agents object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSalesAgentsResponse'
    put:
      operationId: updateUserSalesAgent
      summary: Update user_sales_agents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSalesAgentsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSalesAgentsResponse'
    delete:
      operationId: deleteUserSalesAgent
      summary: Delete user_sales_agents by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    UserSalesAgentsRequest:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        sales_agent_id:
          type: integer

    UserSalesAgentsResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        sales_agent_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
