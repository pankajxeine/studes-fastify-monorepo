openapi: 3.0.0
info:
  title: AssetsLogsResponse API
  version: 1.0.0
paths:
  /assets_logs:
    get:
      operationId: listAssetsLogs
      summary: Get all assets_logs
      responses:
        '200':
          description: List of assets_logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetsLogsResponse'
    post:
      operationId: createAssetsLog
      summary: Create a new assets_logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetsLogsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsLogsResponse'

  /assets_logs/{id}:
    get:
      operationId: getAssetsLogsById
      summary: Get assets_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: assets_logs object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsLogsResponse'
    put:
      operationId: updateAssetsLog
      summary: Update assets_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetsLogsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsLogsResponse'
    delete:
      operationId: deleteAssetsLog
      summary: Delete assets_logs by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    AssetsLogsRequest:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
          maxLength: 50
        file_name:
          type: string
          maxLength: 150

    AssetsLogsResponse:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
          maxLength: 50
        file_name:
          type: string
          maxLength: 150
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
