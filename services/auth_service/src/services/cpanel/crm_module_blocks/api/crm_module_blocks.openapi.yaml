openapi: 3.0.0
info:
  title: CrmModuleBlocksResponse API
  version: 1.0.0
paths:
  /crm_module_blocks:
    get:
      operationId: listCrmModuleBlocks
      summary: Get all crm_module_blocks
      responses:
        '200':
          description: List of crm_module_blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrmModuleBlocksResponse'
    post:
      operationId: createCrmModuleBlock
      summary: Create a new crm_module_blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmModuleBlocksRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModuleBlocksResponse'

  /crm_module_blocks/{id}:
    get:
      operationId: getCrmModuleBlocksById
      summary: Get crm_module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: crm_module_blocks object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModuleBlocksResponse'
    put:
      operationId: updateCrmModuleBlock
      summary: Update crm_module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmModuleBlocksRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmModuleBlocksResponse'
    delete:
      operationId: deleteCrmModuleBlock
      summary: Delete crm_module_blocks by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CrmModuleBlocksRequest:
      type: object
      properties:
        id:
          type: integer
        crm_module_id:
          type: integer
        name:
          type: string
          maxLength: 50
        sequence:
          type: integer
        block_key:
          type: string
          maxLength: 100

    CrmModuleBlocksResponse:
      type: object
      properties:
        id:
          type: integer
        crm_module_id:
          type: integer
        name:
          type: string
          maxLength: 50
        sequence:
          type: integer
        block_key:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
