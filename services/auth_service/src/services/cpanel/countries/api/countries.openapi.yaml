openapi: 3.0.0
info:
  title: CountriesResponse API
  version: 1.0.0
paths:
  /countries:
    get:
      operationId: listCountries
      summary: Get all countries
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountriesResponse'
    post:
      operationId: createCountrie
      summary: Create a new countries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountriesRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'

  /countries/{id}:
    get:
      operationId: getCountriesById
      summary: Get countries by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: countries object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
    put:
      operationId: updateCountrie
      summary: Update countries by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountriesRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
    delete:
      operationId: deleteCountrie
      summary: Delete countries by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
components:
  schemas:

    CountriesRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 30
        iso_code:
          type: string
          maxLength: 3
        iso3_code:
          type: string
          maxLength: 3
        status:
          type: string
        language_id:
          type: integer
        currency_id:
          type: integer

    CountriesResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 30
        iso_code:
          type: string
          maxLength: 3
        iso3_code:
          type: string
          maxLength: 3
        status:
          type: string
        language_id:
          type: integer
        currency_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  
