openapi: 3.0.3
info:
  title: Cpanel Route API
  version: 0.1.0
servers:
  - url: http://localhost:3001
paths:
  /cpanel-users:
    get:
      operationId: getCpanelUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCpanelUsersResponse'
components:
  schemas:
    GetCpanelUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/CpanelUser'
    CpanelUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
      required: [id, email, created_at]
        